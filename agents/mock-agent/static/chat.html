<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Agent — Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1rem; font-weight: 600; }
    header span { font-size: .75rem; color: #64748b; background: #1e3a5f; padding: 2px 8px; border-radius: 4px; }
    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: .9rem; line-height: 1.6; white-space: pre-wrap; }
    .msg--user { background: #1d4ed8; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg--agent { background: #1e293b; border: 1px solid #334155; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg--thinking { color: #64748b; font-style: italic; }
    .input-area { background: #1e293b; border-top: 1px solid #334155; padding: 16px 24px; display: flex; gap: 12px; }
    textarea { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 10px 14px; font-size: .9rem; resize: none; outline: none; font-family: inherit; }
    textarea:focus { border-color: #3b82f6; }
    button { background: #1d4ed8; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: .9rem; cursor: pointer; }
    button:hover { background: #2563eb; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .badge { font-size: .7rem; padding: 2px 6px; border-radius: 4px; background: #064e3b; color: #34d399; }
  </style>
</head>
<body>
  <header>
    <h1>Mock Agent</h1>
    <span class="badge">UAP-managed LLM</span>
    <span style="margin-left:auto;font-size:.75rem;color:#64748b" id="status">Ready</span>
  </header>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <textarea id="input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="send-btn" onclick="send()">Send</button>
  </div>
  <script>
    const history = [];
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');

    function appendMsg(role, text) {
      const div = document.createElement('div');
      div.className = `msg msg--${role === 'user' ? 'user' : 'agent'}${text === '...' ? ' msg--thinking' : ''}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      sendBtn.disabled = true;
      statusEl.textContent = 'Thinking...';
      appendMsg('user', text);
      const thinking = appendMsg('agent', '...');
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        thinking.textContent = data.response;
        thinking.classList.remove('msg--thinking');
        history.push({ role: 'user', content: text });
        history.push({ role: 'assistant', content: data.response });
        statusEl.textContent = `${data.tokens_used} tokens`;
      } catch (err) {
        thinking.textContent = `Error: ${err.message}`;
        thinking.style.color = '#f87171';
      }
      sendBtn.disabled = false;
    }
  </script>
</body>
</html>
