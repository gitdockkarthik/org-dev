services:

  # ── Data store ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kafka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kafka_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafka -d kafka_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Kafka Analyser ──────────────────────────────────────────────────────────
  kafka-analyser:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://kafka:${POSTGRES_PASSWORD}@postgres:5432/kafka_db
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MODEL: ${MODEL:-claude-sonnet-4-6}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
