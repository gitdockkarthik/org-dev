apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-analyser
  namespace: <namespace>
  labels:
    app: kafka-analyser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-analyser
  template:
    metadata:
      labels:
        app: kafka-analyser
    spec:
      containers:
        - name: kafka-analyser
          image: <ecr-repo>/kafka-analyser:1.0.0
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: kafka-analyser-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kafka-analyser-secrets
                  key: database-url
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kafka-analyser-secrets
                  key: encryption-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
