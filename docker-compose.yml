services:

  # ── Data store ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Kafka: No-Auth (Cluster A test target) ──────────────────────────────────
  kafka-no-auth:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-no-auth:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-no-auth:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Kafka: SASL (Cluster B test target) ─────────────────────────────────────
  kafka-sasl:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-sasl:9095
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:9094,CONTROLLER://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka-sasl:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - ./config/kafka-sasl-jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"admin\" password=\"admin-secret\";' > /tmp/hc.properties && kafka-topics --bootstrap-server localhost:9094 --list --command-config /tmp/hc.properties"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Platform backend ────────────────────────────────────────────────────────
  # Holds ANTHROPIC_API_KEY and forwards it to agents via X-Anthropic-Key header.
  # No agent or portal env vars leak into this service.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-none}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Agent: Alert Analyser ───────────────────────────────────────────────────
  # No ANTHROPIC_API_KEY — key is injected per-request via X-Anthropic-Key header
  # by the backend orchestrator. Direct invocation (make test) requires the header.
  alert-analyser:
    build:
      context: ./agents/alert-analyser
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ALERT_ANALYSER_PORT:-8001}:8001"
    environment:
      AGENT_ID: ${ALERT_ANALYSER_AGENT_ID}
      AGENT_SLUG: alert-analyser
      AGENT_NAME: Alert Analyser
      MODEL: ${MODEL:-claude-sonnet-4-6}
      NOISE_THRESHOLD_REPEAT: ${NOISE_THRESHOLD_REPEAT:-3}
      NOISE_THRESHOLD_CLOSE_SECS: ${NOISE_THRESHOLD_CLOSE_SECS:-300}
      REGISTRY_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      - backend

  # ── Agent: CUR Analyser ─────────────────────────────────────────────────────
  # No ANTHROPIC_API_KEY — key is injected per-request via X-Anthropic-Key header.
  cur-analyser:
    build:
      context: ./agents/cur-analyser
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CUR_ANALYSER_PORT:-8002}:8002"
    environment:
      AGENT_ID: ${CUR_ANALYSER_AGENT_ID}
      AGENT_SLUG: cur-analyser
      AGENT_NAME: CUR Analyser
      MODEL: ${MODEL:-claude-sonnet-4-6}
      REGISTRY_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      - backend

  # ── Agent: Kafka Analyser ───────────────────────────────────────────────────
  kafka-analyser:
    build:
      context: ./agents/kafka-analyser
    restart: unless-stopped
    ports:
      - "${KAFKA_ANALYSER_PORT:-8003}:8003"
    environment:
      REGISTRY_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-postgres}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MODEL: ${MODEL:-claude-sonnet-4-6}
      AGENT_SLUG: kafka-analyser
    depends_on:
      - backend
      - postgres
      - kafka-no-auth
      - kafka-sasl

  # ── Portal ──────────────────────────────────────────────────────────────────
  # Knows only BACKEND_URL and BACKEND_API_KEY — no DB, no Anthropic, no agents.
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-3000}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORTAL_USERNAME: ${PORTAL_USERNAME:-}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      AUTH_MODE: ${AUTH_MODE:-none}
    depends_on:
      - backend

volumes:
  pgdata:
