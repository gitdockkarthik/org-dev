services:

  # ── Data store ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Platform backend ────────────────────────────────────────────────────────
  # Holds ANTHROPIC_API_KEY and forwards it to agents via X-Anthropic-Key header.
  # No agent or portal env vars leak into this service.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-us-east5}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-none}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Agent: Alert Analyser ───────────────────────────────────────────────────
  # No ANTHROPIC_API_KEY — key is injected per-request via X-Anthropic-Key header
  # by the backend orchestrator. Direct invocation (make test) requires the header.
  alert-analyser:
    build:
      context: .
      dockerfile: agents/alert-analyser/Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${ALERT_ANALYSER_PORT:-8001}:8001"
    environment:
      AGENT_ID: ${ALERT_ANALYSER_AGENT_ID}
      AGENT_SLUG: alert-analyser
      AGENT_NAME: Alert Analyser
      MODEL: ${MODEL:-claude-sonnet-4-6}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-us-east5}
      NOISE_THRESHOLD_REPEAT: ${NOISE_THRESHOLD_REPEAT:-3}
      NOISE_THRESHOLD_CLOSE_SECS: ${NOISE_THRESHOLD_CLOSE_SECS:-300}
      REGISTRY_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      - backend

  # ── Agent: CUR Analyser ─────────────────────────────────────────────────────
  # No ANTHROPIC_API_KEY — key is injected per-request via X-Anthropic-Key header.
  cur-analyser:
    build:
      context: .
      dockerfile: agents/cur-analyser/Dockerfile
    restart: unless-stopped
    mem_limit: 4g
    ports:
      - "${CUR_ANALYSER_PORT:-8002}:8002"
    environment:
      AGENT_ID: ${CUR_ANALYSER_AGENT_ID}
      AGENT_SLUG: cur-analyser
      AGENT_NAME: CUR Analyser
      MODEL: ${MODEL:-claude-sonnet-4-6}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-us-east5}
      REGISTRY_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Inventory enrichment is opt-in; disabled by default (zero impact when off).
      ENABLE_INVENTORY_ENRICHMENT: ${ENABLE_INVENTORY_ENRICHMENT:-true}
      # Permanent on-disk CUR file storage (file-path pipeline for large files).
      CUR_DATA_DIR: /app/data/cur
    volumes:
      # Persist uploaded CUR files across container rebuilds. The DB only keeps
      # report metadata (csv_data is empty for file-path reports), so the files
      # themselves must live on a durable volume.
      - cur_analyser_data:/app/data
    depends_on:
      - backend

  # ── MCP Server ────────────────────────────────────────────────────────────────
  # Model Context Protocol gateway — exposes all agents as MCP tools.
  mcp-server:
    build: ./mcp-server
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      KAFKA_ANALYSER_URL: http://kafka-analyser:8003
      ALERT_ANALYSER_URL: http://alert-analyser:8001
      CUR_ANALYSER_URL: http://cur-analyser:8002
    depends_on:
      - kafka-analyser
      - alert-analyser
      - cur-analyser

  # ── Agent: Kafka Analyser ───────────────────────────────────────────────────
  kafka-analyser:
    build:
      context: .
      dockerfile: agents/kafka-analyser/Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${KAFKA_ANALYSER_PORT:-8003}:8003"
    environment:
      REGISTRY_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-postgres}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MODEL: ${MODEL:-claude-sonnet-4-6}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-us-east5}
      AGENT_SLUG: kafka-analyser
    depends_on:
      - backend
      - postgres

  # ── Agent: Mock Agent ───────────────────────────────────────────────────────
  # Demonstrates UAP LLM gateway integration — uses token vending instead of direct key.
  mock-agent:
    build: ./agents/mock-agent
    ports:
      - "8099:8099"
    environment:
      - UAP_URL=http://backend:8000
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - REGISTRY_URL=http://backend:8000
      - AGENT_SLUG=mock-agent
      - AGENT_NAME=Mock Agent
      - PORT=8099
    depends_on:
      - backend
    restart: unless-stopped

  # ── Portal ──────────────────────────────────────────────────────────────────
  # Knows only BACKEND_URL and BACKEND_API_KEY — no DB, no Anthropic, no agents.
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-3000}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORTAL_USERNAME: ${PORTAL_USERNAME:-}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      AUTH_MODE: ${AUTH_MODE:-none}
    depends_on:
      - backend

volumes:
  pgdata:
  cur_analyser_data:
