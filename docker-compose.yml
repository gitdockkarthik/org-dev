services:

  # ── Data store ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 1g
    shm_size: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Platform backend ────────────────────────────────────────────────────────
  # Holds ANTHROPIC_API_KEY and forwards it to agents via X-Anthropic-Key header.
  # No agent or portal env vars leak into this service.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INTERNAL_URL: http://langfuse:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-us-east5}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-none}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Agent: Alert Analyser ───────────────────────────────────────────────────
  # No ANTHROPIC_API_KEY — key is injected per-request via X-Anthropic-Key header
  # by the backend orchestrator. Direct invocation (make test) requires the header.
  alert-analyser:
    build:
      context: .
      dockerfile: agents/alert-analyser/Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${ALERT_ANALYSER_PORT:-8001}:8001"
    environment:
      AGENT_ID: ${ALERT_ANALYSER_AGENT_ID}
      AGENT_SLUG: alert-analyser
      AGENT_NAME: Alert Analyser
      MODEL: ${MODEL:-claude-sonnet-4-6}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-us-east5}
      NOISE_THRESHOLD_REPEAT: ${NOISE_THRESHOLD_REPEAT:-3}
      NOISE_THRESHOLD_CLOSE_SECS: ${NOISE_THRESHOLD_CLOSE_SECS:-300}
      REGISTRY_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse:3000
    depends_on:
      - backend

  # ── Agent: CUR Analyser ─────────────────────────────────────────────────────
  # No ANTHROPIC_API_KEY — key is injected per-request via X-Anthropic-Key header.
  cur-analyser:
    build:
      context: .
      dockerfile: agents/cur-analyser/Dockerfile
    restart: unless-stopped
    mem_limit: 4g
    ports:
      - "${CUR_ANALYSER_PORT:-8002}:8002"
    environment:
      AGENT_ID: ${CUR_ANALYSER_AGENT_ID}
      AGENT_SLUG: cur-analyser
      AGENT_NAME: CUR Analyser
      MODEL: ${MODEL:-claude-sonnet-4-6}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-us-east5}
      REGISTRY_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Inventory enrichment is opt-in; disabled by default (zero impact when off).
      ENABLE_INVENTORY_ENRICHMENT: ${ENABLE_INVENTORY_ENRICHMENT:-true}
      # Permanent on-disk CUR file storage (file-path pipeline for large files).
      CUR_DATA_DIR: /app/data/cur
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse:3000
    volumes:
      # Persist uploaded CUR files across container rebuilds. The DB only keeps
      # report metadata (csv_data is empty for file-path reports), so the files
      # themselves must live on a durable volume.
      - cur_analyser_data:/app/data
    depends_on:
      - backend

  # ── Job Server ────────────────────────────────────────────────────────────────
  # Background job orchestrator for async task execution.
  job-server:
    build: ./job-server
    container_name: org-dev-job-server
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      DATABASE_URL: postgresql+asyncpg://operative:${POSTGRES_PASSWORD}@postgres:5432/operative_db
      API_KEY: ${BACKEND_API_KEY}
      PORT: 8020
    ports:
      - "${JOB_SERVER_PORT:-8020}:8020"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis (required for Langfuse v3 queue) ────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 32m
    command: redis-server --requirepass ${REDIS_PASSWORD:-langfuse123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-langfuse123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible storage for Langfuse v3) ─────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 64m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-langfuse123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket initializer ───────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-langfuse} ${MINIO_ROOT_PASSWORD:-langfuse123};
      mc mb --ignore-existing local/langfuse-events;
      echo 'Bucket created';
      "

  # ── ClickHouse (required for Langfuse v3) ────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    ports:
      - "${CLICKHOUSE_METRICS_PORT:-9363}:9363"
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-langfuse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./monitoring/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Langfuse ─────────────────────────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:3
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse_db
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      TELEMETRY_ENABLED: "false"
      AUTH_DISABLE_SIGNUP: "true"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-langfuse}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD:-langfuse123}
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse-events"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-langfuse123}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: operative
      LANGFUSE_INIT_ORG_NAME: Operative
      LANGFUSE_INIT_PROJECT_ID: operative-ai
      LANGFUSE_INIT_PROJECT_NAME: Operative Intelligence
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${ADMIN_PASSWORD}
      LANGFUSE_BASEPATH: /langfuse
      NEXTAUTH_URL: http://kpi-internal.cloud.operative.com:3000/langfuse

  # ── Langfuse Worker (processes trace queue) ───────────────────────────────
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse_db
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-langfuse}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD:-langfuse123}
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse-events"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-langfuse123}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
      ENCRYPTION_KEY: ${LANGFUSE_NEXTAUTH_SECRET}

  # ── MCP Server ────────────────────────────────────────────────────────────────
  # Model Context Protocol gateway — exposes all agents as MCP tools.
  mcp-server:
    build: ./mcp-server
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    ports:
      - "8005:8005"
    environment:
      KAFKA_ANALYSER_URL: http://kafka-analyser:8003
      ALERT_ANALYSER_URL: http://alert-analyser:8001
      CUR_ANALYSER_URL: http://cur-analyser:8002
    depends_on:
      - kafka-analyser
      - alert-analyser
      - cur-analyser

  # ── Agent: Kafka Analyser ───────────────────────────────────────────────────
  kafka-analyser:
    build:
      context: .
      dockerfile: agents/kafka-analyser/Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    ports:
      - "${KAFKA_ANALYSER_PORT:-8003}:8003"
    environment:
      REGISTRY_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-postgres}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MODEL: ${MODEL:-claude-sonnet-4-6}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${VERTEX_REGION:-us-east5}
      AGENT_SLUG: kafka-analyser
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse:3000
    depends_on:
      - backend
      - postgres

  # ── Agent: Mock Agent ───────────────────────────────────────────────────────
  # Demonstrates UAP LLM gateway integration — uses token vending instead of direct key.
  mock-agent:
    build: ./agents/mock-agent
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    ports:
      - "8099:8099"
    environment:
      - UAP_URL=http://backend:8000
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - REGISTRY_URL=http://backend:8000
      - AGENT_SLUG=mock-agent
      - AGENT_NAME=Mock Agent
      - PORT=8099
    depends_on:
      - backend

  # ── Portal ──────────────────────────────────────────────────────────────────
  # Knows only BACKEND_URL and BACKEND_API_KEY — no DB, no Anthropic, no agents.
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    ports:
      - "${PORTAL_PORT:-3000}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORTAL_USERNAME: ${PORTAL_USERNAME:-}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      AUTH_MODE: ${AUTH_MODE:-none}
      LANGFUSE_URL: ${LANGFUSE_URL:-http://localhost:3001}
      PORTAL_HOST: ${PORTAL_HOST:-localhost:3000}
    depends_on:
      - backend

  # ── Monitoring: Prometheus ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    ports:
      - "${PROMETHEUS_PORT:-8006}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - node-exporter
      - cadvisor

  # ── Monitoring: Grafana ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    ports:
      - "${GRAFANA_PORT:-8007}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - postgres

  # ── Monitoring: postgres_exporter ───────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-operative}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-operative_db}?sslmode=disable"
    depends_on:
      - postgres

  # ── Monitoring: redis_exporter ──────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-langfuse123}
    depends_on:
      - redis

  # ── Monitoring: node_exporter (KPI box host metrics -- CPU, memory, disk) ──────
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /data:/host/data:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  # ── Monitoring: cadvisor (per-container CPU, memory, restarts) ─────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    ports:
      - "${CADVISOR_PORT:-9101}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true

volumes:
  pgdata:
  cur_analyser_data:
  redis_data:
  clickhouse_data:
  minio_data:
  prometheus_data:
  grafana_data:
