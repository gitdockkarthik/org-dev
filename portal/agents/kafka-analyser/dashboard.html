          ${_sloSubTab === 'dashboard' ? renderSLODashboardHTML(data) : renderSLOSettingsHTML()}
        </div>`;
    }

    function setSLORange(hours) {
      _sloHours = hours;
      renderSLO(_sloData);
      loadSLODashboard();
    }

    function switchSLOTab(tab) {
      _sloSubTab = tab;
      if (tab === 'dashboard') {
        renderSLO(_sloData);
        loadSLODashboard();
      } else {
        renderSLO(null);
        loadSLOSettings();
      }
    }

    function sloColor(status) {
      return status === 'green' ? '#4CAF50' : status === 'amber' ? '#FF9800' : status === 'red' ? '#F44336' : status === 'na' ? '#999' : '#666';
    }
    function sloIcon(status) {
      return status === 'green' ? '✅' : status === 'amber' ? '⚠️' : status === 'red' ? '🔴' : status === 'na' ? '⊖' : '—';
    }
    function sloArrow(pct, target) {
      if (pct === null || pct === undefined) return '';
      if (pct >= target) return '<span style="color:#4CAF50">↑</span>';
      if (pct >= target * 0.9) return '<span style="color:#FF9800">→</span>';
      return '<span style="color:#F44336">↓</span>';
    }

    function renderSLODashboardHTML(data) {
      if (!data) return '<div style="text-align:center;padding:40px;color:var(--text-muted)">⟳ Loading SLO data...</div>';
      const c = data.current || {};
      const t = data.targets || {};
      const col = s => s==='green'?'#4CAF50':s==='amber'?'#FF9800':s==='red'?'#F44336':'#666';
      const icon = s => s==='green'?'✅':s==='amber'?'⚠️':s==='red'?'🔴':'—';
      const badge = (s,l) => { const _s=s||'unknown'; return `<span style="background:${col(_s)}22;color:${col(_s)};padding:2px 8px;border-radius:12px;font-size:.75rem;font-weight:700">${icon(_s)} ${l}</span>`; };
      const overallPct = data.trend&&data.trend.length>0?(data.trend[data.trend.length-1].overall_pct||0):(c.connector_availability_pct||0);
      const overallStatus = overallPct>=95?'green':overallPct>=80?'amber':'red';

      // ── 1. SLO Compliance (top) ──────────────────────────────────────────
      const sloRows = [
        {label:'Connector Availability', target:`>${t.connector_availability||99}%`, current:c.connector_status==='na' ? 'N/A' : `${c.connector_availability_pct||0}%`, status:c.connector_status},
        {label:'Task Health', target:`>${t.min_task_health_pct||95}%`, current:c.task_status==='na' ? 'N/A' : `${c.task_health_pct||0}%`, status:c.task_status||'unknown'},
        {label:'Consumer Lag', target:`<${(t.consumer_lag||10000).toLocaleString()}`, current:(c.consumer_lag||0) >= 1000000 ? `${((c.consumer_lag||0)/1000000).toFixed(1)}M` : (c.consumer_lag||0) >= 1000 ? `${((c.consumer_lag||0)/1000).toFixed(1)}K` : `${c.consumer_lag||0}`, status:c.lag_status},
        {label:'Broker Availability', target:`${t.expected_brokers||3}/3`, current:`${c.broker_count||0}/${c.expected_brokers||3} online`, status:c.broker_status},
        {label:'Under-replicated Partitions', target:`=${t.urp||0}`, current:`${c.urp||0}`, status:c.urp_status},
        {label:'Broker CPU', target:`<${t.max_broker_cpu_pct||85}%`, current:`${c.avg_cpu||0}%`, status:c.cpu_status||'unknown'},
        {label:'Broker Heap', target:`<${t.max_broker_heap_pct||80}%`, current:`${c.avg_heap||0}%`, status:c.heap_status||'unknown'},
      ];
      const section1 = `
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px">
          <div class="chart-card" style="flex:0 0 200px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div class="chart-card__title">Overall Compliance</div>
            <div style="position:relative;width:160px;height:160px">
              <canvas id="slo-donut" width="160" height="160"></canvas>
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center">
                <div style="font-size:1.8rem;font-weight:700;color:${col(overallStatus)}">${overallPct.toFixed(1)}%</div>
                <div style="font-size:.7rem;color:var(--text-muted)">${_sloHours}h window</div>
              </div>
            </div>
            <div style="margin-top:8px">${badge(overallStatus,overallStatus.toUpperCase())}</div>
          </div>
          <div class="chart-card" style="flex:2;min-width:300px">
            <div class="chart-card__title">Compliance Trend</div>
            <div class="chart-wrap" style="height:200px"><canvas id="slo-overall-trend-chart"></canvas></div>
          </div>
          <div class="chart-card" style="flex:1;min-width:300px">
            <div class="chart-card__title">SLO Status</div>
            <table style="width:100%;border-collapse:collapse;font-size:.83rem">
              <thead><tr style="color:var(--text-muted);font-size:.72rem;border-bottom:1px solid var(--border)">
                <th style="text-align:left;padding:6px 4px">SLO</th>
                <th style="text-align:center;padding:6px 4px">Target</th>
                <th style="text-align:center;padding:6px 4px">Current</th>
                <th style="text-align:center;padding:6px 4px">Status</th>
              </tr></thead>
              <tbody>${sloRows.map(r=>`
                <tr style="border-top:1px solid var(--border)">
                  <td style="padding:10px 4px;font-weight:600">${r.label}</td>
                  <td style="text-align:center;padding:10px 4px;color:var(--text-muted);font-size:.8rem">${r.target}</td>
                  <td style="text-align:center;padding:10px 4px;font-weight:700;color:${col(r.status)}">${r.current}</td>
                  <td style="text-align:center;padding:10px 4px">${badge(r.status,r.status.toUpperCase())}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;

      // ── 2. Cluster Infrastructure Health ────────────────────────────────
      const section2 = `
        <div class="chart-card" style="margin-bottom:16px">
          <div class="chart-card__title">🖥 Cluster Infrastructure Health</div>
          <div style="display:flex;gap:0;flex-wrap:wrap;align-items:center">
            <div style="flex:1;min-width:120px;text-align:center;padding:12px;border-right:1px solid var(--border)">
              <canvas id="slo-gauge-cpu" width="100" height="60"></canvas>
              <div style="font-size:.72rem;color:var(--text-muted)">Avg CPU</div>
            </div>
            <div style="flex:1;min-width:120px;text-align:center;padding:12px;border-right:1px solid var(--border)">
              <canvas id="slo-gauge-heap" width="100" height="60"></canvas>
              <div style="font-size:.72rem;color:var(--text-muted)">Avg Heap</div>
            </div>
            <div style="flex:1;min-width:100px;text-align:center;padding:12px;border-right:1px solid var(--border)">
              <div style="font-size:1.8rem;font-weight:700;color:${col(c.broker_status)}">${c.broker_count||0}</div>
              <div style="font-size:.72rem;color:var(--text-muted)">Brokers</div>
              <div>${badge(c.broker_status,'OK')}</div>
            </div>
            <div style="flex:1;min-width:100px;text-align:center;padding:12px;border-right:1px solid var(--border)">
              <div style="font-size:1.8rem;font-weight:700;color:${col(c.urp_status)}">${c.urp||0}</div>
              <div style="font-size:.72rem;color:var(--text-muted)">URP</div>
              <div>${badge(c.urp_status,c.urp===0?'OK':'RISK')}</div>
            </div>
            <div style="flex:1;min-width:140px;text-align:center;padding:12px">
              ${c.connector_status === 'na' ? `
                <div style="font-size:1.2rem;font-weight:700;color:var(--text-muted)">—</div>
                <div style="font-size:.72rem;color:var(--text-muted)">Kafka Connect not configured</div>
              ` : `
                <div style="font-size:1.5rem;font-weight:700;color:${col(c.connector_status)}">${c.connector_running||0}<span style="font-size:.9rem;color:var(--text-muted)">/${(c.connector_running||0)+(c.connector_failed||0)}</span></div>
                <div style="font-size:.72rem;color:var(--text-muted)">${c.connector_paused||0} paused (excl.)</div>
                <div>${badge(c.connector_status,(c.connector_availability_pct||0)+'%')}</div>
              `}
            </div>
          </div>
        </div>`;

      // ── 3. Connector Availability ────────────────────────────────────────
      const connectors = (data.connectors||[]).sort((a,b)=>{
        const score=cn=>cn.state==='FAILED'?0:cn.state==='RUNNING'&&cn.failed_tasks>0?1:cn.state==='RUNNING'?2:cn.state==='PAUSED'?3:4;
        const taskPct=cn=>cn.total_tasks>0?cn.running_tasks/cn.total_tasks:1;
        const s=score(a)-score(b);
        return s!==0?s:taskPct(a)-taskPct(b);
      });
      const topOffenders = connectors.filter(cn=>cn.state==='FAILED'||(cn.state==='RUNNING'&&cn.failed_tasks>0)).slice(0,5);
      const section3 = c.connector_status === 'na' ? `
        <div class="chart-card" style="margin-bottom:16px">
          <div class="chart-card__title">🔌 Connector Availability</div>
          <div style="padding:24px;text-align:center;color:var(--text-muted)">
            <div style="font-size:2rem;margin-bottom:8px">🔌</div>
            <div style="font-weight:600;margin-bottom:4px">No Kafka Connect Configured</div>
            <div style="font-size:.82rem">This cluster has no Kafka Connect workers. Add a Connect URL in cluster Settings to enable connector monitoring.</div>
          </div>
        </div>` : `
        <div class="chart-card" style="margin-bottom:16px">
          <div class="chart-card__title">🔌 Connector Availability
            <button onclick="window._openSLOPopup('connectors')" style="float:right;background:none;border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:.75rem;color:var(--accent)">🔍 View All ${connectors.length}</button>
          </div>
          <div class="chart-wrap" style="height:160px;margin-bottom:12px"><canvas id="slo-conn-trend-chart"></canvas></div>
          ${topOffenders.length>0?`
          <div style="font-size:.78rem;font-weight:600;color:var(--text-muted);margin-bottom:6px">⚠️ Top Anomalies</div>
          <table style="width:100%;border-collapse:collapse;font-size:.8rem">
            <thead><tr style="color:var(--text-muted);font-size:.72rem">
              <th style="text-align:left;padding:4px">Connector</th><th style="text-align:center;padding:4px">State</th><th style="text-align:center;padding:4px">Tasks</th><th style="text-align:center;padding:4px">Task SLI</th>
            </tr></thead>
            <tbody>${topOffenders.map(cn=>{
              const stateCol=cn.state==='FAILED'?'#F44336':cn.state==='PAUSED'?'#FF9800':cn.failed_tasks>0?'#FF5722':'#4CAF50';
              const taskPct=cn.total_tasks>0?Math.round(cn.running_tasks/cn.total_tasks*100):0;
              const taskStatus=cn.failed_tasks===0?badge('green','100%'):taskPct>=80?badge('amber',taskPct+'%'):badge('red',taskPct+'%');
              return `<tr style="border-top:1px solid var(--border)">
                <td style="padding:6px 4px"><code style="font-size:.72rem">${cn.name}</code></td>
                <td style="text-align:center;padding:6px 4px"><span style="color:${stateCol};font-weight:700">${cn.state}</span></td>
                <td style="text-align:center;padding:6px 4px">${cn.running_tasks||0}/${cn.total_tasks||0}${cn.failed_tasks>0?`<span style="color:#F44336"> (${cn.failed_tasks}✗)</span>`:''}</td>
                <td style="text-align:center;padding:6px 4px">${taskStatus}</td>
              </tr>`;
            }).join('')}</tbody>
          </table>`:'<div style="color:#4CAF50;font-size:.82rem;padding:8px">✅ All connectors healthy</div>'}
        </div>`;

      // ── 4. Consumer Lag ──────────────────────────────────────────────────
      const section4 = `
        <div class="chart-card" style="margin-bottom:16px">
          <div class="chart-card__title">📊 Consumer Lag
            <button onclick="window._openSLOPopup('lag')" style="float:right;background:none;border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:.75rem;color:var(--accent)">🔍 View All Groups</button>
          </div>
          <div class="chart-wrap" style="height:160px;margin-bottom:12px"><canvas id="slo-lag-trend-chart"></canvas></div>
          <div id="slo-top-lag-groups"><div style="color:var(--text-muted);font-size:.82rem">Loading top lag groups...</div></div>
        </div>`;

      // ── 5. Topics ────────────────────────────────────────────────────────
      const section5 = `
        <div class="chart-card" style="margin-bottom:16px">
          <div class="chart-card__title">📦 Topics by Size
            <button onclick="window._openSLOPopup('topics')" style="float:right;background:none;border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:.75rem;color:var(--accent)">🔍 View All Topics</button>
          </div>
          <div class="chart-wrap" style="height:200px"><canvas id="slo-topic-size-chart"></canvas></div>
          <div id="slo-top-topics-table" style="margin-top:12px"></div>
        </div>`;

      const section6 = `
        <div class="chart-card" style="margin-bottom:16px">
          <div class="chart-card__title">📅 Monthly SLO Comparison
            <span style="font-size:.72rem;color:var(--text-muted);font-weight:400;margin-left:8px">Month-over-month compliance trend</span>
          </div>
          <div id="slo-monthly-content"><div style="color:var(--text-muted);font-size:.82rem;padding:8px">Loading...</div></div>
        </div>`;
      return section1 + section2 + section3 + section4 + section5 + section6;
    }

    function renderSLOSettingsHTML() {
      const field = (id, label, hint, min=0, max=100, step=1) => `
        <div>
          <label style="display:block;font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:2px">${label}</label>
          ${hint?`<div style="font-size:.72rem;color:var(--text-muted);margin-bottom:4px">${hint}</div>`:''}
          <input type="number" id="${id}" min="${min}" max="${max}" step="${step}"
            style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--navy-1);color:var(--text)">
        </div>`;
      return `
        <div class="chart-card" style="max-width:560px">
          <div class="chart-card__title">⚙️ SLO Targets — per cluster configuration</div>
          <div style="display:flex;flex-direction:column;gap:14px;padding:8px 0">
            <div style="font-size:.78rem;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px">🔌 Connector SLOs</div>
            ${field('slo-conn-target','Connector Availability Target (%)','% of non-paused connectors that must be RUNNING',0,100,0.1)}
            ${field('slo-task-target','Min Task Health (%)','% of active connectors with ALL tasks healthy',0,100,0.1)}
            ${field('slo-failed-tasks-target','Max Failed Tasks','Maximum number of failed tasks allowed (0 = zero tolerance)',0,9999,1)}
            <div style="font-size:.78rem;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;margin-top:4px">📊 Consumer SLOs</div>
            ${field('slo-lag-target','Max Consumer Lag (messages)','Total lag across all groups above this = SLO breach',0,999999999,1)}
            <div style="font-size:.78rem;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;margin-top:4px">🖥 Infrastructure SLOs</div>
            ${field('slo-cpu-target','Max Broker CPU (%)','Average CPU across all brokers',0,100,0.1)}
            ${field('slo-heap-target','Max Broker Heap (%)','Average heap usage across all brokers',0,100,0.1)}
            ${field('slo-urp-target','Max Under-replicated Partitions','0 = all partitions must be fully replicated',0,9999,1)}
            <button class="btn btn--primary" onclick="saveSLOSettings()">Save Targets</button>
            <div id="slo-settings-msg" style="font-size:.82rem;color:var(--success)"></div>
          </div>
        </div>`;
    }

    async function loadSLODashboard() {
      const cid = _currentClusterId || document.getElementById('ctrl-cluster')?.value || '';
      if (!cid) return;
      try {
        const data = await fetch(`${PROXY}/slo/dashboard?cluster_id=${cid}&hours=${_sloHours}`, { headers: _authHeaders(), cache: 'no-store' }).then(r => r.json());
        _sloData = data;
        const el = document.getElementById('slo-sub-content');
        if (el && _sloSubTab === 'dashboard') el.innerHTML = renderSLODashboardHTML(data);
        setTimeout(() => {
          const c = data.current || {};
          const trend = data.trend || [];
          const labels = trend.map(t => {
            const d = new Date(t.time);
            return _sloHours <= 24 ? d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString([],{month:'short',day:'numeric'});
          });

          // Draw half-donut gauges for CPU and Heap
          function drawGauge(canvasId, pct, label) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const color = pct >= 85 ? '#F44336' : pct >= 70 ? '#FF9800' : '#4CAF50';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Background arc
            ctx.beginPath();
            ctx.arc(50, 55, 40, Math.PI, 2*Math.PI);
            ctx.lineWidth = 10;
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.stroke();
            // Value arc
            ctx.beginPath();
            ctx.arc(50, 55, 40, Math.PI, Math.PI + (pct/100)*Math.PI);
            ctx.lineWidth = 10;
            ctx.strokeStyle = color;
            ctx.stroke();
            // Text
            ctx.fillStyle = color;
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(pct+'%', 50, 52);
          }

          // Get avg CPU and heap from broker data
          fetch(`${PROXY}/dashboard/brokers?cluster_id=${cid}`, { headers: _authHeaders() })
            .then(r => r.json()).then(bd => {
              const brokers = bd.brokers || [];
              const avgCpu = brokers.length ? Math.round(brokers.reduce((s,b) => s+(b.cpu_pct||0), 0)/brokers.length) : 0;
              const avgHeap = brokers.length ? Math.round(brokers.reduce((s,b) => s+(b.heap_pct||0), 0)/brokers.length) : 0;
              drawGauge('slo-gauge-cpu', avgCpu, 'CPU');
              drawGauge('slo-gauge-heap', avgHeap, 'Heap');
            }).catch(() => {});

          // Donut chart for overall compliance
          const overallPct = trend.length > 0 ? (trend[trend.length-1].overall_pct || 0) : (c.connector_availability_pct || 0);
          const donutCtx = document.getElementById('slo-donut')?.getContext('2d');
          if (donutCtx) {
            const color = overallPct >= 95 ? '#4CAF50' : overallPct >= 80 ? '#FF9800' : '#F44336';
            new Chart(donutCtx, {
              type: 'doughnut',
              data: { datasets: [{ data: [overallPct, 100-overallPct],
                backgroundColor: [color, 'rgba(255,255,255,0.08)'], borderWidth: 0 }] },
              options: { responsive: false, cutout: '75%', plugins: { legend: { display: false }, tooltip: { enabled: false } } }
            });
          }

          // Connector availability trend — from snapshots (every 2 min)
          fetch(`${PROXY}/slo/connector-trend?cluster_id=${cid}&hours=${_sloHours}`, { headers: _authHeaders() })
            .then(r => r.json()).then(ct => {
              const connCtx = document.getElementById('slo-conn-trend-chart')?.getContext('2d');
              if (!connCtx) return;
              const pts = ct.points || [];
              if (pts.length > 1) {
                const ctLabels = pts.map(p => {
                  const d = new Date(p.time);
                  return _sloHours <= 24 ? d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString([],{month:'short',day:'numeric'});
                });
                new Chart(connCtx, {
                  type: 'line',
                  data: { labels: ctLabels, datasets: [
                    { label: 'Running', data: pts.map(p => p.running), borderColor: '#4CAF50', backgroundColor: 'rgba(76,175,80,0.2)', borderWidth: 2, tension: 0.3, fill: true, pointRadius: 0 },
                    { label: 'Failed', data: pts.map(p => p.failed), borderColor: '#F44336', backgroundColor: 'rgba(244,67,54,0.2)', borderWidth: 2, tension: 0.3, fill: true, pointRadius: 0 },
                    { label: 'Paused', data: pts.map(p => p.paused), borderColor: '#FF9800', backgroundColor: 'rgba(255,152,0,0.1)', borderWidth: 1, tension: 0.3, fill: true, pointRadius: 0, borderDash: [4,4] },
                  ]},
                  options: { responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: true, position: 'bottom', labels: { boxWidth: 10, font: {size:10} } } },
                    scales: { y: { beginAtZero: true, stacked: false, ticks: { font: {size:10} } },
                              x: { ticks: { maxTicksLimit: 12, font: {size:10}, maxRotation: 45 } } } }
                });
              } else {
                connCtx.canvas.parentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:.82rem">Collecting data...</div>';
              }
            }).catch(() => {});

          // Overall compliance trend
          setTimeout(() => {
            const overallCanvas = document.getElementById('slo-overall-trend-chart');
            if (!overallCanvas) return;
            const overallTrendCtx = overallCanvas.getContext('2d');
            const trendData = data.trend || [];
            if (trendData.length > 0) {
              const tLabels = trendData.map(t => {
                const d2 = new Date(t.time);
                return _sloHours <= 24 ? d2.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : d2.toLocaleDateString([],{month:'short',day:'numeric'});
              });
              new Chart(overallTrendCtx, {
                type: 'line',
                data: { labels: tLabels, datasets: [
                  { label: 'Overall %', data: trendData.map(t => t.overall_pct ? Math.min(100, t.overall_pct) : null),
                    borderColor: '#FF6B35', backgroundColor: 'rgba(255,107,53,0.15)', borderWidth: 2, tension: 0.3, fill: true, pointRadius: 3 },
                ]},
                options: { responsive: true, maintainAspectRatio: false,
                  plugins: { legend: { display: true, position: 'bottom', labels: { boxWidth: 10, font: {size:10} } } },
                  scales: { y: { min:0, max:100, ticks: { callback: v => v+'%', font:{size:10} } },
                            x: { ticks: { maxTicksLimit: 8, font:{size:10} } } } }
              });
            } else {
              overallCanvas.parentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:.78rem">Hourly data accumulates at :05</div>';
            }
          }, 250);

          // Consumer lag trend
          const lagCtx = document.getElementById('slo-lag-trend-chart')?.getContext('2d');
          // Fetch lag snapshots
          fetch(`${PROXY}/dashboard/overview/lag-trend?cluster_id=${cid}&minutes=${_sloHours*60}`, { headers: _authHeaders() })
            .then(r => r.json()).then(ld => {
              if (!lagCtx) return;
              const pts = ld.points || [];
              if (pts.length > 1) {
                const lagLabels = pts.map(p => {
                  const d = new Date(p.time);
                  return _sloHours <= 24 ? d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString([],{month:'short',day:'numeric'});
                });

                        <div style="font-size:.7rem;font-weight:600;color:${c}">${b}</div>

              el.innerHTML = '<canvas id="slo-monthly-chart" height="120"></canvas>';
              setTimeout(() => {
                const ctx = document.getElementById('slo-monthly-chart')?.getContext('2d');

                new Chart(ctx, {

                      {label:'Connector', data:months.map(m=>m.connector_pct), backgroundColor:'#4CAF50', borderWidth:0},
                      {label:'Consumer Lag', data:months.map(m=>m.lag_pct), backgroundColor:'#F44336', borderWidth:0},
                      {label:'URP', data:months.map(m=>m.urp_pct), backgroundColor:'#4FC3F7', borderWidth:0},

                  options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: {size:10} } }, tooltip: { callbacks: { title: ctx => ctx[0]?.dataset?.label || '', label: ctx => {

                    return `<tr style="border-top:1px solid var(--border)">
                      <td style="padding:6px 4px"><code style="font-size:.72rem">${g.group_id}</code></td>
                      <td style="text-align:right;padding:6px 4px;font-weight:700;color:${col}">${lag>=1000000?(lag/1000000).toFixed(1)+'M':lag>=1000?(lag/1000).toFixed(0)+'K':lag}</td>
                    </tr>`;
                  }).join('')}</tbody>

          // Load topics size chart

                  </tr></thead>

    // ── SLO Popups ────────────────────────────────────────────────────────
    window._openSLOPopup = async function(type) {
      const cid = _currentClusterId || document.getElementById('ctrl-cluster')?.value || '';
      // Create overlay + popup
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999';
      const popup = document.createElement('div');
      popup.style.cssText = 'position:fixed;top:5%;left:5%;right:5%;bottom:5%;background:var(--navy-2);border-radius:12px;z-index:1000;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5)';
      const closeBtn = `<button onclick="this.closest('[data-slo-popup]').remove();document.getElementById('slo-overlay').remove()" style="background:none;border:none;cursor:pointer;font-size:1.4rem;color:var(--text-muted)">×</button>`;
      overlay.id = 'slo-overlay';
      popup.setAttribute('data-slo-popup','1');
      document.body.appendChild(overlay);
      document.body.appendChild(popup);
      overlay.onclick = () => { popup.remove(); overlay.remove(); };

      if (type === 'connectors') {
        popup.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)">
          <span style="font-weight:700;font-size:1rem">🔌 All Connectors</span>${closeBtn}</div>
          <div style="padding:12px 20px;border-bottom:1px solid var(--border);display:flex;gap:8px">
            <input id="slo-conn-search" placeholder="Search connector..." oninput="window._filterSLOConnectors()"
              style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--navy-1);color:var(--text);font-size:.82rem;width:250px">
            <select id="slo-conn-filter" onchange="window._filterSLOConnectors()" style="padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--navy-1);color:var(--text);font-size:.82rem">
              <option value="all">All States</option>
              <option value="FAILED">Failed</option>
              <option value="RUNNING">Running</option>
              <option value="PAUSED">Paused</option>
            </select>
          </div>
          <div style="overflow-y:auto;flex:1;padding:0 20px 20px">
            <table class="data-table" style="width:100%">
              <thead><tr><th>Connector</th><th>Type</th><th>State</th><th>Tasks</th><th>Task SLI</th></tr></thead>
              <tbody id="slo-conn-tbody"></tbody>
            </table>
          </div>`;
        window._sloConnectorData = (_sloData&&_sloData.connectors||[]).sort((a,b)=>{
          const score=cn=>cn.state==='FAILED'?0:cn.state==='RUNNING'&&cn.failed_tasks>0?1:cn.state==='RUNNING'?2:3;
          const taskPct=cn=>cn.total_tasks>0?cn.running_tasks/cn.total_tasks:1;
          const s=score(a)-score(b);
          return s!==0?s:taskPct(a)-taskPct(b);
        });
        window._filterSLOConnectors = function() {
          const q = (document.getElementById('slo-conn-search')?.value||'').toLowerCase();
          const f = document.getElementById('slo-conn-filter')?.value||'all';
          const filtered = window._sloConnectorData.filter(cn =>
            (f==='all'||cn.state===f) && (!q||cn.name.toLowerCase().includes(q))
          );
          const tbody = document.getElementById('slo-conn-tbody');
          if (!tbody) return;
          tbody.innerHTML = filtered.map(cn=>{
            const sc=cn.state==='FAILED'?'#F44336':cn.state==='PAUSED'?'#FF9800':cn.failed_tasks>0?'#FF5722':'#4CAF50';
            const tp=cn.total_tasks>0?Math.round(cn.running_tasks/cn.total_tasks*100):0;
            const ts=cn.state==='PAUSED'?'— excl.':cn.failed_tasks===0?'✅ 100%':tp>=80?`⚠️ ${tp}%`:`🔴 ${tp}%`;
            return `<tr><td><code style="font-size:.75rem">${cn.name}</code></td>
              <td style="font-size:.8rem;text-transform:capitalize">${cn.type||'—'}</td>
              <td><span style="color:${sc};font-weight:600">${cn.state}</span></td>
              <td>${cn.running_tasks||0}/${cn.total_tasks||0}${cn.failed_tasks>0?` <span style="color:#F44336">(${cn.failed_tasks}✗)</span>`:''}</td>
              <td>${ts}</td></tr>`;
          }).join('') || '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-muted)">No matches</td></tr>';
        };
        window._filterSLOConnectors();

      } else if (type === 'lag') {
        popup.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)">
          <span style="font-weight:700;font-size:1rem">📊 Consumer Groups by Lag</span>${closeBtn}</div>
          <div style="overflow-y:auto;flex:1;padding:0 20px 20px">
            <div style="text-align:center;padding:20px;color:var(--text-muted)">⟳ Loading...</div>
          </div>`;
        fetch(`${PROXY}/dashboard/consumer-groups?cluster_id=${cid}`, { headers: _authHeaders() })
          .then(r=>r.json()).then(gd=>{
            const groups = gd.consumer_groups||[];
            popup.querySelector('div:last-child').innerHTML = `
              <table class="data-table" style="width:100%;margin-top:12px">
                <thead><tr><th>Group</th><th style="text-align:right">Total Lag</th><th>Status</th></tr></thead>
                <tbody>${groups.map(g=>{
                  const lag=g.total_lag||0;
                  const s=lag>10000?'red':lag>1000?'amber':'green';
                  const sc=s==='red'?'#F44336':s==='amber'?'#FF9800':'#4CAF50';
                  return `<tr><td><code style="font-size:.75rem">${g.group_id}</code></td>
                    <td style="text-align:right;font-weight:700;color:${sc}">${lag>=1000000?(lag/1000000).toFixed(1)+'M':lag>=1000?(lag/1000).toFixed(0)+'K':lag}</td>
                    <td>${s==='red'?'🔴 Critical':s==='amber'?'⚠️ Warning':'✅ OK'}</td></tr>`;
                }).join('')}</tbody>
              </table>`;
          }).catch(e=>{ popup.querySelector('div:last-child').innerHTML = `<div style="color:var(--danger)">Error: ${e.message}</div>`; });

      } else if (type === 'topics') {
        popup.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)">
          <span style="font-weight:700;font-size:1rem">📦 Topics by Size</span>${closeBtn}</div>
          <div style="overflow-y:auto;flex:1;padding:0 20px 20px">
            <div style="text-align:center;padding:20px;color:var(--text-muted)">⟳ Loading...</div>
          </div>`;
        fetch(`${PROXY}/dashboard/topics?cluster_id=${cid}&limit=100&offset=0`, { headers: _authHeaders() })
          .then(r=>r.json()).then(td=>{
            const topics = td.topics||[];
            popup.querySelector('div:last-child').innerHTML = `
              <table class="data-table" style="width:100%;margin-top:12px">
                <thead><tr><th>Topic</th><th style="text-align:right">Size</th><th style="text-align:center">Partitions</th><th style="text-align:center">RF</th></tr></thead>
                <tbody>${topics.map(tp=>{
                  const sz=tp.size_bytes||0;
                  const sc=sz>50*1024**3?'#F44336':sz>10*1024**3?'#FF9800':'var(--text)';
                  return `<tr><td><code style="font-size:.75rem">${tp.name||tp.topic}</code></td>
                    <td style="text-align:right;font-weight:700;color:${sc}">${(sz/1024**3).toFixed(1)}GB</td>
                    <td style="text-align:center">${tp.partition_count||0}</td>
                    <td style="text-align:center">${tp.replication_factor||0}</td></tr>`;
                }).join('')}</tbody>
              </table>`;
          }).catch(e=>{ popup.querySelector('div:last-child').innerHTML = `<div style="color:var(--danger)">Error: ${e.message}</div>`; });
      }
    };

    async function loadSLOSettings() {
      const cid = _currentClusterId || document.getElementById('ctrl-cluster')?.value || '';
      if (!cid) return;
      try {
        const t = await fetch(`${PROXY}/slo/targets?cluster_id=${cid}`, { headers: _authHeaders() }).then(r => r.json());
        document.getElementById('slo-conn-target').value = t.connector_availability_target || 99;
        document.getElementById('slo-task-target').value = t.min_task_health_pct || 95;
        document.getElementById('slo-failed-tasks-target').value = t.max_failed_tasks || 0;
        document.getElementById('slo-lag-target').value = t.consumer_lag_target || 10000;
        document.getElementById('slo-cpu-target').value = t.max_broker_cpu_pct || 85;
        document.getElementById('slo-heap-target').value = t.max_broker_heap_pct || 80;
        document.getElementById('slo-urp-target').value = t.urp_target || 0;
      } catch(e) { console.warn('SLO settings load failed', e); }
    }

    async function saveSLOSettings() {
      const cid = _currentClusterId || document.getElementById('ctrl-cluster')?.value || '';
      try {
        await fetch(`${PROXY}/slo/targets?cluster_id=${cid}`, {
          method: 'POST', headers: { ..._authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({
            connector_availability_target: parseFloat(document.getElementById('slo-conn-target').value),
            min_task_health_pct: parseFloat(document.getElementById('slo-task-target').value),
            max_failed_tasks: parseInt(document.getElementById('slo-failed-tasks-target').value),
            consumer_lag_target: parseInt(document.getElementById('slo-lag-target').value),
            max_broker_cpu_pct: parseFloat(document.getElementById('slo-cpu-target').value),
            max_broker_heap_pct: parseFloat(document.getElementById('slo-heap-target').value),
            urp_target: parseInt(document.getElementById('slo-urp-target').value),
          })
        });
        document.getElementById('slo-settings-msg').textContent = '✅ Saved';
        setTimeout(() => { if(document.getElementById('slo-settings-msg')) document.getElementById('slo-settings-msg').textContent = ''; }, 3000);
      } catch(e) { showToast('Failed to save: ' + e.message, 'error'); }
    }

          ${kv('URL', data.url || '-')}
          ${kv('Max Latency', (m.max_latency_ms || 0) + 'ms')}
          ${kv('Outstanding Requests', (m.outstanding_requests || 0).toLocaleString())}
          ${kv('Data Size', fmtBytes(m.data_size_bytes || 0))}
          ${kv('Open FDs / Max FDs', `${m.open_file_descriptors || 0} / ${m.max_file_descriptors || 0}`)}
        </div>`;

      el.innerHTML = zkKpis + zkCharts + warningBanners + zkDetail;

      setTimeout(() => {
        if (window._zkMetricsChart) { window._zkMetricsChart.destroy(); window._zkMetricsChart = null; }
        const mCtx = document.getElementById('zk-metrics-chart')?.getContext('2d');
        if (mCtx) {
          window._zkMetricsChart = new Chart(mCtx, {
            type: 'bar',
            data: {
              labels: ['Znodes', 'Watches', 'Ephemerals', 'Connections'],
              datasets: [{ label: 'Count', data: [m.znode_count || 0, m.watch_count || 0, m.ephemerals_count || 0, m.connections || 0], backgroundColor: '#4FC3F7', borderWidth: 0 }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false }, title: { display: false } },
              scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, ticks: { callback: v => fmtNum(v), font: { size: 10 } } } },
            },
          });
        }

        if (window._zkPacketsChart) { window._zkPacketsChart.destroy(); window._zkPacketsChart = null; }
        const pCtx = document.getElementById('zk-packets-chart')?.getContext('2d');
        if (pCtx) {
          window._zkPacketsChart = new Chart(pCtx, {
            type: 'bar',
            data: {
              labels: ['Packets Received', 'Packets Sent'],
              datasets: [{ label: 'Packets', data: [m.packets_received || 0, m.packets_sent || 0], backgroundColor: ['#4CAF50', '#FF6B35'], borderWidth: 0 }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false }, title: { display: false } },
              scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, ticks: { callback: v => fmtNum(v), font: { size: 10 } } } },
            },
          });
        }
      }, 0);
      window._renderTabAI('zookeeper', document.getElementById('tab-zookeeper'));
    }

    function renderMirrorMaker(data) {
      const el = document.getElementById('tab-mirrormaker');

      if (!data.detected) {
        el.innerHTML = `<div class="filter-bar" style="color:var(--text-muted)">ℹ️ No MirrorMaker detected on this cluster</div>`;
        return;
      }

      const modeColors = {
        'mm1': '#f59e0b',
        'mm2': '#3b82f6',
        'both': '#8b5cf6',
      };
      const modeColor = modeColors[data.mode] || 'var(--text)';

      const groupCount = (data.mm1 && data.mm1.group_count) ?? (data.mm2 && data.mm2.group_count) ?? 0;
      const totalLag   = (data.mm1 && data.mm1.total_lag) ?? (data.mm2 && data.mm2.total_lag) ?? 0;
      const mmStatus   = (data.mm1 && (data.mm1.health || data.mm1.status)) || (data.mm2 && (data.mm2.health || data.mm2.status)) || 'unknown';
      const isHealthy  = mmStatus === 'healthy';
      const lagClass   = totalLag > 10000 ? 'kpi--danger' : totalLag > 1000 ? 'kpi--warn' : 'kpi--success';

      const mmKpis = `
        <div class="kpi-grid">
          <div class="kpi">
            <div class="kpi__label">Mode</div>
            <div class="kpi__value"><span style="background:${modeColor}22;color:${modeColor};padding:3px 12px;border-radius:20px;font-size:.95rem;font-weight:700;text-transform:uppercase">${data.mode || '-'}</span></div>
            <div class="kpi__sub">replication mode</div>
          </div>
          <div class="kpi kpi--orange">
            <div class="kpi__label">Consumer Groups</div>
            <div class="kpi__value">${groupCount}</div>
            <div class="kpi__sub">replication groups</div>
          </div>
          <div class="kpi ${lagClass}">
            <div class="kpi__label">Total Lag</div>
            <div class="kpi__value">${fmtNum(totalLag)}</div>
            <div class="kpi__sub">across groups</div>
          </div>
          <div class="kpi ${isHealthy ? 'kpi--success' : 'kpi--danger'}">
            <div class="kpi__label">Status</div>
            <div class="kpi__value"><span class="sev sev--${isHealthy ? 'healthy' : 'warning'}">${mmStatus.toUpperCase()}</span></div>
            <div class="kpi__sub">health</div>
          </div>
        </div>`;

      // Per-group lag bars (mm1 group names have no per-group lag → single "All Groups" bar)
      const lagSrc = data.mm1 || data.mm2 || {};
      const cgs = lagSrc.consumer_groups;
      let lagBars;
      if (Array.isArray(cgs) && cgs.length && typeof cgs[0] === 'object' && cgs[0] !== null) {
        lagBars = cgs.map(g => ({ name: g.group_id || g.name || g.group || 'group', lag: g.lag ?? g.total_lag ?? 0 }));
      } else {
        lagBars = [{ name: 'All Groups', lag: totalLag }];
      }
      const barColor = lag => lag > 10000 ? '#dc2626' : lag > 1000 ? '#d97706' : '#16a34a';

      const mmChart = `
        <div style="display:flex;margin-bottom:22px">
          <div class="chart-card" style="flex:0 1 50%;min-width:300px">
            <div class="chart-card__title">MirrorMaker Consumer Group Lag</div>
            <div class="chart-wrap" style="height:220px"><canvas id="mm-lag-chart"></canvas></div>
          </div>
        </div>`;

      // Detail section
      let mmDetail = '';
      if (data.mm1) {
        const badges = (data.mm1.consumer_groups || []).map(g => {
          const name = (typeof g === 'object' && g) ? (g.group_id || g.name || g.group || 'group') : g;
          return `<span style="background:#f59e0b22;color:#f59e0b;padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:600">${name}</span>`;
        }).join(' ');
        mmDetail += `
          <div class="chart-card__title">MirrorMaker 1 — Consumer Groups</div>
          <div class="anomaly-card" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">${badges || '<span style="color:var(--text-muted)">No groups</span>'}</div>`;
      }
      if (data.mm2) {
        const cc = data.cross_cluster;
        const ccInfo = cc ? `${cc.source_cluster} → ${cc.target_cluster}` : 'Source/target cluster info not available';
        mmDetail += `
          <div class="chart-card__title">MirrorMaker 2 — Replication</div>
          <div class="anomaly-card" style="margin-bottom:14px">
            <div style="font-weight:600;margin-bottom:6px">${ccInfo}</div>
            <div style="font-size:.82rem;color:var(--text-muted)">Internal topics: ${(data.mm2.internal_topics || []).length}${cc ? ` · Topics replicated: ${cc.total_topics_replicated ?? 0}` : ''}</div>
          </div>`;
      }

      el.innerHTML = mmKpis + mmChart + mmDetail;

      setTimeout(() => {
        if (window._mmLagChart) { window._mmLagChart.destroy(); window._mmLagChart = null; }
        const ctx = document.getElementById('mm-lag-chart')?.getContext('2d');
        if (ctx) {
          window._mmLagChart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: lagBars.map(b => b.name),
              datasets: [{ label: 'Lag', data: lagBars.map(b => b.lag), backgroundColor: lagBars.map(b => barColor(b.lag)), borderWidth: 0 }],
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false }, title: { display: false } },
              scales: { x: { beginAtZero: true, ticks: { callback: v => fmtNum(v), font: { size: 10 } } }, y: { ticks: { font: { size: 10 } } } },
            },
          });
        }
      }, 0);
      window._renderTabAI('mirrormaker', document.getElementById('tab-mirrormaker'));
    }

    async function init() {
      await portalReady;
      await loadClusterSelector();
      try {
        const cfg = await api('/settings');
        if (cfg.source_type === 'synthetic') {
          document.getElementById('genBtn').style.display = '';
        }
      } catch(_) {}
      // loadTab is called by loadClusterSelector after _currentClusterId is set
    }

    document.getElementById('ctrl-time').addEventListener('change', () => {
      window._clusterCounts = null;
      _loaded.clear();
      const activeBtn = document.querySelector('.tab-btn--active');
      const activeTab = activeBtn ? activeBtn.dataset.tab : 'overview';
      loadTab(activeTab);
    });
    init();

    /* ── On-demand streaming: Topics ────────────────────── */
    let _topicStreamActive = false;
    function _updateTopicKPIs(topics, loaded, total, isDone) {
      const kpiEl = document.getElementById('tab-topics');
      if (!kpiEl) return;
      const kpis = kpiEl.querySelectorAll('.kpi__value');
      if (kpis.length < 4) return;
      const counts = window._clusterCounts || {};
      const realTotal = counts.total_topics || topics.length;
      // Use accurate cluster-wide counts if available, otherwise compute from displayed topics
      const lowRep = counts.total_rf1 != null ? counts.total_rf1 : topics.filter(t => t.replication_factor === 1 && t.partition_count > 0).length;
      const hotTopics = counts.total_hot != null ? counts.total_hot : 0;
      const largeTopics = counts.large_topics_count != null ? counts.large_topics_count : 0;
      const staleTopics = counts.total_stale != null ? counts.total_stale : 0;
      const urpCount = counts.total_urp != null ? counts.total_urp : 0;
      if (isDone) {
        kpis[0].textContent = realTotal.toLocaleString();
        kpis[0].classList.remove('kpi-loading');
        kpis[1].textContent = lowRep.toLocaleString();
        kpis[1].style.color = lowRep > 0 ? 'var(--red)' : '';
        kpis[1].classList.remove('kpi-loading');
        kpis[2].textContent = hotTopics;
        kpis[2].classList.remove('kpi-loading');
        kpis[3].textContent = largeTopics;
        kpis[3].classList.remove('kpi-loading');
        if (kpis[4]) { kpis[4].textContent = staleTopics; kpis[4].classList.remove('kpi-loading'); }
        if (kpis[5]) { kpis[5].textContent = urpCount; kpis[5].style.color = urpCount > 0 ? 'var(--red)' : ''; kpis[5].classList.remove('kpi-loading'); }
      } else {
        kpis[0].textContent = realTotal.toLocaleString();
        kpis[1].textContent = lowRep.toLocaleString();
        kpis[1].classList.add('kpi-loading');
        kpis[2].textContent = hotTopics;
        kpis[2].classList.add('kpi-loading');
        kpis[3].textContent = largeTopics;
        kpis[3].classList.add('kpi-loading');
        if (kpis[4]) { kpis[4].textContent = staleTopics; kpis[4].classList.add('kpi-loading'); }
        if (kpis[5]) { kpis[5].textContent = urpCount; kpis[5].classList.add('kpi-loading'); }
      }
    }
    async function _streamTopicDetails() {
      if (_topicStreamActive) return;
      _topicStreamActive = true;
      const cid = _clusterId();
      if (!cid) return;

      const badge = document.getElementById('topic-loading-badge');
      if (badge) badge.style.display = 'inline-flex';

      // Mark KPIs as loading
      const kpiEl = document.getElementById('tab-topics');
      // KPI spinner disabled on Topics tab — values render directly from template
      // if (kpiEl) kpiEl.querySelectorAll('.kpi__value').forEach(k => k.classList.add('kpi-loading'));

      try {
        const resp = await fetch(_base() + '/dashboard/topics/stream?cluster_id=' + cid, {
          headers: typeof _authHeaders === 'function' ? _authHeaders() : {}
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let count = 0;
        const total = (window._topicAllTopics || []).length;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6);
            try {
              const obj = JSON.parse(payload);
              if (obj.done) {
                if (badge) badge.style.display = 'none';
                _topicStreamActive = false;
                if (window._topicAllTopics) {
                  // Sort by anomaly severity: degraded first, then low-rep (RF=1), then healthy
                  window._topicAllTopics.sort((a, b) => {
                    const scoreA = (a.status === 'degraded' ? 0 : a.replication_factor === 1 ? 1 : 2);
                    const scoreB = (b.status === 'degraded' ? 0 : b.replication_factor === 1 ? 1 : 2);
                    if (scoreA !== scoreB) return scoreA - scoreB;
                    return (b.partition_count || 0) - (a.partition_count || 0);
                  });
                  _updateTopicKPIs(window._topicAllTopics, count, total, true);
                  // Update total count from real cluster data
                  const totalTopics = obj.total_topics || (window._clusterCounts || {}).total_topics || window._topicAllTopics.length;
                  const kpiEl2 = document.getElementById('tab-topics');
                  if (kpiEl2) {
                    const kpis = kpiEl2.querySelectorAll('.kpi__value');
                    if (kpis.length >= 1) kpis[0].textContent = totalTopics.toLocaleString();
                  }
                  window._applyTopicView && window._applyTopicView();
                }
                return;
              }
              if (obj.error) continue;
              if (window._topicAllTopics) {
                const idx = window._topicAllTopics.findIndex(t => t.name === obj.name);
                if (idx >= 0) {
                  Object.assign(window._topicAllTopics[idx], obj);
                } else {
                  window._topicAllTopics.push(obj);
                }
              }
              count++;
              const realTotal = (window._clusterCounts || {}).total_topics || total;
              if (badge) badge.textContent = '⟳ Describing topics... ' + count + ' of ' + realTotal.toLocaleString();
              // Progressive KPI + table update every 100 topics
              if (count % 100 === 0 && window._topicAllTopics) {
                _updateTopicKPIs(window._topicAllTopics, count, total, false);
                window._applyTopicView && window._applyTopicView();
              }
            } catch (e) { /* skip malformed */ }
          }
        }
      } catch (err) {
        console.warn('Topic stream error:', err);
      }
      if (badge) badge.style.display = 'none';
      _topicStreamActive = false;
    }

    /* ── On-demand streaming: Consumer Groups ────────────── */
    let _groupStreamActive = false;
    function _updateGroupKPIs(groups, isDone) {
      const kpiEl = document.getElementById('tab-consumer-groups');
      if (!kpiEl) return;
      const kpis = kpiEl.querySelectorAll('.kpi__value');
      if (kpis.length < 4) return;
      const scanned = groups.filter(g => g.total_lag >= 0);
      const critical = scanned.filter(g => g.total_lag > 10000).length;
      const warning = scanned.filter(g => g.total_lag > 1000 && g.total_lag <= 10000).length;
      const realTotal = (window._clusterCounts || {}).total_groups || groups.length;
      // Healthy includes: scanned with lag <= 1000 + empty/dead groups (no consumers = no lag concern)
      const healthy = realTotal - critical - warning;
      if (isDone) {
        kpis[0].textContent = realTotal.toLocaleString();
        kpis[0].classList.remove('kpi-loading');
        kpis[1].textContent = critical;
        kpis[1].style.color = critical > 0 ? 'var(--red)' : '';
        kpis[1].classList.remove('kpi-loading');
        kpis[2].textContent = warning;
        kpis[2].style.color = warning > 0 ? 'var(--orange)' : '';
        kpis[2].classList.remove('kpi-loading');
        kpis[3].textContent = healthy;
        kpis[3].style.color = 'var(--green)';
        kpis[3].classList.remove('kpi-loading');
      } else {
        kpis[0].textContent = realTotal.toLocaleString();
        kpis[1].textContent = critical;
        kpis[1].classList.add('kpi-loading');
        kpis[2].textContent = warning;
        kpis[2].classList.add('kpi-loading');
        kpis[3].textContent = healthy;
        kpis[3].classList.add('kpi-loading');
      }
    }
    async function _streamGroupLags() {
      if (_groupStreamActive) return;
      _groupStreamActive = true;
      const cid = _clusterId();
      if (!cid) return;

      const badge = document.getElementById('cg-loading-badge');
      if (badge) badge.style.display = 'inline-flex';

      const kpiEl = document.getElementById('tab-consumer-groups');
      if (kpiEl) kpiEl.querySelectorAll('.kpi__value').forEach(k => k.classList.add('kpi-loading'));

      try {
        const resp = await fetch(_base() + '/dashboard/groups/stream?cluster_id=' + cid, {
          headers: typeof _authHeaders === 'function' ? _authHeaders() : {}
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let count = 0;
        const realTotal = (window._clusterCounts || {}).total_groups || (window._cgGroups || []).length;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6);
            try {
              const obj = JSON.parse(payload);
              if (obj.done) {
                if (badge) badge.style.display = 'none';
                _groupStreamActive = false;
                if (window._cgGroups) {
                  window._cgGroups.sort((a, b) => (b.total_lag || 0) - (a.total_lag || 0));
                  _updateGroupKPIs(window._cgGroups, true);

                  const hasLag = window._cgGroups.some(g => g.total_lag > 0);
                  const chartCanvas = document.getElementById('cg-lag-chart');
                  const chartContainer = document.getElementById('cg-chart-container');
                  if (hasLag && chartCanvas) {
                    const top10 = window._cgGroups.filter(g => g.total_lag > 0).sort((a,b) => b.total_lag - a.total_lag).slice(0, 10);
                    if (charts['cgLag']) { charts['cgLag'].destroy(); charts['cgLag'] = null; }
                    if (chartContainer) chartContainer.style.maxHeight = '350px';
                    charts['cgLag'] = new Chart(chartCanvas, {
                      type: 'bar',
                      data: {
                        labels: top10.map(g => g.group_id.length > 35 ? g.group_id.slice(0,32)+'...' : g.group_id),
                        datasets: [{
                          label: 'Total Lag',
                          data: top10.map(g => g.total_lag),
                          backgroundColor: top10.map(g => g.total_lag > 10000 ? '#e74c3c' : g.total_lag > 1000 ? '#f39c12' : '#27ae60'),
                        }]
                      },
                      options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { display: false } },
                        scales: { x: { title: { display: true, text: 'Total Lag' } } }
                      }
                    });
                  }
                  if (chartContainer && !hasLag) chartContainer.style.display = 'none';

                  const noLagBanner = document.getElementById('cg-no-lag-banner');
                  if (noLagBanner && hasLag) noLagBanner.style.display = 'none';

                  const totalGroups = obj.total_groups || realTotal;
                  const kpiEl2 = document.getElementById('tab-consumer-groups');
                  if (kpiEl2) {
                    const kpis = kpiEl2.querySelectorAll('.kpi__value');
                    if (kpis.length >= 1) kpis[0].textContent = totalGroups.toLocaleString();
                  }
                  window._cgApplyView && window._cgApplyView();
                }
                return;
              }
              if (obj.error) continue;
              if (window._cgGroups) {
                const idx = window._cgGroups.findIndex(g => g.group_id === obj.group_id);
                if (idx >= 0) {
                  window._cgGroups[idx].total_lag = obj.total_lag;
                  window._cgGroups[idx].topic_count = obj.topic_count;
                  window._cgGroups[idx].partitions = obj.partitions || [];
                }
              }
              count++;
              if (badge) {
                const pct = Math.round((count / realTotal) * 100);
                badge.textContent = '⟳ Scanning group lag... ' + count + ' of ' + realTotal + ' (' + pct + '%)';
              }
              if (count % 20 === 0 && window._cgGroups) {
                window._cgGroups.sort((a, b) => (b.total_lag || 0) - (a.total_lag || 0));
                _updateGroupKPIs(window._cgGroups, false);
                window._cgApplyView && window._cgApplyView();
              }
            } catch (e) { /* skip malformed */ }
          }
        }
      } catch (err) {
        console.warn('Group lag stream error:', err);
      }
      if (badge) badge.style.display = 'none';
      _groupStreamActive = false;
    }

    /* ── Server-side group search ────────────────────────── */
    let _groupSearchTimer = null;
    function _serverGroupSearch(query) {
      clearTimeout(_groupSearchTimer);
      if (!query || query.length < 2) {
        if (window._cgSearch) window._cgSearch(query);
        return;
      }
      _groupSearchTimer = setTimeout(async () => {
        const cid = _clusterId();
        try {
          const d = await api('/dashboard/groups/search?cluster_id=' + cid + '&q=' + encodeURIComponent(query));
          if (d.groups && d.groups.length > 0) {
            window._cgGroups = d.groups;
            window._cgApplyView && window._cgApplyView();
          } else if (window._cgSearch) {
            window._cgSearch(query);
          }
        } catch (e) {
          if (window._cgSearch) window._cgSearch(query);
        }
      }, 400);
    }
  </script>
  <script>
    // ── Fix nav links in standalone mode ──────────────────────────────────
    if (!_isPortalMode) {
      document.querySelectorAll('[data-standalone-href]').forEach(el => {
        el.href = el.dataset.standaloneHref;
      });
      var topbar = document.querySelector('.topbar');
      if (topbar) topbar.style.display = 'none';
      var lbl = document.getElementById('agent-label');
      if (lbl) lbl.style.display = 'inline';
    }

    mountUserBadge('#user-badge-slot');
    (function() {
      const authMode = window.__CONFIG__?.AUTH_MODE || 'none';
      const adminLink = document.getElementById('nav-admin');
      if (authMode !== 'local') {
        if (adminLink) adminLink.style.display = '';
        document.body.style.visibility = 'visible';
        return;
      }
      fetchCurrentUser().then(user => {
        if (!adminLink) { document.body.style.visibility = 'visible'; return; }
        if (!user) { adminLink.style.display = 'none'; document.body.style.visibility = 'visible'; return; }
        const roles = (user.roles || '').split(',');
        if (roles.includes('admin') || roles.includes('developer')) {
          adminLink.style.display = '';
        } else {
          adminLink.style.display = 'none';
        }
        document.body.style.visibility = 'visible';
      });
    })();
  </script>
