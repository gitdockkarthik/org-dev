<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafka Dashboard — UAP</title>
  <link rel="stylesheet" href="/css/style.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    body { background: var(--bg); }
    .subnav { display: flex; background: var(--navy-1); border-bottom: 1px solid var(--border); padding: 0 40px; }
    .subnav__link { display: inline-flex; align-items: center; gap: 6px; padding: 13px 16px; font-size: .85rem; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; text-decoration: none; transition: color var(--t), border-color var(--t); }
    .subnav__link:hover { color: var(--text); }
    .subnav__link--active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .content { padding: 28px 40px; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
    .page-heading__title { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .page-heading__sub { font-size: .88rem; color: var(--text-muted); }
    /* KPI cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .kpi { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; }
    .kpi__label { font-size: .73rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .kpi__value { font-size: 1.9rem; font-weight: 700; line-height: 1; margin-bottom: 3px; }
    .kpi__sub { font-size: .75rem; color: var(--text-muted); }
    .kpi--danger  .kpi__value { color: var(--danger); }
    .kpi--success .kpi__value { color: var(--success); }
    .kpi--warn    .kpi__value { color: var(--warn); }
    .kpi--orange  .kpi__value { color: #FF6B35; }
    /* Tab bar — orange active */
    .tab-bar { display: flex; gap: 4px; margin-bottom: 22px; background: var(--navy-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 4px; width: fit-content; flex-wrap: wrap; }
    .tab-btn { padding: 7px 16px; border: none; background: transparent; color: var(--text-muted); font-size: .83rem; font-weight: 500; border-radius: var(--r-xs); cursor: pointer; transition: background var(--t), color var(--t); white-space: nowrap; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn--active { background: var(--navy-1); color: #FF6B35; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .tab-panel { display: none; }
    .tab-panel--active { display: block; }
    /* ── Dashboard controls bar ── */
    .dash-controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
    .dash-select { background:var(--navy-1); border:1px solid var(--border); border-radius:var(--r-xs); padding:6px 10px; font-size:.82rem; color:var(--text); cursor:pointer; }
    .dash-select:focus { outline:none; border-color:var(--accent); }
    .dash-divider { width:1px; height:20px; background:var(--border); flex-shrink:0; }
    .dash-label { font-size:.78rem; color:var(--text-muted); font-weight:500; }
    .dash-refresh-btn { background:var(--navy-1); border:1px solid var(--border); border-radius:var(--r-xs); padding:6px 12px; font-size:.82rem; color:var(--text); cursor:pointer; }
    .dash-refresh-btn:hover { border-color:var(--accent); color:var(--accent); }
    /* ── Filter bar per tab ── */
    .filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .filter-chip { background:var(--navy-2); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:.78rem; color:var(--text-muted); cursor:pointer; transition:all var(--t); }
    .filter-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .filter-input { background:var(--navy-1); border:1px solid var(--border); border-radius:var(--r-xs); padding:4px 10px; font-size:.82rem; color:var(--text); width:180px; }
    .filter-input:focus { outline:none; border-color:var(--accent); }
    /* Tables */
    .data-table-wrap { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .data-table th { padding: 10px 14px; text-align: left; font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-dim); background: var(--navy-2); border-bottom: 1px solid var(--border); }
    .data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--navy-3); }
    .data-table__empty { padding: 32px; text-align: center; color: var(--text-dim); }
    /* Charts */
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .chart-card { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
    .chart-card__title { font-size: .87rem; font-weight: 600; margin-bottom: 14px; }
    .chart-wrap { position: relative; max-height: 280px; }
    /* Severity badges */
    .sev { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: .72rem; font-weight: 700; }
    .sev--critical { background: rgba(220,38,38,.12); color: #dc2626; }
    .sev--warning  { background: rgba(217,119,6,.12);  color: #d97706; }
    .sev--healthy  { background: rgba(22,163,74,.1);   color: #16a34a; }
    /* Broker cards */
    .broker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .broker-card { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; }
    .broker-card__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .broker-card__name { font-size: .95rem; font-weight: 700; }
    .broker-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .bm { }
    .bm__label { font-size: .68rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
    .bm__value { font-size: 1.1rem; font-weight: 700; }
    /* Progress bar */
    .progress-bar { background: var(--navy-3); border-radius: 4px; height: 7px; overflow: hidden; width: 100%; }
    .progress-bar__fill { height: 100%; border-radius: 4px; transition: width .3s; }
    /* Anomaly cards */
    .anomaly-list { display: flex; flex-direction: column; gap: 12px; }
    .anomaly-card { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; }
    .anomaly-card__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .anomaly-card__desc { font-size: .88rem; color: var(--text); margin-bottom: 10px; }
    .anomaly-card__recs { font-size: .82rem; color: var(--text-muted); }
    .anomaly-card__recs li { margin: 4px 0; margin-left: 16px; }
    /* Connector task bar */
    .task-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .task-label { font-size: .75rem; color: var(--text-muted); white-space: nowrap; }
    @media (max-width: 768px) { .subnav { padding: 0 20px; } .content { padding: 20px; } .chart-grid { grid-template-columns: 1fr; } .broker-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="/" class="topbar__brand">
      <span style="font-size:1.1rem;
      font-weight:700;color:#ffffff;
      letter-spacing:1px;
      font-family:inherit;">OPERATIVE</span>
    </a>
    <nav class="topbar__nav">
      <a href="/" class="topbar__link">Agents</a>
      <a href="/admin/" class="topbar__link">Admin</a>
    </nav>
    <div class="topbar__right" style="font-size:.85rem;color:var(--text-muted)">Kafka Analyser</div>
  </header>

  <nav class="subnav">
    <a href="/chat?agent=kafka-analyser"              class="subnav__link">💬 Chat</a>
    <a href="/agents/kafka-analyser/dashboard"        class="subnav__link subnav__link--active">📊 Dashboard</a>
    <a href="/agents/kafka-analyser/reports"          class="subnav__link">📁 Reports</a>
    <a href="/agents/kafka-analyser/settings"         class="subnav__link">⚙ Settings</a>
  </nav>

  <div class="content">
    <div class="page-heading">
      <div>
        <div class="page-heading__title">Kafka Dashboard</div>
        <div class="page-heading__sub">Cluster health, consumer lag, broker metrics and anomaly detection</div>
      </div>
      <button class="btn btn--primary" id="genBtn" onclick="generateAndLoad()" style="display:none">⚡ Generate Synthetic Data</button>
    </div>

    <!-- Dashboard controls bar -->
    <div class="dash-controls" id="dash-controls" style="display:none">
      <span class="dash-label">Cluster</span>
      <select class="dash-select" id="ctrl-cluster">
        <option value="">Loading…</option>
      </select>
      <div class="dash-divider"></div>
      <span class="dash-label">Time</span>
      <select class="dash-select" id="ctrl-time">
        <option value="1h">Last 1 hour</option>
        <option value="6h">Last 6 hours</option>
        <option value="24h" selected>Last 24 hours</option>
        <option value="7d">Last 7 days</option>
      </select>
      <div class="dash-divider"></div>
      <span class="dash-label">Refresh</span>
      <select class="dash-select" id="ctrl-refresh">
        <option value="0">Off</option>
        <option value="30">30s</option>
        <option value="60">1 min</option>
        <option value="300">5 min</option>
      </select>
      <button class="dash-refresh-btn" id="ctrl-refresh-now" title="Refresh now">↺ Refresh</button>
    </div>

    <div class="tab-bar">
      <button class="tab-btn tab-btn--active" data-tab="overview"        onclick="switchTab('overview',this)">Cluster Overview</button>
      <button class="tab-btn"                 data-tab="consumer-groups" onclick="switchTab('consumer-groups',this)">Consumer Groups</button>
      <button class="tab-btn"                 data-tab="topics"          onclick="switchTab('topics',this)">Topics</button>
      <button class="tab-btn"                 data-tab="brokers"         onclick="switchTab('brokers',this)">Brokers</button>
      <button class="tab-btn"                 data-tab="insights"        onclick="switchTab('insights',this)">AI Insights</button>
      <button class="tab-btn"                 data-tab="schema-registry" onclick="switchTab('schema-registry',this)">Schema Registry</button>
      <button class="tab-btn"                 data-tab="zookeeper"       onclick="switchTab('zookeeper',this)">ZooKeeper</button>
      <button class="tab-btn"                 data-tab="kafka-connect"   onclick="switchTab('kafka-connect',this)">Kafka Connect</button>
      <button class="tab-btn"                 data-tab="mirrormaker"     onclick="switchTab('mirrormaker',this)">MirrorMaker</button>
    </div>

    <div id="tab-overview"        class="tab-panel tab-panel--active"></div>
    <div id="tab-consumer-groups" class="tab-panel"></div>
    <div id="tab-topics"          class="tab-panel"></div>
    <div id="tab-brokers"         class="tab-panel"></div>
    <div id="tab-insights"        class="tab-panel"></div>
    <div id="tab-schema-registry" class="tab-panel"></div>
    <div id="tab-zookeeper" class="tab-panel"></div>
    <div id="tab-kafka-connect" class="tab-panel"></div>
    <div id="tab-mirrormaker" class="tab-panel"></div>
  </div>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/portal.js?v=3"></script>
  <script>
    const SLUG  = 'kafka-analyser';
    const PROXY = `${BACKEND_URL}/api/agents/${SLUG}/proxy`;

    const charts = {};
    const _loaded = new Set();

    // ── API helper ───────────────────────────────────────────────────────────

    async function api(path, opts = {}) {
      const url = _currentClusterId
        ? `${PROXY}${path}?cluster_id=${_currentClusterId}`
        : `${PROXY}${path}`;
      const res = await fetch(url, {
        ...opts,
        headers: { ..._authHeaders(), ...opts.headers },
        cache: 'no-store',
      });
      if (!res.ok) {
        const e = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(e.detail || `HTTP ${res.status}`);
      }
      return res.json();
    }

    // ── Formatters ───────────────────────────────────────────────────────────

    function fmtNum(n) { return (n ?? 0).toLocaleString(); }
    function fmtRate(n) {
      if (!n) return '0/s';
      if (n >= 1e6) return (n/1e6).toFixed(1) + 'M/s';
      if (n >= 1e3) return Math.round(n/1e3) + 'K/s';
      return n + '/s';
    }
    function fmtBytes(b) {
      if (!b) return '0 B';
      if (b >= 1e12) return (b/1e12).toFixed(1) + ' TB';
      if (b >= 1e9)  return (b/1e9).toFixed(1)  + ' GB';
      if (b >= 1e6)  return (b/1e6).toFixed(1)  + ' MB';
      return Math.round(b/1e3) + ' KB';
    }
    function metricColor(pct) {
      if (pct >= 80) return 'var(--danger)';
      if (pct >= 60) return '#d97706';
      return 'var(--success)';
    }
    function sevBadge(sev) {
      return `<span class="sev sev--${sev}">${sev.toUpperCase()}</span>`;
    }
    function stateBadge(state) {
      const styles = {
        'Stable':      'background:rgba(22,163,74,.1);color:#16a34a',
        'Rebalancing': 'background:rgba(234,88,12,.1);color:#ea580c',
        'Dead':        'background:rgba(220,38,38,.1);color:#dc2626',
        'Empty':       'background:rgba(100,116,139,.12);color:#64748b',
        'Unknown':     'background:rgba(100,116,139,.12);color:#64748b',
      };
      const s = styles[state] || 'background:rgba(99,102,241,.1);color:#6366f1';
      return `<span style="${s};padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:700">${state}</span>`;
    }
    function trendCell(trend, rate) {
      if (trend === 'growing')    return `<span style="color:var(--danger);font-weight:600">▲ growing</span>`;
      if (trend === 'recovering') return `<span style="color:var(--success)">▼ recovering</span>`;
      return `<span style="color:var(--text-muted)">→ stable</span>`;
    }

    // ── Helpers ──────────────────────────────────────────────────────────────

    function skeletonHTML() {
      return `<div style="display:flex;flex-direction:column;gap:12px;padding:4px 0">
        ${[80,60,90,70].map(w=>`<div class="skeleton" style="height:14px;width:${w}%"></div>`).join('')}
      </div>`;
    }
    function emptyState(icon, title, sub) {
      return `<div class="empty-state"><div class="empty-state__icon">${icon}</div>
        <div class="empty-state__title">${title}</div>
        <div class="empty-state__sub">${sub || ''}</div></div>`;
    }
    function destroyChart(k) { if (charts[k]) { charts[k].destroy(); delete charts[k]; } }

    // ── Tab switching ─────────────────────────────────────────────────────────

    function switchTab(name, btn) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('tab-panel--active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-btn--active'));
      document.getElementById('tab-' + name).classList.add('tab-panel--active');
      btn.classList.add('tab-btn--active');
      if (!_loaded.has(name)) loadTab(name);
    }

    // ── Per-tab loading ──────────────────────────────────────────────────────

    async function loadTab(name) {
      const el = document.getElementById('tab-' + name);
      el.innerHTML = skeletonHTML();
      try {
        switch (name) {
          case 'overview': {
            const [ov, cg] = await Promise.all([
              api('/dashboard/overview'),
              api('/dashboard/consumer-groups').catch(() => ({ consumer_groups: [] })),
            ]);
            _loaded.add(name);
            renderOverview(ov, (cg.consumer_groups || []).length);
            break;
          }
          case 'consumer-groups': {
            const d = await api('/dashboard/consumer-groups');
            _loaded.add(name);
            renderConsumerGroups(d);
            break;
          }
          case 'topics': {
            const d = await api('/dashboard/topics');
            _loaded.add(name);
            renderTopics(d);
            break;
          }
          case 'brokers': {
            const d = await api('/dashboard/brokers');
            _loaded.add(name);
            renderBrokers(d);
            break;
          }
          case 'insights': {
            const d = await api('/dashboard/insights');
            _loaded.add(name);
            renderInsights(d);
            break;
          }
          case 'schema-registry': {
            const d = await api('/dashboard/schema-registry');
            renderSchemaRegistry(d);
            break;
          }
          case 'zookeeper': {
            const d = await api('/dashboard/zookeeper');
            renderZooKeeper(d);
            break;
          }
          case 'kafka-connect': {
            const d = await api('/dashboard/kafka-connect');
            renderKafkaConnect(d);
            break;
          }
          case 'mirrormaker': {
            const d = await api('/dashboard/mirrormaker');
            renderMirrorMaker(d);
            break;
          }
        }
      } catch (e) {
        document.getElementById('tab-' + name).innerHTML =
          emptyState('⚠', 'Failed to load', e.message);
      }
    }

    // ── Generate & reload ────────────────────────────────────────────────────

    async function generateAndLoad() {
      const btn = document.getElementById('genBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Generating…';
      try {
        const d = await api('/reports/generate-sample', { method: 'POST' });
        showToast(d.message || 'Synthetic data generated', 'success');
        _loaded.clear();
        // Reload current active tab
        const activeBtn = document.querySelector('.tab-btn--active');
        const activeTab = activeBtn ? activeBtn.dataset.tab : 'overview';
        loadTab(activeTab);
      } catch (e) {
        showToast('Generation failed: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '⚡ Generate Synthetic Data';
      }
    }

    // ── Tab 1: Cluster Overview ──────────────────────────────────────────────

    function renderOverview(data, consumerGroupCount) {
      if (data.empty) {
        document.getElementById('tab-overview').innerHTML = emptyState('🔌',
          'No cluster data loaded',
          'Click "Generate Synthetic Data" above, or configure a Kafka source on the <a href="/agents/kafka-analyser/settings">Settings</a> page.');
        return;
      }

      const cluster  = data.cluster  || {};
      const brokers  = data.brokers  || [];
      const anomalies = data.anomalies || [];

      const totalURPs    = brokers.reduce((s, b) => s + (b.urp_count || 0), 0);
      const healthScore  = cluster.health_score || 0;
      const healthClass  = healthScore >= 80 ? 'kpi--success' : healthScore >= 60 ? 'kpi--warn' : 'kpi--danger';
      const urpClass     = totalURPs > 0 ? 'kpi--danger' : 'kpi--success';
      const criticalCount = cluster.critical_count || 0;

      const brokerCards = brokers.map(b => {
        const statusColor = b.status === 'warning' ? '#d97706' : b.status === 'critical' ? 'var(--danger)' : 'var(--success)';
        return `
          <div class="broker-card">
            <div class="broker-card__header">
              <span class="broker-card__name">${(b.broker_id || b.id || 'Broker')}</span>
              <span class="sev sev--${b.status === 'healthy' ? 'healthy' : b.status === 'warning' ? 'warning' : 'critical'}">${b.status.toUpperCase()}</span>
            </div>
            <div class="broker-metrics">
              <div class="bm"><div class="bm__label">Heap</div><div class="bm__value" style="color:${metricColor(b.heap_pct)}">${b.heap_pct}%</div></div>
              <div class="bm"><div class="bm__label">CPU</div><div class="bm__value" style="color:${metricColor(b.cpu_pct)}">${b.cpu_pct}%</div></div>
              <div class="bm"><div class="bm__label">URPs</div><div class="bm__value" style="color:${b.urp_count > 0 ? 'var(--danger)' : 'var(--success)'}">${b.urp_count}</div></div>
              <div class="bm"><div class="bm__label">GC Pauses</div><div class="bm__value" style="color:${(b.gc_pause_count ?? b.gc_pause_ms ?? 0) > 0 ? '#d97706' : 'var(--success)'}">${(b.gc_pause_count ?? b.gc_pause_ms ?? 0)}</div></div>
            </div>
          </div>`;
      }).join('');

      const anomalyRows = anomalies.length
        ? anomalies.map(a => `
            <tr>
              <td>${sevBadge(a.severity)}</td>
              <td style="font-size:.78rem;color:var(--text-muted);text-transform:uppercase;font-weight:600">${a.category.replace(/_/g,' ')}</td>
              <td>${a.description}</td>
            </tr>`).join('')
        : `<tr><td colspan="3" class="data-table__empty">✅ No active anomalies</td></tr>`;

      document.getElementById('tab-overview').innerHTML = `
        <div class="kpi-grid">
          <div class="kpi kpi--success">
            <div class="kpi__label">Brokers Online</div>
            <div class="kpi__value">${brokers.length}/${cluster.broker_count || brokers.length}</div>
            <div class="kpi__sub">${cluster.name || 'cluster'}</div>
          </div>
          <div class="kpi ${urpClass}">
            <div class="kpi__label">Under-Replicated</div>
            <div class="kpi__value">${totalURPs}</div>
            <div class="kpi__sub">partitions</div>
          </div>
          <div class="kpi kpi--orange">
            <div class="kpi__label">Consumer Groups</div>
            <div class="kpi__value">${consumerGroupCount}</div>
            <div class="kpi__sub">active</div>
          </div>
          <div class="kpi ${healthClass}">
            <div class="kpi__label">Health Score</div>
            <div class="kpi__value">${healthScore}</div>
            <div class="kpi__sub">${criticalCount} critical issue${criticalCount !== 1 ? 's' : ''}</div>
          </div>
        </div>
        <div style="font-size:.87rem;font-weight:600;margin-bottom:12px">Broker Status</div>
        <div class="broker-grid">${brokerCards}</div>
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Severity</th><th>Category</th><th>Description</th></tr></thead>
            <tbody>${anomalyRows}</tbody>
          </table>
        </div>`;
    }

    // ── Tab 2: Consumer Groups ────────────────────────────────────────────────

    function renderConsumerGroups(data) {
      if (data.empty) {
        document.getElementById('tab-consumer-groups').innerHTML = emptyState('📭', 'No data', 'Generate synthetic data first.');
        return;
      }
      const groups = data.consumer_groups || [];
      const rows = groups.map(g => {
        const lagColor = g.lag_trend === 'growing' && g.total_lag > 10000 ? 'style="color:var(--danger);font-weight:700"' : '';
        return `<tr>
          <td style="font-weight:600">${(g.group_id || g.group_name || 'Unknown')}</td>

    // ── Tab 5: Connectors ─────────────────────────────────────────────────────

    function renderKafkaConnect(data) {
      const el = document.getElementById('tab-kafka-connect');

      if (data.status === 'not_configured') {
        el.innerHTML = emptyState('🔌', 'Kafka Connect not configured',

      }

        return;
      }

      const s = data.summary || {};

      const stateColor = {
        'RUNNING': 'var(--success)',
        'FAILED': 'var(--danger)',
        'PAUSED': 'var(--warn)',
        'UNASSIGNED': '#6366f1',

      const rows = connectors.map(c => {

          <div style="display:flex;gap:2px;margin-top:4px">
            ${Array.from({length: c.total_tasks}, (_, i) => {
              const task = c.tasks[i] || {};
              const color = stateColor[task.state || 'RUNNING'] || 'var(--success)';
              return `<div style="width:12px;height:6px;border-radius:2px;background:${color}" title="Task ${i}: ${task.state}"></div>`;
            }).join('')}

          <td style="font-weight:600"><code style="font-size:.8rem">${c.name}</code></td>
          <td style="font-size:.78rem;color:var(--text-muted)">${c.connector_class || c.type || '-'}</td>
          <td>

            </span>
          </td>
          <td style="text-align:center">${c.running_tasks}/${c.total_tasks}</td>
          <td style="text-align:center;color:${c.failed_tasks > 0 ? 'var(--danger)' : 'var(--text-muted)'}">

          <td>${taskBar}</td>
        </tr>
        ${c.trace ? `<tr><td colspan="6" style="padding:4px 12px 8px;font-size:.75rem;color:var(--danger);font-family:monospace">${c.trace}</td></tr>` : ''}`;

      el.innerHTML = `
        <div class="kpi-grid" style="margin-bottom:18px">

            <div class="kpi__label">Status</div>
            <div class="kpi__value" style="font-size:1.1rem">
              ${s.failed > 0 ? '⚠️' : '✅'} ${data.status}

            <div class="kpi__sub">${data.url}</div>
          </div>
          <div class="kpi kpi--success">
            <div class="kpi__label">Running</div>
            <div class="kpi__value">${s.running || 0}</div>
            <div class="kpi__sub">of ${data.connector_count} connectors</div>
          </div>
          <div class="kpi ${s.failed > 0 ? 'kpi--danger' : ''}">
            <div class="kpi__label">Failed</div>
            <div class="kpi__value">${s.failed || 0}</div>
            <div class="kpi__sub">${s.failed_tasks || 0} failed tasks</div>
          </div>
          <div class="kpi">
            <div class="kpi__label">Paused</div>
            <div class="kpi__value">${s.paused || 0}</div>
            <div class="kpi__sub">${s.total_tasks || 0} total tasks</div>
          </div>
        </div>
        <div class="filter-bar">
          <span class="dash-label">State:</span>
          <span class="filter-chip active" onclick="filterConnectors('all',this)">All</span>
          <span class="filter-chip" onclick="filterConnectors('RUNNING',this)">Running</span>
          <span class="filter-chip" onclick="filterConnectors('FAILED',this)">Failed</span>
          <span class="filter-chip" onclick="filterConnectors('PAUSED',this)">Paused</span>
          <input class="filter-input" id="connector-search" placeholder="Search connector…" oninput="filterConnectorSearch(this.value)" />

        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Connector</th>
                <th>Class</th>
                <th>State</th>
                <th style="text-align:center">Tasks Running</th>
                <th style="text-align:center">Failed</th>
                <th>Task Health</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    // ── Tab 6: AI Insights ────────────────────────────────────────────────────

    async function renderInsights(data) {
      if (data.empty) {
        document.getElementById('tab-insights').innerHTML = emptyState('🤖', 'No data', 'Generate synthetic data first.');
        return;
      }
      const anomalies = data.anomalies || [];

      // Build anomaly cards
      const cards = anomalies.length ? anomalies.map(a => {
        const recs = (a.recommendations || []).map(r => `<li>${r}</li>`).join('');
        const sevColor = a.severity === 'critical' ? '#dc2626' : '#d97706';
        return `
          <div class="anomaly-card">
            <div class="anomaly-card__header">
              <div>
                ${sevBadge(a.severity)}
                <span style="margin-left:8px;font-size:.78rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">${(a.category||'').replace(/_/g,' ')}</span>
              </div>
            </div>
            <div class="anomaly-card__desc">${a.description}</div>
            ${recs ? `<div class="anomaly-card__recs"><strong style="font-size:.8rem;color:var(--text-muted)">Recommendations:</strong><ul style="margin-top:4px">${recs}</ul></div>` : ''}
          </div>`;
      }).join('') : `<div style="text-align:center;padding:2rem;color:var(--success);font-size:.95rem">✅ No active anomalies — all metrics within thresholds</div>`;

      // Narrative section placeholder
      const narrativeHtml = `
        <div class="anomaly-card" id="ai-narrative-card" style="margin-bottom:18px;border-color:var(--accent);border-width:2px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div style="font-weight:700;font-size:.95rem;color:var(--accent)">🤖 AI Cluster Analysis</div>
            <button class="dash-refresh-btn" id="btn-get-narrative" style="font-size:.8rem;padding:4px 12px">
              Generate Analysis
            </button>
          </div>
          <div id="narrative-content" style="font-size:.88rem;color:var(--text-muted);line-height:1.6">
            Click "Generate Analysis" for an AI-powered summary and recommendations.
          </div>
        </div>`;

      document.getElementById('tab-insights').innerHTML = narrativeHtml + `<div class="anomaly-list">${cards}</div>`;

      // Bind narrative button
      document.getElementById('btn-get-narrative').addEventListener('click', async () => {
        const btn = document.getElementById('btn-get-narrative');
        const content = document.getElementById('narrative-content');
        btn.textContent = 'Analysing…';
        btn.disabled = true;
        content.textContent = 'Generating AI analysis…';
        try {
          await portalReady;
          const r = await fetch(`${PROXY}/dashboard/insights/narrative${_currentClusterId ? '?cluster_id=' + _currentClusterId : ''}`, {
            method: 'POST',
            headers: _authHeaders(),
          });
          const d = await r.json();
          if (d.narrative) {
            // Convert markdown bold to HTML
            const html = d.narrative
              .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
              .replace(/\n/g, '<br>');
            content.innerHTML = html;
            btn.textContent = '↺ Refresh Analysis';
          } else {
            content.textContent = 'Analysis unavailable.';
            btn.textContent = 'Generate Analysis';
          }
        } catch(e) {
          content.textContent = 'Failed to generate analysis: ' + e.message;
          btn.textContent = 'Generate Analysis';
        }
        btn.disabled = false;
      });
    }

    // ── Init ──────────────────────────────────────────────────────────────────

    // ── Dashboard controls ────────────────────────────────────────
    let _refreshTimer = null;
    let _currentClusterId = null;

    async function loadClusterSelector() {
      try {
        await portalReady;
        const r = await fetch(`${PROXY}/settings/clusters`, { headers: _authHeaders() });
        const d = await r.json();
        const clusters = (d.clusters || []).filter(c => c.enabled);
        const sel = document.getElementById('ctrl-cluster');
        if (!clusters.length) {
          sel.innerHTML = '<option value="">No clusters enabled</option>';
          return;
        }
        sel.innerHTML = clusters.map(c =>
          `<option value="${c.id}">${c.name} (${c.environment})</option>`
        ).join('');
        _currentClusterId = clusters[0].id;
        document.getElementById('dash-controls').style.display = 'flex';
      } catch(e) {
        console.error('Failed to load clusters', e);
      }
    }

    function setupRefreshTimer() {
      if (_refreshTimer) clearInterval(_refreshTimer);
      const secs = parseInt(document.getElementById('ctrl-refresh').value);
      if (secs > 0) {
        _refreshTimer = setInterval(() => {
          const activeBtn = document.querySelector('.tab-btn--active');
          if (activeBtn) loadTab(activeBtn.dataset.tab);
        }, secs * 1000);
      }
    }

    document.getElementById('ctrl-refresh').addEventListener('change', setupRefreshTimer);
    document.getElementById('ctrl-refresh-now').addEventListener('click', () => {
      const activeBtn = document.querySelector('.tab-btn--active');
      if (activeBtn) loadTab(activeBtn.dataset.tab);
    });

    document.getElementById('ctrl-cluster').addEventListener('change', function() {
      _currentClusterId = this.value;
      // Show loading state on active tab only
      const activeBtn = document.querySelector('.tab-btn--active');
      const activeTab = activeBtn ? activeBtn.dataset.tab : 'overview';
      const activePanel = document.getElementById('tab-' + activeTab);
      if (activePanel) {
        activePanel.style.opacity = '0.4';
        activePanel.style.pointerEvents = 'none';
      }
      loadTab(activeTab).finally(() => {
        if (activePanel) {
          activePanel.style.opacity = '1';
          activePanel.style.pointerEvents = '';
        }
      });
    });

    // ── Tab filters ───────────────────────────────────────────────
    function filterCG(state, el) {
      document.querySelectorAll('.filter-bar .filter-chip').forEach(c => {
        if (c.onclick && c.onclick.toString().includes('filterCG')) c.classList.remove('active');
      });
      el.classList.add('active');
      const rows = document.querySelectorAll('#tab-consumer-groups tbody tr');
      rows.forEach(row => {
        if (state === 'all') { row.style.display = ''; return; }
        const stateCell = row.querySelector('td:last-child');
        const match = stateCell && stateCell.textContent.toLowerCase().includes(state);
        row.style.display = match ? '' : 'none';
      });
    }

    function filterCGSearch(val) {
      const rows = document.querySelectorAll('#tab-consumer-groups tbody tr');
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(val.toLowerCase()) ? '' : 'none';
      });
    }

    function filterTopics(type, el) {
      document.querySelectorAll('.filter-bar .filter-chip').forEach(c => {
        if (c.onclick && c.onclick.toString().includes('filterTopics')) c.classList.remove('active');
      });
      el.classList.add('active');
      const rows = document.querySelectorAll('#tab-topics tbody tr');
      rows.forEach(row => {
        if (type === 'all') { row.style.display = ''; return; }
        const nameCell = row.querySelector('td');
        const isInternal = nameCell && (nameCell.textContent.startsWith('__') || nameCell.textContent.startsWith('_'));
        row.style.display = (type === 'user' && !isInternal) ? '' : 'none';
      });
    }

    function filterTopicSearch(val) {
      const rows = document.querySelectorAll('#tab-topics tbody tr');
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(val.toLowerCase()) ? '' : 'none';
      });
    }

    function filterConnectors(state, el) {
      document.querySelectorAll('.filter-bar .filter-chip').forEach(c => {
        if (c.onclick && c.onclick.toString().includes('filterConnectors')) c.classList.remove('active');
      });
      el.classList.add('active');
      const rows = document.querySelectorAll('#tab-kafka-connect tbody tr:not([style*="font-family:monospace"])');
      rows.forEach(row => {
        if (state === 'all') { row.style.display = ''; return; }
        const stateCell = row.querySelector('td:nth-child(3)');

        row.style.display = match ? '' : 'none';

      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(val.toLowerCase()) ? '' : 'none';
      });

        </div>`;
    }

    function renderZooKeeper(data) {
      const el = document.getElementById('tab-zookeeper');

      if (data.mode === 'kraft' || data.status === 'not_configured') {
        el.innerHTML = `
          <div class="anomaly-card" style="border-color:#3b82f6;border-width:2px;max-width:600px">
            <div style="font-size:1.1rem;font-weight:700;color:#3b82f6;margin-bottom:8px">
              ⚡ KRaft Mode
            </div>
            <div style="font-size:.88rem;color:var(--text);line-height:1.6">
              ${data.message || 'This cluster is running in KRaft mode — no ZooKeeper required.'}
            </div>
            <div style="margin-top:12px;font-size:.8rem;color:var(--text-muted)">
              KRaft (Kafka Raft) is the modern consensus protocol built into Kafka,
              replacing ZooKeeper for metadata management. Available since Kafka 3.3+.
            </div>
          </div>`;
        return;
      }

      if (data.status === 'unreachable' || data.status === 'error') {
        el.innerHTML = emptyState('❌', 'ZooKeeper unreachable',
          data.error || `Could not connect to ${data.url}`);
        return;
      }

      const m = data.metrics || {};
      const statusColor = data.status === 'healthy' ? 'var(--success)' : 'var(--warn)';
      const modeColor = {
        'leader': '#FF6B35',
        'follower': '#3b82f6',
        'standalone': 'var(--success)',
      }[data.server_mode] || 'var(--text-muted)';

      const warnings = (data.warnings || []).map(w =>
        `<div style="color:var(--warn);font-size:.83rem;margin-top:4px">⚠ ${w}</div>`
      ).join('');

      el.innerHTML = `
        <div class="kpi-grid" style="margin-bottom:18px">
          <div class="kpi">
            <div class="kpi__label">Status</div>
            <div class="kpi__value" style="font-size:1.1rem;color:${statusColor}">
              ${data.status === 'healthy' ? '✅' : '⚠️'} ${data.status}
            </div>
            <div class="kpi__sub">${data.url}</div>
          </div>
          <div class="kpi">
            <div class="kpi__label">Server Mode</div>
            <div class="kpi__value" style="font-size:1.1rem;color:${modeColor};text-transform:uppercase">
              ${data.server_mode || 'unknown'}
            </div>
            <div class="kpi__sub">${data.version || ''}</div>
          </div>
          <div class="kpi">
            <div class="kpi__label">Connections</div>
            <div class="kpi__value">${m.connections || 0}</div>
            <div class="kpi__sub">active clients</div>
          </div>
          <div class="kpi">
            <div class="kpi__label">ZNodes</div>
            <div class="kpi__value">${(m.znode_count || 0).toLocaleString()}</div>
            <div class="kpi__sub">${(m.watch_count || 0).toLocaleString()} watches</div>
          </div>
        </div>
        ${warnings}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px">
          <div class="anomaly-card">
            <div style="font-weight:600;font-size:.85rem;margin-bottom:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">Latency</div>
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span style="font-size:.85rem">Avg Latency</span>
              <span style="font-weight:600">${m.avg_latency_ms || 0}ms</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="font-size:.85rem">Max Latency</span>
              <span style="font-weight:600">${m.max_latency_ms || 0}ms</span>
            </div>
          </div>
          <div class="anomaly-card">
            <div style="font-weight:600;font-size:.85rem;margin-bottom:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">Throughput</div>
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span style="font-size:.85rem">Packets Received</span>
              <span style="font-weight:600">${(m.packets_received || 0).toLocaleString()}</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="font-size:.85rem">Packets Sent</span>
              <span style="font-weight:600">${(m.packets_sent || 0).toLocaleString()}</span>
            </div>
          </div>
          <div class="anomaly-card">
            <div style="font-weight:600;font-size:.85rem;margin-bottom:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">Storage</div>
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span style="font-size:.85rem">Data Size</span>
              <span style="font-weight:600">${fmtBytes(m.data_size_bytes || 0)}</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="font-size:.85rem">Ephemerals</span>
              <span style="font-weight:600">${(m.ephemerals_count || 0).toLocaleString()}</span>
            </div>
          </div>
          <div class="anomaly-card">
            <div style="font-weight:600;font-size:.85rem;margin-bottom:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">Resources</div>
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span style="font-size:.85rem">File Descriptors</span>
              <span style="font-weight:600">${m.open_file_descriptors || 0}/${m.max_file_descriptors || 0}</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="font-size:.85rem">Outstanding Req</span>
              <span style="font-weight:600">${m.outstanding_requests || 0}</span>
            </div>
          </div>
        </div>`;
    }

    function renderMirrorMaker(data) {
      const el = document.getElementById('tab-mirrormaker');

      if (!data.detected) {
        el.innerHTML = `
          <div class="anomaly-card" style="max-width:600px">
            <div style="font-size:1rem;font-weight:700;margin-bottom:8px">🔄 No Replication Detected</div>
            <div style="font-size:.88rem;color:var(--text-muted);line-height:1.6">
              ${data.message || 'No MirrorMaker replication detected on this cluster.'}
            </div>
            <div style="margin-top:16px;font-size:.82rem;color:var(--text-muted)">
              <strong>Detection method:</strong><br>
              • MM1: consumer groups matching <code>mirror-*</code> or <code>mm1-*</code> patterns<br>
              • MM2: consumer groups matching <code>mm2-*</code> or <code>*.checkpoint.internal</code> patterns<br>
              • MM2: internal topics matching <code>*.heartbeats</code> or <code>*.checkpoints.internal</code>
            </div>
          </div>`;
        return;
      }

      const modeColors = {
        'mm1': '#f59e0b',
        'mm2': '#3b82f6',
        'both': '#8b5cf6',
      };
      const modeColor = modeColors[data.mode] || 'var(--text)';

      const mm1Html = data.mm1 ? `
        <div class="anomaly-card" style="margin-bottom:14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div style="font-weight:700;font-size:.95rem;color:#f59e0b">⚡ MirrorMaker 1</div>
            <span class="sev sev--${data.mm1.status === 'healthy' ? 'healthy' : 'warning'}">${data.mm1.status.toUpperCase()}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">
            <div>
              <div style="font-size:.73rem;color:var(--text-muted);font-weight:600;text-transform:uppercase">Consumer Groups</div>
              <div style="font-size:1.4rem;font-weight:700">${data.mm1.group_count}</div>
            </div>
            <div>
              <div style="font-size:.73rem;color:var(--text-muted);font-weight:600;text-transform:uppercase">Total Lag</div>
              <div style="font-size:1.4rem;font-weight:700;color:${data.mm1.total_lag > 10000 ? 'var(--danger)' : 'var(--success)'}">${data.mm1.total_lag.toLocaleString()}</div>
            </div>
          </div>
          <div style="font-size:.8rem;color:var(--text-muted)">
            <strong>Groups:</strong> ${data.mm1.consumer_groups.slice(0,5).join(', ')}${data.mm1.consumer_groups.length > 5 ? ` +${data.mm1.consumer_groups.length - 5} more` : ''}
          </div>
        </div>` : '';

      const mm2Html = data.mm2 ? `
        <div class="anomaly-card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div style="font-weight:700;font-size:.95rem;color:#3b82f6">⚡ MirrorMaker 2</div>
            <span class="sev sev--${data.mm2.status === 'healthy' ? 'healthy' : 'warning'}">${data.mm2.status.toUpperCase()}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">
            <div>
              <div style="font-size:.73rem;color:var(--text-muted);font-weight:600;text-transform:uppercase">Consumer Groups</div>
              <div style="font-size:1.4rem;font-weight:700">${data.mm2.group_count}</div>
            </div>
            <div>
              <div style="font-size:.73rem;color:var(--text-muted);font-weight:600;text-transform:uppercase">Internal Topics</div>
              <div style="font-size:1.4rem;font-weight:700">${data.mm2.topic_count}</div>
            </div>
            <div>
              <div style="font-size:.73rem;color:var(--text-muted);font-weight:600;text-transform:uppercase">Total Lag</div>
              <div style="font-size:1.4rem;font-weight:700;color:${data.mm2.total_lag > 10000 ? 'var(--danger)' : 'var(--success)'}">${data.mm2.total_lag.toLocaleString()}</div>
            </div>
          </div>
          ${data.mm2.internal_topics.length > 0 ? `
          <div style="font-size:.8rem;color:var(--text-muted);margin-top:8px">
            <strong>Internal Topics:</strong> ${data.mm2.internal_topics.slice(0,3).join(', ')}${data.mm2.internal_topics.length > 3 ? ` +${data.mm2.internal_topics.length - 3} more` : ''}
          </div>` : ''}
        </div>` : '';

      const crossClusterHtml = data.cross_cluster ? `
        <div class="anomaly-card" style="margin-top:14px">
          <div style="font-weight:700;font-size:.95rem;margin-bottom:12px">
            🔄 Cross-Cluster Replication
            <span style="font-size:.78rem;font-weight:400;color:var(--text-muted);margin-left:8px">
              ${data.cross_cluster.source_cluster} → ${data.cross_cluster.target_cluster}
            </span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
            <div>
              <div style="font-size:.73rem;color:var(--text-muted);font-weight:600;text-transform:uppercase">Topics Replicated</div>
              <div style="font-size:1.4rem;font-weight:700">${data.cross_cluster.total_topics_replicated}</div>
            </div>
          </div>
          ${data.cross_cluster.topic_replication.length > 0 ? `
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Topic</th>
                  <th style="text-align:right">Source Messages</th>
                  <th style="text-align:right">Target Messages</th>
                  <th style="text-align:right">Lag</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                ${data.cross_cluster.topic_replication.map(t => `
                  <tr>
                    <td><code style="font-size:.8rem">${t.topic}</code></td>
                    <td style="text-align:right">${t.source_messages.toLocaleString()}</td>
                    <td style="text-align:right">${t.target_messages.toLocaleString()}</td>
                    <td style="text-align:right;color:${t.lag > 1000 ? 'var(--danger)' : 'var(--success)'};font-weight:600">
                      ${t.lag.toLocaleString()}
                    </td>
                    <td><span class="sev sev--${t.status === 'healthy' ? 'healthy' : 'warning'}">${t.status.toUpperCase()}</span></td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>` : '<div style="color:var(--text-muted);font-size:.85rem">No matching topics found between clusters.</div>'}
        </div>` : '';

      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
          <div style="font-size:1.1rem;font-weight:700">Replication Mode:</div>
          <span style="background:${modeColor}22;color:${modeColor};padding:4px 14px;border-radius:20px;font-size:.85rem;font-weight:700;text-transform:uppercase">${data.mode}</span>
        </div>
        ${mm1Html}
        ${mm2Html}
        ${crossClusterHtml}`;
    }

    async function init() {
      await portalReady;
      await loadClusterSelector();
      try {
        const cfg = await api('/settings');
        if (cfg.source_type === 'synthetic') {
          document.getElementById('genBtn').style.display = '';
        }
      } catch(_) {}
      loadTab('overview');
    }

    init();
  </script>
</body>
</html>
