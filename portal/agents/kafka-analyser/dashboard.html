        try {
          const clusterId = (typeof _currentClusterId !== 'undefined' ? _currentClusterId : null)
                           || window._currentClusterId
                           || document.getElementById('ctrl-cluster')?.value;
          const res = await fetch(`${PROXY}/dashboard/topics/name-search?cluster_id=${clusterId}&q=${encodeURIComponent(val)}`,
            { headers: _authHeaders(), cache: 'no-store' });
          const data = await res.json();
          const results = data.results || [];
          if (!results.length) { dropdown.style.display = 'none'; return; }
          const inputEl = document.getElementById('topic-compare-input');
          if (inputEl) {
            const rect = inputEl.getBoundingClientRect();
            dropdown.style.top = rect.bottom + 'px';
            dropdown.style.left = rect.left + 'px';
          }
          dropdown.innerHTML = results.map(r =>
            `<div onclick="window._topicCompareAdd('${r.name.replace(/'/g, "\\'")}')"
              style="padding:8px 12px;cursor:pointer;font-size:.82rem;border-bottom:1px solid var(--border)"
              onmouseover="this.style.background='var(--navy-2)'" onmouseout="this.style.background=''">${r.name}</div>`
          ).join('');
          dropdown.style.display = 'block';
        } catch(e) { dropdown.style.display = 'none'; }
      };

      window._topicCompareAdd = function(name) {
        const dropdown = document.getElementById('topic-compare-dropdown');
        dropdown.style.display = 'none';
        document.getElementById('topic-compare-input').value = '';
        if (window._topicCompareSelected.includes(name)) return;
        if (window._topicCompareSelected.length >= 5) {
          alert('Maximum 5 topics for comparison');
          return;
        }
        window._topicCompareSelected.push(name);
        window._renderTopicChips();
        window._renderTopicTimeSeries();
      };

      window._topicCompareRemove = function(name) {
        window._topicCompareSelected = window._topicCompareSelected.filter(t => t !== name);
        window._renderTopicChips();
        window._renderTopicTimeSeries();
      };

      window._clearTopicCompare = function() {
        window._topicCompareSelected = [];
        document.getElementById('topic-compare-input').value = '';
        document.getElementById('topic-compare-dropdown').style.display = 'none';
        window._renderTopicChips();
        window._renderTopicTimeSeries();
      };

      window._renderTopicChips = function() {
        const container = document.getElementById('topic-compare-chips');
        if (!container) return;
        container.innerHTML = window._topicCompareSelected.map(name =>
          `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:var(--accent);color:#fff;border-radius:12px;font-size:.78rem">
            ${name}
            <span onclick="window._topicCompareRemove('${name.replace(/'/g, "\\'")}')" style="cursor:pointer;font-size:1rem;line-height:1">×</span>
          </span>`
        ).join('');
      };

      window._renderTopicTimeSeries = async function() {
        const canvas = document.getElementById('topicChart');
        const emptyEl = document.getElementById('topic-chart-empty');
        if (!canvas) return;
        if (window._topicTimeSeriesChart) { window._topicTimeSeriesChart.destroy(); window._topicTimeSeriesChart = null; }
        try {
          const clusterId = (typeof _currentClusterId !== 'undefined' ? _currentClusterId : null)
                           || window._currentClusterId
                           || document.getElementById('ctrl-cluster')?.value;
          const qs = new URLSearchParams();
          qs.set('minutes', String(_getMinutes()));
          if (clusterId) qs.set('cluster_id', clusterId);
          if (window._topicCompareSelected.length > 0) {
            qs.set('topics', window._topicCompareSelected.join(','));
          }
          const hist = await fetch(`${PROXY}/dashboard/topics/history?${qs.toString()}`,
            { headers: _authHeaders(), cache: 'no-store' }).then(r => r.json());

          if (!hist.series || !hist.series.length || !hist.labels || !hist.labels.length) {
            canvas.style.display = 'none';
            if (emptyEl) {
              emptyEl.style.display = 'block';
              emptyEl.textContent = window._topicCompareSelected.length > 0
                ? 'No message activity recorded for selected topics in this window. Topics may be inactive or deleted.'
                : 'No message rate data available for this time window yet. Data accumulates over collection cycles.';
            }
            return;
          }
          canvas.style.display = 'block';
          if (emptyEl) emptyEl.style.display = 'none';

          const timeVal = document.getElementById('ctrl-time')?.value || '24h';
          let _lastLabel = '';
          let _lastDayLabel = '';
          const labels = hist.labels.map(l => {
            const d = new Date(l);
            if (timeVal === '30d') {
              const dayLabel = d.toLocaleDateString([],
                { day: 'numeric', month: 'short' });
              if (dayLabel !== _lastDayLabel) {
                _lastDayLabel = dayLabel;
                return dayLabel;
              }
              return '';
            }
            if (timeVal === '7d') {
              const dayLabel = d.toLocaleDateString([],
                { weekday: 'short', day: 'numeric', month: 'short' });
              if (dayLabel !== _lastDayLabel) {
                _lastDayLabel = dayLabel;
                return dayLabel;
              }
              return '';
            }
            if (timeVal === '24h') {
              const day = d.toLocaleDateString([], { weekday: 'short' });
              const t = d.toLocaleTimeString([],
                { hour: '2-digit', minute: '2-digit' });
              if (day !== _lastLabel) { _lastLabel = day; return day + ' ' + t; }
              return t;
            }
            return d.toLocaleTimeString([],
              { hour: '2-digit', minute: '2-digit' });
          });

          const colors = ['#FF6B35','#4FC3F7','#81C784','#FFD54F','#CE93D8','#F48FB1','#80DEEA','#FFCC02','#A5D6A7','#EF9A9A'];
          window._topicTimeSeriesChart = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: {
              labels,
              datasets: hist.series.map((s, i) => ({
                label: s.name || ('Topic ' + (i + 1)),
                data: s.values || [],
                borderColor: colors[i % colors.length],
                backgroundColor: `rgba(${['255,107,53','79,195,247','76,175,80','156,39,176','255,152,0'][i % 5]},0.1)`,
                borderWidth: 2,
                pointRadius: labels.length <= 24 ? 3 : 0,
                tension: 0.3,
                fill: true,
              })),
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: true, position: 'bottom', labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } },
                title: { display: false },
              },
              scales: {
                x: { ticks: { autoSkip: false, maxRotation: 45, font: { size: 10 } } },
                y: { ticks: { callback: v => fmtRate(v), font: { size: 10 } }, beginAtZero: true },
              },
            },
          });
        } catch(e) {
          console.warn('Topic time-series chart failed:', e);
          canvas.style.display = 'none';
          if (emptyEl) { emptyEl.style.display = 'block'; emptyEl.textContent = 'Chart failed to load.'; }
        }
      };

      // Close dropdown when clicking outside
      document.addEventListener('click', function(e) {
        const input = document.getElementById('topic-compare-input');
        const dropdown = document.getElementById('topic-compare-dropdown');
        if (dropdown && input && !input.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.style.display = 'none';
        }
      }, { capture: true });

      const setActiveChip = (el) => {
        el.parentElement.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
      };

      window._setTopicFilter = function (f, el) {
        window._topicView.filter = f;
        window._topicView.visible = TOPIC_PAGE; // reset Show More on filter change
        setActiveChip(el);
        window._applyTopicView();
      };
      window._setTopicShow = function (userOnly, el) {
        window._topicView.userOnly = userOnly;
        window._topicView.visible = TOPIC_PAGE;
        setActiveChip(el);
        window._applyTopicView();
      };
      window._topicSearch = function (val) {
        window._topicView.search = val;
        window._topicView.visible = TOPIC_PAGE;
        window._applyTopicView();
      };
      window._topicShowMore = function () {
        window._topicView.visible += TOPIC_PAGE;
        window._applyTopicView();
      };

      window._applyTopicView();

      setTimeout(async () => {
        if (window._topicMsgsChart) { window._topicMsgsChart.destroy(); window._topicMsgsChart = null; }
        const msgsCtx = document.getElementById('topic-msgs-chart')?.getContext('2d');
        if (msgsCtx) {
          window._topicMsgsChart = new Chart(msgsCtx, {
            type: 'bar',
            data: {
              labels: topByMsgs.map(t => (t.name || t.topic || 'Unknown')),
              datasets: [{ label: 'Messages/sec', data: topByMsgs.map(t => msgRate(t)), backgroundColor: '#FF6B35', borderWidth: 0 }],
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false }, title: { display: false } },
              scales: {
                x: { ticks: { callback: v => fmtRate(v), font: { size: 10 } }, beginAtZero: true },
                y: { ticks: { font: { size: 10 } } },
              },
            },
          });
        }

        if (window._topicSizeChart) { window._topicSizeChart.destroy(); window._topicSizeChart = null; }
        const sizeCtx = document.getElementById('topic-size-chart')?.getContext('2d');
        if (sizeCtx) {
          const fmtSize = v => v >= 1073741824
            ? (v / 1073741824).toFixed(1) + ' GB'
            : (v / 1048576).toFixed(0) + ' MB';
          window._topicSizeChart = new Chart(sizeCtx, {
            type: 'bar',
            data: {
              labels: topBySize.map(t => (t.name || t.topic || 'Unknown')),
              datasets: [{ label: 'Log Size', data: topBySize.map(t => logSize(t)), backgroundColor: '#4FC3F7', borderWidth: 0 }],
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false }, title: { display: false } },
              scales: {
                x: { ticks: { callback: v => fmtSize(v), font: { size: 10 } }, beginAtZero: true },
                y: { ticks: { font: { size: 10 } } },
              },
            },
          });
        }

        // Time-series chart — Message Rate Trends
        if (window._topicTimeSeriesChart) { window._topicTimeSeriesChart.destroy(); window._topicTimeSeriesChart = null; }
        await window._renderTopicTimeSeries();
      }, 0);
      // Topics tab has its own Analyse button — skip _renderTabAI to avoid duplicate
      // window._renderTabAI('topics', document.getElementById('tab-topics'));
    }

    window._expandTopicRow = async function(row, topicName) {
      const existing = row.nextElementSibling;
      if (existing && existing.classList.contains('topic-detail-row')) {
        existing.remove();
        return;
      }
      const detailRow = document.createElement('tr');
      detailRow.className = 'topic-detail-row';
      const cols = row.cells.length;
      detailRow.innerHTML = `<td colspan="${cols}" style="background:var(--color-background-secondary);padding:12px 16px"><div style="font-size:12px;color:var(--color-text-secondary)">⟳ Loading topic details...</div></td>`;
      row.parentNode.insertBefore(detailRow, row.nextSibling);
      try {
        const url = '/dashboard/topics/detail';
        const res = await fetch(PROXY + url + '?name=' + encodeURIComponent(topicName) + '&cluster_id=' + (_currentClusterId || document.getElementById('ctrl-cluster')?.value || ''), {
          headers: _authHeaders ? _authHeaders() : {},
          cache: 'no-store'
        });
        const d = await res.json();
        if (d.error) throw new Error(d.error);
        detailRow.innerHTML = `<td colspan="${cols}" style="background:var(--color-background-secondary);padding:12px 16px">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;font-size:12px">
            <div><span style="color:var(--color-text-secondary)">Partitions</span><br><strong>${d.partition_count}</strong></div>
            <div><span style="color:var(--color-text-secondary)">Replication Factor</span><br><strong>${d.replication_factor}</strong></div>
            <div><span style="color:var(--color-text-secondary)">Under-replicated</span><br><strong>${d.under_replicated_partitions}</strong></div>
            <div><span style="color:var(--color-text-secondary)">Msg/s</span><br><strong>${fmtRate(d.messages_in_per_sec || 0)}</strong></div>
            <div><span style="color:var(--color-text-secondary)">Bytes/s</span><br><strong>${fmtBytes(d.bytes_in_per_sec || 0)}/s</strong></div>
          </div>
        </td>`;
      } catch(e) {
        detailRow.innerHTML = `<td colspan="${cols}" style="background:var(--color-background-secondary);padding:12px 16px;color:var(--color-text-danger);font-size:12px">Error: ${e.message}</td>`;
      }
    };

    // ── Tab 4: Brokers ────────────────────────────────────────────────────────

    function renderBrokers(data) {
      if (data.empty) {
        document.getElementById('tab-brokers').innerHTML = emptyState('🖥', 'No data', 'Generate synthetic data first.');
        return;
      }
      const brokers = data.brokers || [];

      const cards = brokers.map(b => {
        function metricRow(label, pct, max) {
          const color = metricColor(pct);
          const fillPct = Math.min(100, pct);
          return `<div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="font-size:.73rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">${label}</span>
              <span style="font-size:.85rem;font-weight:700;color:${color}">${pct}%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-bar__fill" style="width:${fillPct}%;background:${color}"></div>
            </div>
          </div>`;
        }
        return `
          <div class="broker-card">
            <div class="broker-card__header">
              <span class="broker-card__name">Broker ID: ${(b.broker_id || b.id || 'Broker')}</span>
              <span class="sev sev--${b.heap_pct === 0 && b.messages_in_per_sec === 0 && b.produce_latency_ms === 0 ? 'warning' : b.status === 'healthy' ? 'healthy' : b.status === 'warning' ? 'warning' : 'critical'}">${b.heap_pct === 0 && b.messages_in_per_sec === 0 && b.produce_latency_ms === 0 ? '⚠ METRICS UNAVAILABLE' : b.status.toUpperCase()}</span>
            </div>
            ${(() => {
              const unavailable = b.heap_pct === 0 && b.cpu_pct === 0 && b.produce_latency_ms === 0;
              if (unavailable) return `<div style="margin-bottom:10px">
                <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                  <span style="font-size:.73rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">HEAP</span>
                  <span style="font-size:.85rem;font-weight:700;color:var(--text-muted)">—</span>
                </div>
                <div class="progress-bar"><div class="progress-bar__fill" style="width:0%;background:var(--text-muted)"></div></div>
              </div>`;
              return metricRow('Heap', b.heap_pct);
            })()}
            ${(() => {
              const unavailable = b.heap_pct === 0 && b.cpu_pct === 0 && b.produce_latency_ms === 0;
              const cpuDisplay = unavailable ? '—' : b.cpu_cores_configured ? b.cpu_pct + '%' : b.cpu_pct + ' cores';
              const cpuFill = unavailable ? 0 : b.cpu_cores_configured ? Math.min(100, b.cpu_pct) : Math.min(100, b.cpu_pct * 25);
              const cpuColor = unavailable ? 'var(--text-muted)' : metricColor(b.cpu_cores_configured ? b.cpu_pct : cpuFill);
              return `<div style="margin-bottom:10px">
                <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                  <span style="font-size:.73rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">CPU</span>
                  <span style="font-size:.85rem;font-weight:700;color:${cpuColor}">${cpuDisplay}</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-bar__fill" style="width:${cpuFill}%;background:${cpuColor}"></div>
                </div>
              </div>`;
            })()}
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px">
              <div class="bm">
                <div class="bm__label">Under-Replicated</div>
                <div class="bm__value" style="color:${b.urp_count > 0 ? 'var(--danger)' : 'var(--success)'}">${b.urp_count}</div>
              </div>
              <div class="bm">
                <div class="bm__label">Bytes In/s</div>
                <div class="bm__value" style="font-size:.85rem">${fmtBytes(b.bytes_in_per_sec || 0)+'/s'}</div>
              </div>
              <div class="bm">
                <div class="bm__label">Data Volume</div>
                <div class="bm__value" style="font-size:.85rem">${(b.data_gb || 0).toFixed(2)} GB</div>
              </div>
            </div>
          </div>`;
      }).join('');

      // ── KPI cards ─────────────────────────────────────────────────────────────
      const brokerCount  = brokers.length;
      const healthyCount = brokers.filter(b => b.status === 'healthy').length;
      const totalURPs    = brokers.reduce((s, b) => s + (b.urp_count || 0), 0);
      const avgHeap      = brokerCount ? Math.round(brokers.reduce((s, b) => s + (b.heap_pct || 0), 0) / brokerCount) : 0;
      const totalISRShrinks = brokers.reduce((s, b) => s + (b.isr_shrinks_per_sec || 0), 0);
      const avgReqIdle   = brokerCount ? Math.round(brokers.reduce((s, b) => s + (b.request_handler_idle_pct || 0), 0) / brokerCount) : 0;
      const reqIdleClass = avgReqIdle < 50 ? 'kpi--danger' : avgReqIdle < 80 ? 'kpi--warn' : 'kpi--success';

      const brokerKpis = `
        <div class="kpi-grid">
          <div class="kpi kpi--orange">
            <div class="kpi__label">Total Brokers</div>
            <div class="kpi__value">${brokerCount}</div>
            <div class="kpi__sub">brokers</div>
          </div>
          <div class="kpi kpi--success">
            <div class="kpi__label">Healthy</div>
            <div class="kpi__value">${healthyCount}</div>
            <div class="kpi__sub">status healthy</div>
          </div>
          <div class="kpi ${totalURPs > 0 ? 'kpi--danger' : 'kpi--success'}">
            <div class="kpi__label">Under-Replicated Partitions</div>
            <div class="kpi__value">${totalURPs}</div>
            <div class="kpi__sub">total URPs</div>
          </div>
          <div class="kpi ${avgHeap > 80 ? 'kpi--danger' : 'kpi--orange'}">
            <div class="kpi__label">Avg Heap %</div>
            <div class="kpi__value">${avgHeap}%</div>
            <div class="kpi__sub">across brokers</div>
          </div>
          <div class="kpi ${totalISRShrinks > 0 ? 'kpi--danger' : 'kpi--success'}">
            <div class="kpi__label">ISR Shrinks/sec</div>
            <div class="kpi__value">${totalISRShrinks.toFixed(2)}</div>
            <div class="kpi__sub">across brokers</div>
          </div>
          <div class="kpi ${reqIdleClass}">
            <div class="kpi__label">Avg Request Handler Idle %</div>
            <div class="kpi__value">${avgReqIdle}%</div>
            <div class="kpi__sub">across brokers</div>
          </div>
        </div>`;

      // ── Charts ────────────────────────────────────────────────────────────────
      const brokerCharts = `
        <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px">
          <div class="chart-card" style="flex:1;min-width:280px;margin-bottom:0">
            <div class="chart-card__title">CPU &amp; Heap % by Broker</div>
            <div class="chart-wrap" style="height:240px"><canvas id="broker-cpu-heap-chart"></canvas></div>
          </div>
          <div class="chart-card" style="flex:1;min-width:280px;margin-bottom:0">
            <div class="chart-card__title">Leader Partition Distribution</div>
            <div class="chart-wrap" style="height:240px"><canvas id="broker-leader-chart"></canvas></div>
          </div>
          <div class="chart-card" style="flex:1;min-width:280px;margin-bottom:0">
            <div class="chart-card__title">Replica Partition Distribution</div>
            <div class="chart-wrap" style="height:240px"><canvas id="broker-replica-chart"></canvas></div>
          </div>
        </div>`;

      document.getElementById('tab-brokers').innerHTML = brokerKpis + `
        <div class="chart-card__title">Broker Detail</div>
        <div class="broker-grid">${cards}</div>` + brokerCharts;

      const brokerLabels = brokers.map(b => 'Broker ' + (b.broker_id ?? b.id ?? '?'));

      setTimeout(() => {
        if (window._brokerCpuHeapChart) { window._brokerCpuHeapChart.destroy(); window._brokerCpuHeapChart = null; }
        const cpuHeapCtx = document.getElementById('broker-cpu-heap-chart')?.getContext('2d');
        if (cpuHeapCtx) {
          window._brokerCpuHeapChart = new Chart(cpuHeapCtx, {
            type: 'bar',
            data: {
              labels: brokerLabels,
              datasets: [
                { label: 'CPU',  data: brokers.map(b => b.cpu_pct || 0),  backgroundColor: '#FF6B35', borderWidth: 0 },
                { label: 'Heap %', data: brokers.map(b => b.heap_pct || 0), backgroundColor: '#4FC3F7', borderWidth: 0 },
                { label: 'Req Idle %', data: brokers.map(b => b.request_handler_idle_pct || 0), backgroundColor: '#4CAF50', borderWidth: 0 },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }, title: { display: false } },
              scales: {
                x: { ticks: { font: { size: 10 } } },
                y: { min: 0, max: 100, ticks: { callback: v => v + '%', font: { size: 10 } } },
              },
            },
          });
        }

        // Leader partition distribution chart
        if (window._brokerLeaderChart) { window._brokerLeaderChart.destroy(); window._brokerLeaderChart = null; }
        const leaderCtx = document.getElementById('broker-leader-chart')?.getContext('2d');
        if (leaderCtx) {
          fetch(`${PROXY}/dashboard/broker-distribution?cluster_id=${_currentClusterId || ''}`, { headers: _authHeaders(), cache: 'no-store' })
            .then(r => r.json()).then(d => {
              if (d.empty || !d.brokers) return;
              const distLabels = d.brokers.map(b => 'Broker ' + b.broker_id);
              window._brokerLeaderChart = new Chart(leaderCtx, {
                type: 'bar',
                data: {
                  labels: distLabels,
                  datasets: [
                    { label: 'Leader Partitions', data: d.brokers.map(b => b.leader_partition_count), backgroundColor: '#FF6B35', borderWidth: 0 },
                  ],
                },
                options: {
                  responsive: true, maintainAspectRatio: false,
                  plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
                  scales: { x: { ticks: { font: { size: 10 } } }, y: { ticks: { font: { size: 10 } } } },
                },
              });
              // Replica chart
              if (window._brokerReplicaChart) { window._brokerReplicaChart.destroy(); window._brokerReplicaChart = null; }
              const repCtx = document.getElementById('broker-replica-chart')?.getContext('2d');
              if (repCtx) {
                window._brokerReplicaChart = new Chart(repCtx, {
                  type: 'bar',
                  data: {
                    labels: distLabels,
                    datasets: [
                      { label: 'Leader', data: d.brokers.map(b => b.leader_partition_count), backgroundColor: '#FF6B35', borderWidth: 0 },
                      { label: 'Replica', data: d.brokers.map(b => b.replica_partition_count - b.leader_partition_count), backgroundColor: '#4FC3F7', borderWidth: 0 },
                    ],
                  },
                  options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
                    scales: { x: { ticks: { font: { size: 10 } } }, y: { ticks: { font: { size: 10 } }, stacked: true }, x: { stacked: true } },
                  },
                });
              }
            }).catch(() => {});
        }
        // (latency chart removed — replaced by distribution charts above)
      }, 0);
      window._renderTabAI('brokers', document.getElementById('tab-brokers'));
    }

    // ── Tab 5: Connectors ─────────────────────────────────────────────────────

    function renderKafkaConnect(data) {
      const el = document.getElementById('tab-kafka-connect');

      if (data.status === 'not_configured') {
        el.innerHTML = emptyState('🔌', 'Kafka Connect not configured',
          'Edit the cluster in Settings and add a Kafka Connect URL.');
        return;
      }
      if (data.status === 'unreachable') {
        el.innerHTML = emptyState('❌', 'Kafka Connect unreachable',
          `Could not connect to ${data.url}`);
        return;
      }

      const s = data.summary || {};
      const connectors = (data.connectors || []).sort((a, b) => {
        // Failed first, then paused, then running
        const scoreA = a.state === 'FAILED' ? 0 : (a.failed_tasks > 0 ? 1 : a.state === 'PAUSED' ? 2 : 3);
        const scoreB = b.state === 'FAILED' ? 0 : (b.failed_tasks > 0 ? 1 : b.state === 'PAUSED' ? 2 : 3);
        if (scoreA !== scoreB) return scoreA - scoreB;
        return (b.total_tasks || 0) - (a.total_tasks || 0);
      });

      if (!connectors.length) {
        el.innerHTML = `
          <div class="filter-bar" style="color:var(--text-muted)">
            ℹ️ No Kafka Connect configured — add Connect URL in cluster settings
          </div>`;
        return;
      }

      // ── KPI cards ─────────────────────────────────────────────────────────────
      const connectorCount = data.connector_count ?? connectors.length;
      const runningCount   = s.running ?? connectors.filter(c => c.state === 'RUNNING').length;
      const failedCount    = s.failed ?? connectors.filter(c => c.state === 'FAILED').length;
      const totalTasks     = s.total_tasks ?? connectors.reduce((n, c) => n + (c.total_tasks || 0), 0);
      const failedTasks    = s.failed_tasks ?? connectors.reduce((n, c) => n + (c.failed_tasks || 0), 0);
      const pausedCount    = s.paused ?? connectors.filter(c => c.state === 'PAUSED').length;

      const connectKpis = `
        <div class="kpi-grid">
          <div class="kpi kpi--orange">
            <div class="kpi__label">Total Connectors</div>
            <div class="kpi__value">${connectorCount}</div>
            <div class="kpi__sub">connectors</div>
          </div>
          <div class="kpi kpi--success">
            <div class="kpi__label">Running</div>
            <div class="kpi__value">${runningCount}</div>
            <div class="kpi__sub">connectors</div>
          </div>
          <div class="kpi ${failedCount > 0 ? 'kpi--danger' : 'kpi--success'}">
            <div class="kpi__label">Failed</div>
            <div class="kpi__value">${failedCount}</div>
            <div class="kpi__sub">connectors</div>
          </div>
          <div class="kpi kpi--warn">
            <div class="kpi__label">Paused</div>
            <div class="kpi__value">${pausedCount}</div>
            <div class="kpi__sub">connectors</div>
          </div>
          <div class="kpi kpi--orange">
            <div class="kpi__label">Total Tasks</div>
            <div class="kpi__value">${totalTasks}</div>
            <div class="kpi__sub">tasks</div>
          </div>
          <div class="kpi ${failedTasks > 0 ? 'kpi--danger' : 'kpi--success'}">
            <div class="kpi__label">Failed Tasks</div>
            <div class="kpi__value">${failedTasks}</div>
            <div class="kpi__sub">tasks</div>
          </div>
        </div>`;

      // ── Worker nodes ──────────────────────────────────────────────────────────
      const workerNodes = data.worker_nodes || [];
      const connectWorkers = `
        <div class="chart-card" style="margin-bottom:18px">
          <div class="chart-card__title">Worker Nodes (${workerNodes.length})</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;padding:8px 0">
            ${workerNodes.map(w => `
              <div style="display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--navy-1);border-radius:6px;border:1px solid ${w.status==='up'?'var(--success)':'var(--danger)'}">
                <span style="width:8px;height:8px;border-radius:50%;background:${w.status==='up'?'var(--success)':'var(--danger)'}"></span>
                <span style="font-size:.82rem;font-weight:600">${w.hostname.split('.')[0].replace('awaos-qa-','')}</span>
                <span style="font-size:.75rem;color:var(--text-muted)">${w.connector_count > 0 ? w.connector_count+' connectors' : w.status==='down'?'down':''}</span>
              </div>`).join('')}
          </div>
        </div>`;

      // ── Charts ────────────────────────────────────────────────────────────────
      const connectCharts = `
        <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px">
          <div class="chart-card" style="flex:1;min-width:300px;margin-bottom:0">
            <div class="chart-card__title">Connector Status Distribution</div>
            <div class="chart-wrap" style="height:240px"><canvas id="connect-status-chart"></canvas></div>
          </div>
          <div class="chart-card" style="flex:1;min-width:300px;margin-bottom:0">
            <div class="chart-card__title">Connectors by Type</div>
            <div class="chart-wrap" style="height:240px"><canvas id="connect-type-chart"></canvas></div>
          </div>
        </div>`;

      // ── Table helpers ───────────────────────────────────────────────────────
      const shortClass = c => {
        const cls = c.connector_class || c.type || '-';
        return cls.includes('.') ? cls.split('.').pop() : cls;
      };
      const statusBadge = state => {
        if (state === 'RUNNING') return `<span class="sev sev--healthy">RUNNING</span>`;
        if (state === 'FAILED')  return `<span class="sev sev--critical">FAILED</span>`;
        if (state === 'PAUSED')  return `<span class="sev sev--warning">PAUSED</span>`;
        return `<span class="sev" style="background:rgba(100,116,139,.12);color:var(--text-muted)">${state || 'UNKNOWN'}</span>`;
      };
      const taskColor = { RUNNING: '#4CAF50', FAILED: '#F44336', PAUSED: '#FF9800', UNASSIGNED: '#666' };
      const taskPills = c => {
        const count = c.total_tasks || (c.tasks ? c.tasks.length : 0);
        if (!count) return '';
        const tasks = Array.from({ length: count }, (_, i) => (c.tasks && c.tasks[i]) || {});
        const pills = tasks.map((t, i) => {
          const state = t.state || 'RUNNING';
          const color = taskColor[state] || '#666';
          const titleParts = [`Task ${i}: ${state}`];
          if (state === 'FAILED' && t.trace) titleParts.push(String(t.trace).slice(0, 200));
          const title = titleParts.join(' — ').replace(/"/g, '&quot;');
          return `<span title="${title}" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color}"></span>`;
        }).join('');
        return `<div style="display:inline-flex;gap:2px;margin-top:4px">${pills}</div>`;
      };
      const connectRowHtml = c => `<tr>
          <td style="font-weight:600"><code style="font-size:.8rem">${c.name}</code></td>
          <td style="font-size:.82rem;color:var(--text-muted);text-transform:capitalize">${c.type || '-'}</td>
          <td style="font-size:.8rem"><code style="font-size:.78rem">${shortClass(c)}</code></td>
          <td style="text-align:center;color:${c.failed_tasks > 0 ? 'var(--danger)' : 'var(--text)'}">
            <div>${c.running_tasks ?? 0}/${c.total_tasks ?? 0}</div>
            ${taskPills(c)}
          </td>
          <td style="font-size:.8rem;color:var(--text-muted)" title="${c.worker_id || ''}">${(c.worker_id || c.worker || '-').split('.')[0].replace('awaos-qa-','')}</td>
          <td>${statusBadge(c.state)}</td>
        </tr>`;

      el.innerHTML = connectKpis + connectWorkers + connectCharts + `
        <div class="filter-bar">
          <span class="dash-label">Status:</span>
          <span class="filter-chip active" onclick="window._connectSetStatus('all',this)">All</span>
          <span class="filter-chip" onclick="window._connectSetStatus('RUNNING',this)">Running</span>
          <span class="filter-chip" onclick="window._connectSetStatus('FAILED',this)">Failed</span>
          <span class="filter-chip" onclick="window._connectSetStatus('PAUSED',this)">Paused</span>
          <span class="filter-chip" onclick="window._connectSetStatus('FAILED_TASKS',this)">Failed Tasks</span>
          <input class="filter-input" id="connector-search" placeholder="Search connector…" oninput="window._connectSearch(this.value)" />
        </div>
        <div class="filter-bar">
          <span class="dash-label">Type:</span>
          <span class="filter-chip active" onclick="window._connectSetType('all',this)">All</span>
          <span class="filter-chip" onclick="window._connectSetType('source',this)">Source</span>
          <span class="filter-chip" onclick="window._connectSetType('sink',this)">Sink</span>
        </div>
        <div class="chart-card__title">Connector Inventory</div>
        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Class</th>
                <th style="text-align:center">Tasks</th>
                <th>Worker</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="connect-tbody"></tbody>
          </table>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px">
          <span id="connect-count-label" class="dash-label"></span>
          <button id="connect-show-more" class="btn btn--secondary btn--sm" onclick="window._connectShowMore()">Show More</button>
        </div>`;

      // ── Self-contained table view: pagination + filters + search (AND) ────────
      const CONNECT_PAGE = 20;
      window._connectView = { status: 'all', type: 'all', search: '', visible: CONNECT_PAGE };

      const connectMatches = (c, st) => {
        if (st.status === 'FAILED_TASKS') {
          if ((c.failed_tasks || 0) === 0) return false;
        } else if (st.status !== 'all' && c.state !== st.status) return false;
        if (st.type !== 'all' && (c.type || '').toLowerCase() !== st.type) return false;
        if (st.search) {
          const q = st.search.toLowerCase();
          const matchName = (c.name || '').toLowerCase().includes(q);
          const matchClass = (c.connector_class || '').toLowerCase().includes(q);
          if (!matchName && !matchClass) return false;
        }
        return true;
      };

      window._connectApplyView = function () {
        const st = window._connectView;
        const filtered = connectors.filter(c => connectMatches(c, st));
        const shown = filtered.slice(0, st.visible);
        const tbody = document.getElementById('connect-tbody');
        if (tbody) {
          tbody.innerHTML = shown.map(connectRowHtml).join('') ||
            `<tr><td colspan="6" class="data-table__empty">No connectors match</td></tr>`;
        }
        const label = document.getElementById('connect-count-label');
        if (label) label.textContent = `Showing ${shown.length} of ${filtered.length} connectors`;
        const moreBtn = document.getElementById('connect-show-more');
        if (moreBtn) moreBtn.style.display = shown.length < filtered.length ? '' : 'none';
      };

      const connectSetActiveChip = (el2) => {
        el2.parentElement.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        el2.classList.add('active');
      };

      window._connectSetStatus = function (status, el2) {
        window._connectView.status = status;
        window._connectView.visible = CONNECT_PAGE;
        connectSetActiveChip(el2);
        window._connectApplyView();
      };
      window._connectSetType = function (type, el2) {
        window._connectView.type = type;
        window._connectView.visible = CONNECT_PAGE;
        connectSetActiveChip(el2);
        window._connectApplyView();
      };
      window._connectSearch = function (val) {
        window._connectView.search = val;
        window._connectView.visible = CONNECT_PAGE;
        window._connectApplyView();
      };
      window._connectShowMore = function () {
        window._connectView.visible += CONNECT_PAGE;
        window._connectApplyView();
      };

      window._connectApplyView();

      // ── Doughnut charts ───────────────────────────────────────────────────────
      setTimeout(() => {
        if (window._connectStatusChart) { window._connectStatusChart.destroy(); window._connectStatusChart = null; }
        const statusCtx = document.getElementById('connect-status-chart')?.getContext('2d');
        if (statusCtx) {
          const statusDefs = [
            { label: 'Running',    color: '#4CAF50', count: connectors.filter(c => c.state === 'RUNNING').length },
            { label: 'Failed',     color: '#F44336', count: connectors.filter(c => c.state === 'FAILED').length },
            { label: 'Paused',     color: '#FF9800', count: connectors.filter(c => c.state === 'PAUSED').length },
            { label: 'Unassigned', color: '#666',    count: connectors.filter(c => c.state === 'UNASSIGNED').length },
          ].filter(d => d.count > 0);
          window._connectStatusChart = new Chart(statusCtx, {
            type: 'doughnut',
            data: {
              labels: statusDefs.map(d => d.label),
              datasets: [{ data: statusDefs.map(d => d.count), backgroundColor: statusDefs.map(d => d.color), borderWidth: 0 }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
            },
          });
        }

        if (window._connectTypeChart) { window._connectTypeChart.destroy(); window._connectTypeChart = null; }
        const typeCtx = document.getElementById('connect-type-chart')?.getContext('2d');
        if (typeCtx) {
          const typeDefs = [
            { label: 'Source', color: '#4FC3F7', count: connectors.filter(c => (c.type || '').toLowerCase() === 'source').length },
            { label: 'Sink',   color: '#FF6B35', count: connectors.filter(c => (c.type || '').toLowerCase() === 'sink').length },
          ].filter(d => d.count > 0);
          window._connectTypeChart = new Chart(typeCtx, {
            type: 'doughnut',
            data: {
              labels: typeDefs.map(d => d.label),
              datasets: [{ data: typeDefs.map(d => d.count), backgroundColor: typeDefs.map(d => d.color), borderWidth: 0 }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
            },
          });
        }
      }, 0);
      window._renderTabAI('kafka-connect', document.getElementById('tab-kafka-connect'));
    }

    // ── Tab 6: AI Insights ────────────────────────────────────────────────────

    async function renderInsights(data) {
      if (data.empty) {
        document.getElementById('tab-insights').innerHTML = emptyState('🤖', 'No data', 'Generate synthetic data first.');
        return;
      }
      const anomalies = data.anomalies || [];

      // Build anomaly cards
      const cards = anomalies.length ? anomalies.map(a => {
        const recs = (a.recommendations || []).map(r => `<li>${r}</li>`).join('');
        const sevColor = a.severity === 'critical' ? '#dc2626' : '#d97706';
        return `
          <div class="anomaly-card">
            <div class="anomaly-card__header">
              <div>
                ${sevBadge(a.severity)}
                <span style="margin-left:8px;font-size:.78rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">${(a.category||'').replace(/_/g,' ')}</span>
              </div>
            </div>
            <div class="anomaly-card__desc">${a.description}</div>
            ${recs ? `<div class="anomaly-card__recs"><strong style="font-size:.8rem;color:var(--text-muted)">Recommendations:</strong><ul style="margin-top:4px">${recs}</ul></div>` : ''}
          </div>`;
      }).join('') : `<div style="text-align:center;padding:2rem;color:var(--success);font-size:.95rem">✅ No active anomalies — all metrics within thresholds</div>`;

      // Narrative section placeholder
      const narrativeHtml = `
        <div class="anomaly-card" id="ai-narrative-card" style="margin-bottom:18px;border-color:var(--accent);border-width:2px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div style="font-weight:700;font-size:.95rem;color:var(--accent)">🤖 AI Cluster Analysis</div>
            <button class="dash-refresh-btn" id="btn-get-narrative" style="font-size:.8rem;padding:4px 12px">
              Generate Analysis
            </button>
          </div>
          <div id="narrative-content" style="font-size:.88rem;color:var(--text-muted);line-height:1.6">
            Click "Generate Analysis" for an AI-powered summary and recommendations.
          </div>
        </div>`;

      document.getElementById('tab-insights').innerHTML = narrativeHtml + `<div class="anomaly-list">${cards}</div>`;

      // Bind narrative button
      document.getElementById('btn-get-narrative')
        .addEventListener('click', async () => {
        const btn = document.getElementById('btn-get-narrative');
        const content = document.getElementById('narrative-content');
        btn.textContent = 'Analysing…';
        btn.disabled = true;

        // Progress messages
        const progressMessages = [
          'Analysing cluster health…',
          'Reviewing broker metrics…',
          'Checking consumer group health…',
          'Identifying anomalies…',
          'Preparing recommendations…',
        ];
        let msgIdx = 0;
        content.style.fontStyle = 'italic';
        content.style.color = 'var(--text-muted)';
        content.textContent = progressMessages[0];
        const progressInterval = setInterval(() => {
          msgIdx = (msgIdx + 1) % progressMessages.length;
          content.textContent = progressMessages[msgIdx];
        }, 2000);

        let fullText = '';
        let sseBuffer = '';
        let done_reading = false;
        let firstToken = false;
        let stopReason = 'end_turn';

        try {
          await portalReady;
          const url = `${PROXY}/dashboard/insights/narrative/stream${
            _currentClusterId ? '?cluster_id=' + _currentClusterId : ''}`;

          const response = await fetch(url, {
            method: 'POST',
            headers: _authHeaders(),
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done || done_reading) break;
            const chunk = decoder.decode(value, { stream: true });
            sseBuffer += chunk;
            const lines = sseBuffer.split('\n');
            sseBuffer = lines.pop();
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const data = line.slice(6).trimEnd();
              if (data.startsWith('[STOP_REASON]')) {
                stopReason = data.slice(14).trim();
                continue;
              }
              if (data === '[DONE]') { done_reading = true; break; }
              if (data.startsWith('[ERROR]')) {
                throw new Error(data.slice(7).trim());
              }
              if (!firstToken) {
                firstToken = true;
                clearInterval(progressInterval);
                content.style.fontStyle = 'normal';
                content.style.color = 'var(--text)';
                content.innerHTML = '';
              }
              const text = data.replace(/\\n/g, '\n');
              fullText += text;
              // Render markdown progressively
              const rendered = fullText
                .replace(/^## (.*)/gm, '<h3 style="color:var(--accent);margin:12px 0 6px">$1</h3>')
                .replace(/^### (.*)/gm, '<h4 style="margin:8px 0 4px">$1</h4>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
              // Convert markdown tables to HTML tables
              content.innerHTML = rendered.replace(/(\|.+\|(<br>)?)+/g, tableBlock => {
                const lines = tableBlock.split('<br>').filter(l => l.trim() && l.includes('|'));
                const dataLines = lines.filter(l => !/^\|[-| :]+\|$/.test(l.trim()));
                if (!dataLines.length) return '';
                const rows = dataLines.map((line, i) => {
                  const cells = line.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
                  const tag = i === 0 ? 'th' : 'td';
                  const style = i === 0 ? 'padding:5px 10px;border:1px solid var(--border);background:var(--navy-1);font-weight:600' : 'padding:4px 10px;border:1px solid var(--border)';
                  return '<tr>' + cells.map(c => `<${tag} style="${style}">${c}</${tag}>`).join('') + '</tr>';
                }).join('');
                return `<table style="border-collapse:collapse;margin:8px 0;font-size:.85rem;width:100%">${rows}</table>`;
              });
            }
          }
          btn.textContent = '↺ Refresh Analysis';
          btn.disabled = false;
          if (stopReason === 'max_tokens') {
            const continueBtn = document.createElement('button');
            continueBtn.textContent = 'Continue Analysis ›';
            continueBtn.className = 'dash-refresh-btn';
            continueBtn.style.cssText = 'font-size:.8rem;padding:4px 12px;margin-left:8px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer';
            continueBtn.onclick = async () => {
              continueBtn.remove();
              btn.textContent = 'Analysing…';
              btn.disabled = true;
              const prevText = fullText;
              fullText = '';
              firstToken = false;
              stopReason = 'end_turn';
              const contUrl = `${PROXY}/dashboard/insights/narrative/stream${_currentClusterId ? '?cluster_id=' + _currentClusterId : ''}`;
              const contRes = await fetch(contUrl, {
                method: 'POST',
                headers: { ..._authHeaders(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ continuation_of: prevText }),
              });
              if (!contRes.ok) throw new Error(`HTTP ${contRes.status}`);
              const contReader = contRes.body.getReader();
              const contDecoder = new TextDecoder();
              while (true) {
                const { done, value } = await contReader.read();
                if (done) break;
                const chunk = contDecoder.decode(value, { stream: true });
                for (const line of chunk.split('\n')) {
                  if (!line.startsWith('data: ')) continue;
                  const d = line.slice(6);
                  if (d.startsWith('[STOP_REASON]')) { stopReason = d.slice(14).trim(); continue; }
                  if (d === '[DONE]') break;
                  if (d.startsWith('[ERROR]')) break;
                  const t = d.replace(/\\n/g, '\n');
                  fullText += t;
                }
              }
              content.innerHTML = (prevText + fullText)
                .replace(/^## (.*)/gm, '<h3 style="color:var(--accent);margin:12px 0 6px">$1</h3>')
                .replace(/^### (.*)/gm, '<h4 style="margin:8px 0 4px">$1</h4>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
              btn.textContent = '↺ Refresh Analysis';
              btn.disabled = false;
              if (stopReason === 'max_tokens') content.appendChild(continueBtn.cloneNode(true));
            };
            document.getElementById('ai-narrative-card').appendChild(continueBtn);
          }
        } catch(e) {
          clearInterval(progressInterval);
          content.style.fontStyle = 'normal';
          content.textContent = 'Failed: ' + e.message;
          btn.textContent = 'Generate Analysis';
        }
        btn.disabled = false;
      });
    }

    // ── Reusable per-tab AI analysis drawer ────────────────────────────────────
    window._tabAICache = window._tabAICache || {};
    window._aiDrawerTab = null;

    const _AI_TAB_NAMES = {
      'brokers': 'Brokers',
      'topics': 'Topics',
      'consumer-groups': 'Consumer Groups',
      'kafka-connect': 'Kafka Connect',
      'zookeeper': 'ZooKeeper',
      'schema-registry': 'Schema Registry',
      'mirrormaker': 'MirrorMaker',
    };

    const _aiRenderMd = (text) => {
      const rendered = text
        .replace(/^## (.*)/gm, '<h3 style="color:var(--accent);margin:12px 0 6px">$1</h3>')
        .replace(/^### (.*)/gm, '<h4 style="margin:8px 0 4px">$1</h4>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/^---$/gm, '<hr style="margin:8px 0;border:none;border-top:1px solid var(--border)">')
        .replace(/\n/g, '<br>');
      return rendered.replace(/(\|.+\|(<br>)?)+/g, tableBlock => {
        const lines = tableBlock.split('<br>').filter(l => l.trim() && l.includes('|'));
        const dataLines = lines.filter(l => !/^\|[-| :]+\|$/.test(l.trim()));
        if (!dataLines.length) return '';
        const rows = dataLines.map((line, i) => {
          const cells = line.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
          const tag = i === 0 ? 'th' : 'td';
          const style = i === 0 ? 'padding:5px 10px;border:1px solid var(--border);background:var(--navy-1);font-weight:600' : 'padding:4px 10px;border:1px solid var(--border)';
          return '<tr>' + cells.map(c => `<${tag} style="${style}">${c}</${tag}>`).join('') + '</tr>';
        }).join('');
        return `<table style="border-collapse:collapse;margin:8px 0;font-size:.85rem;width:100%">${rows}</table>`;
      });
    };

    function _aiAddContinue(tabId, prevText) {
      const content = document.getElementById('ai-drawer-content');
      const refreshBtn = document.getElementById('ai-drawer-refresh');
      const continueBtn = document.createElement('button');
      continueBtn.textContent = 'Continue Analysis ›';
      continueBtn.className = 'dash-refresh-btn';
      continueBtn.style.cssText = 'font-size:.8rem;padding:4px 12px;margin-top:10px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer';
      continueBtn.onclick = async () => {
        continueBtn.remove();
        if (refreshBtn) refreshBtn.disabled = true;
        const clusterId = _currentClusterId || (document.getElementById('ctrl-cluster')?.value) || '';
        const cacheKey = tabId + '_' + clusterId;
        let contFull = '';
        let stopReason = 'end_turn';
        try {
          const contUrl = `${PROXY}/dashboard/insights/tab-stream${clusterId ? '?cluster_id=' + clusterId : ''}`;
          const contRes = await fetch(contUrl, {
            method: 'POST',
            headers: { ..._authHeaders(), 'Content-Type': 'application/json' },
            body: JSON.stringify({ tab: tabId, continuation_of: prevText }),
          });
          if (!contRes.ok) throw new Error(`HTTP ${contRes.status}`);
          const contReader = contRes.body.getReader();
          const contDecoder = new TextDecoder();
          while (true) {
            const { done, value } = await contReader.read();
            if (done || window._aiDrawerTab !== tabId) break;
            const chunk = contDecoder.decode(value, { stream: true });
            for (const line of chunk.split('\n')) {
              if (!line.startsWith('data: ')) continue;
              const d = line.slice(6);
              if (d.startsWith('[STOP_REASON]')) { stopReason = d.slice(14).trim(); continue; }
              if (d === '[DONE]') break;
              if (d.startsWith('[ERROR]')) break;
              contFull += d.replace(/\\n/g, '\n');
            }
            if (content) content.innerHTML = _aiRenderMd(prevText + contFull);
          }
          if (content) content.innerHTML = _aiRenderMd(prevText + contFull);
          window._tabAICache[cacheKey] = content ? content.innerHTML : '';
          if (refreshBtn) refreshBtn.disabled = false;
          if (stopReason === 'max_tokens') _aiAddContinue(tabId, prevText + contFull);
        } catch (e) {
          if (refreshBtn) refreshBtn.disabled = false;
        }
      };
      content.parentElement.appendChild(continueBtn);
    }

    async function _runAIDrawer(tabId) {
      _ensureAIDrawer();
      window._aiDrawerTab = tabId;
      const clusterId = _currentClusterId || (document.getElementById('ctrl-cluster')?.value) || '';
      const cacheKey = tabId + '_' + clusterId;
      const titleEl = document.getElementById('ai-drawer-title');
      const content = document.getElementById('ai-drawer-content');
      const refreshBtn = document.getElementById('ai-drawer-refresh');
      if (titleEl) titleEl.textContent = `🤖 AI Analysis — ${_AI_TAB_NAMES[tabId] || tabId}`;

      // Show cached result if present
      if (window._tabAICache[cacheKey]) {
        content.style.fontStyle = 'normal';
        content.style.color = 'var(--text)';
        content.innerHTML = window._tabAICache[cacheKey];
        if (refreshBtn) refreshBtn.disabled = false;
        return;
      }

      const progressMessages = [
        'Analysing ' + tabId + '…',
        'Reviewing metrics…',
        'Identifying risks…',
        'Preparing recommendations…',
      ];
      let msgIdx = 0;
      content.style.fontStyle = 'italic';
      content.style.color = 'var(--text-muted)';
      content.textContent = progressMessages[0];
      const progressInterval = setInterval(() => {
        msgIdx = (msgIdx + 1) % progressMessages.length;
        if (window._aiDrawerTab === tabId) content.textContent = progressMessages[msgIdx];
      }, 2000);

      let fullText = '';
      let sseBuffer = '';
      let done_reading = false;
      let firstToken = false;
      let stopReason = 'end_turn';

      if (refreshBtn) refreshBtn.disabled = true;
      try {
        await portalReady;
        const url = `${PROXY}/dashboard/insights/tab-stream${clusterId ? '?cluster_id=' + clusterId : ''}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { ..._authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ tab: tabId }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done || done_reading) break;
          if (window._aiDrawerTab !== tabId) { clearInterval(progressInterval); return; }
          const chunk = decoder.decode(value, { stream: true });
          sseBuffer += chunk;
          const lines = sseBuffer.split('\n');
          sseBuffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const dataLine = line.slice(6).trimEnd();
            if (dataLine.startsWith('[STOP_REASON]')) { stopReason = dataLine.slice(14).trim(); continue; }
            if (dataLine === '[DONE]') { done_reading = true; break; }
            if (dataLine.startsWith('[ERROR]')) throw new Error(dataLine.slice(7).trim());
            if (!firstToken) {
              firstToken = true;
              clearInterval(progressInterval);
              content.style.fontStyle = 'normal';
              content.style.color = 'var(--text)';
              content.innerHTML = '';
            }
            fullText += dataLine.replace(/\\n/g, '\n');
            content.innerHTML = _aiRenderMd(fullText);
          }
        }
        clearInterval(progressInterval);
        window._tabAICache[cacheKey] = content.innerHTML;
        if (refreshBtn) refreshBtn.disabled = false;
        if (stopReason === 'max_tokens') _aiAddContinue(tabId, fullText);
      } catch (e) {
        clearInterval(progressInterval);
        content.style.fontStyle = 'normal';
        content.style.color = 'var(--text)';
        content.textContent = 'Failed: ' + e.message;
        if (refreshBtn) refreshBtn.disabled = false;
      }
    }
