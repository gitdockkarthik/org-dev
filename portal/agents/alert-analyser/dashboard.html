<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert Dashboard — UAP</title>
  <link rel="stylesheet" href="/css/style.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    body { background: var(--bg); }
    .subnav { display: flex; background: var(--navy-1); border-bottom: 1px solid var(--border); padding: 0 40px; }
    .subnav__link { display: inline-flex; align-items: center; gap: 6px; padding: 13px 16px; font-size: .85rem; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; text-decoration: none; transition: color var(--t), border-color var(--t); }
    .subnav__link:hover { color: var(--text); }
    .subnav__link--active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .content { padding: 28px 40px; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
    .page-heading__title { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .page-heading__sub { font-size: .88rem; color: var(--text-muted); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .kpi { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; }
    .kpi__label { font-size: .73rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .kpi__value { font-size: 1.9rem; font-weight: 700; line-height: 1; margin-bottom: 3px; }
    .kpi__sub { font-size: .75rem; color: var(--text-muted); }
    .kpi--danger .kpi__value { color: var(--danger); }
    .kpi--success .kpi__value { color: var(--success); }
    .kpi--warn .kpi__value { color: var(--warn); }
    .kpi--accent .kpi__value { color: var(--accent); }
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .chart-card { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
    .chart-card__title { font-size: .87rem; font-weight: 600; margin-bottom: 14px; }
    .chart-wrap { position: relative; max-height: 260px; }
    .tab-bar { display: flex; gap: 4px; margin-bottom: 22px; background: var(--navy-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 4px; width: fit-content; }
    .tab-btn { padding: 7px 18px; border: none; background: transparent; color: var(--text-muted); font-size: .83rem; font-weight: 500; border-radius: var(--r-xs); cursor: pointer; transition: background var(--t), color var(--t); }
    .tab-btn:hover { color: var(--text); }
    .tab-btn--active { background: var(--navy-1); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .tab-panel { display: none; }
    .tab-panel--active { display: block; }
    .data-table-wrap { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .data-table th { padding: 10px 14px; text-align: left; font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-dim); background: var(--navy-2); border-bottom: 1px solid var(--border); }
    .data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--navy-3); }
    .data-table__empty { padding: 32px; text-align: center; color: var(--text-dim); }
    .pri { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: .72rem; font-weight: 700; }
    .pri--p1 { background: rgba(220,38,38,.1); color: #dc2626; }
    .pri--p2 { background: rgba(234,88,12,.1); color: #ea580c; }
    .pri--p3 { background: rgba(180,83,9,.1); color: #b45309; }
    .pri--p4, .pri--p5 { background: rgba(100,116,139,.1); color: #64748b; }
    .heatmap { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; margin-bottom: 6px; }
    .heatmap__cell { height: 28px; border-radius: 3px; cursor: default; }
    .heatmap__labels { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
    .heatmap__labels span { font-size: .6rem; text-align: center; color: var(--text-dim); }
    @media (max-width: 768px) { .subnav { padding: 0 20px; } .content { padding: 20px; } .chart-grid { grid-template-columns: 1fr; } }
    /* Genuine Alerts tables — full width, resizable columns + copy-on-hover message cells */
    .genuine-table { width: 100%; table-layout: fixed; }
    .genuine-table th { resize: horizontal; overflow: auto; min-width: 60px; }
    /* Message col (1st) takes remaining space; Source/Priority/Team fixed */
    .genuine-table th:nth-child(2), .genuine-table td:nth-child(2) { width: 120px; }
    .genuine-table th:nth-child(3), .genuine-table td:nth-child(3) { width: 90px; }
    .genuine-table th:nth-child(4), .genuine-table td:nth-child(4) { width: 160px; }
    .genuine-table th:first-child, .genuine-table td.msg-cell { width: auto; max-width: none; }
    .genuine-table td.msg-cell { position: relative; white-space: normal; overflow: visible; word-break: break-word; }
    .genuine-table td.msg-cell .msg-text { display: inline-block; white-space: normal; overflow: visible; word-break: break-word; max-width: 100%; vertical-align: middle; }
    .genuine-table td.msg-cell .msg-copy { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: none; cursor: pointer; border: none; background: var(--bg, #fff); padding: 0 4px; font-size: .85rem; line-height: 1; border-radius: 4px; box-shadow: 0 0 4px rgba(0,0,0,.15); }
    .genuine-table td.msg-cell:hover .msg-copy { display: inline-block; }
    /* Noise Analysis tables — same resizable columns + copy-on-hover message cells as Genuine */
    .noise-table th { resize: horizontal; overflow: auto; min-width: 60px; }
    .noise-table td.msg-cell { position: relative; white-space: normal; overflow: visible; word-break: break-word; max-width: none; }
    .noise-table td.msg-cell .msg-text { display: inline-block; white-space: normal; overflow: visible; word-break: break-word; max-width: 100%; vertical-align: middle; }
    .noise-table td.msg-cell .msg-copy { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: none; cursor: pointer; border: none; background: var(--bg, #fff); padding: 0 4px; font-size: .85rem; line-height: 1; border-radius: 4px; box-shadow: 0 0 4px rgba(0,0,0,.15); }
    .noise-table td.msg-cell:hover .msg-copy { display: inline-block; }
    /* Ticket modal styles */
    #ticketModalOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 10000; }
    #ticketModalOverlay.show { display: flex; }
    .ticket-modal-panel { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); width: 90%; max-width: 700px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .ticket-modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px; border-bottom: 1px solid var(--border); }
    .ticket-modal-header-left { flex: 1; }
    .ticket-modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; padding: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .ticket-modal-close:hover { color: var(--text); }
    .ticket-modal-id { font-size: .75rem; color: var(--text-dim); font-family: monospace; margin-bottom: 6px; }
    .ticket-modal-id-val { color: var(--text-muted); word-break: break-all; }
    .ticket-modal-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 8px; word-break: break-word; }
    .ticket-modal-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .ticket-modal-badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 4px; font-size: .72rem; font-weight: 600; }
    .ticket-modal-timeline { padding: 20px; border-bottom: 1px solid var(--border); }
    .ticket-modal-timeline-title { font-size: .75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
    .ticket-modal-timeline-steps { display: flex; align-items: center; gap: 8px; font-size: .85rem; flex-wrap: wrap; }
    .ticket-modal-step { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .ticket-modal-step-time { color: var(--text-dim); font-family: monospace; font-size: .8rem; }
    .ticket-modal-step-label { color: var(--text-muted); font-size: .7rem; text-transform: uppercase; }
    .ticket-modal-arrow { color: var(--text-dim); font-weight: 600; }
    .ticket-modal-step-elapsed { color: var(--text-dim); font-size: .75rem; }
    .ticket-modal-recurring { padding: 0 20px 12px; font-size: .85rem; color: var(--text-muted); }
    .ticket-modal-recurring-link { color: var(--accent); font-family: monospace; word-break: break-all; }
    .ticket-modal-body { padding: 20px; }
    .ticket-modal-section { margin-bottom: 16px; }
    .ticket-modal-section:last-child { margin-bottom: 0; }
    .ticket-modal-section-title { font-size: .75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .ticket-modal-details { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--navy-2); }
    .ticket-modal-details summary { padding: 10px 14px; cursor: pointer; font-weight: 500; color: var(--text); user-select: none; }
    .ticket-modal-details summary:hover { background: var(--navy-3); }
    .ticket-modal-details[open] summary { border-bottom: 1px solid var(--border); }
    .ticket-modal-details pre { margin: 0; padding: 10px 14px; overflow-x: auto; font-size: .8rem; color: var(--text-muted); background: var(--navy-3); font-family: 'Courier New', monospace; }
  </style>
</head>
<body style="visibility:hidden">

  <header class="topbar">
    <a href="/" class="topbar__brand">
      <span style="font-size:1.1rem;
      font-weight:700;color:#ffffff;
      letter-spacing:1px;
      font-family:inherit;">OPERATIVE</span>
    </a>
    <nav class="topbar__nav">
      <a href="/" class="topbar__link">Agents</a>
      <a href="/admin/" class="topbar__link" id="nav-admin" style="display:none">Admin</a>
      <a href="/docs-hub/" class="topbar__link" target="_blank">📚 Docs</a>
    </nav>
    <div class="topbar__right" style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:.85rem;color:var(--text-muted)">Alert Analyser</span>
      <div id="user-badge-slot"></div>
    </div>
  </header>

  <nav class="subnav">
    <a href="/agents/alert-analyser/chat" data-standalone-href="chat.html" class="subnav__link">💬 Chat</a>
    <a href="/agents/alert-analyser/dashboard" data-standalone-href="dashboard.html" class="subnav__link subnav__link--active">📊 Dashboard</a>
    <a href="/agents/alert-analyser/reports" data-standalone-href="reports.html" class="subnav__link">📁 Reports</a>
    <a href="/agents/alert-analyser/settings" data-standalone-href="settings.html" class="subnav__link">⚙ Settings</a>
  </nav>

  <!-- Ticket Detail Modal -->
  <div id="ticketModalOverlay">
    <div class="ticket-modal-panel" id="ticketModalPanel">
      <!-- Content will be populated by JavaScript -->
    </div>
  </div>

  <div class="content">
    <div class="page-heading">
      <div>
        <div class="page-heading__title">Alert Dashboard</div>
        <div class="page-heading__sub">OpsGenie alert noise detection and signal analysis</div>
      </div>
      <button class="btn btn--primary" id="genBtn" onclick="generateAndLoad()" style="display:none">⚡ Generate Sample Data</button>
    </div>

    <!-- Global Date Filter Bar -->
    <div id="date-filter-bar" style="display:flex;align-items:center;gap:10px;padding:12px 0 8px;flex-wrap:wrap">
      <span style="font-size:.8rem;font-weight:600;color:var(--text-muted)">DATE RANGE</span>
      <input type="datetime-local" id="filter-from" class="dash-select"
        step="60"
        style="font-size:.82rem;padding:4px 8px;min-width:175px"
        title="From date">
      <span style="color:var(--text-muted);font-size:.85rem">to</span>
      <input type="datetime-local" id="filter-to" class="dash-select"
        step="60"
        style="font-size:.82rem;padding:4px 8px;min-width:175px"
        title="To date">
      <button class="btn btn--primary" id="filter-apply-btn"
        onclick="applyDateFilter()"
        style="padding:4px 14px;font-size:.82rem">Apply</button>
      <button class="btn" id="filter-reset-btn"
        onclick="resetDateFilter()"
        style="padding:4px 14px;font-size:.82rem;background:var(--navy-2)">Reset</button>
      <span id="filter-badge" style="display:none;
        background:#1e40af;color:#fff;font-size:.75rem;
        padding:2px 10px;border-radius:12px"></span>
      <label style="display:flex;align-items:center;gap:6px;
        font-size:.82rem;color:var(--text-muted);margin-left:8px;cursor:pointer">
        <input type="checkbox" id="compare-toggle"
          onchange="toggleCompare(this.checked)">
        Compare periods
      </label>
      <div id="compare-fields" style="display:none;
        align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:.8rem;font-weight:600;
          color:var(--text-muted)">PERIOD B</span>
        <input type="datetime-local" id="compare-from" class="dash-select"
          step="60"
          style="font-size:.82rem;padding:4px 8px;min-width:175px">
        <span style="color:var(--text-muted);font-size:.85rem">to</span>
        <input type="datetime-local" id="compare-to" class="dash-select"
          step="60"
          style="font-size:.82rem;padding:4px 8px;min-width:175px">
        <button class="btn btn--primary" id="compare-btn"
          onclick="applyCompare()"
          style="padding:4px 14px;font-size:.82rem">Compare</button>
      </div>
      <span style="font-size:.75rem;color:var(--text-muted);margin-left:auto">
        🕐 All times in UTC
      </span>
    </div>

    <div class="tab-bar">
      <button class="tab-btn tab-btn--active" onclick="switchTab('overview',this)">Overview</button>
      <button class="tab-btn" onclick="switchTab('noise',this)">Noise Analysis</button>
      <button class="tab-btn" onclick="switchTab('genuine',this)">Genuine Alerts</button>
      <button class="tab-btn" onclick="switchTab('trends',this)">Trends</button>
      <button class="tab-btn" onclick="switchTab('incidents',this)">🚨 Escalated Incidents</button>
      <button class="tab-btn" onclick="switchTab('insights',this)">AI Insights</button>
    </div>

    <div id="tab-overview" class="tab-panel tab-panel--active"></div>
    <div id="tab-noise"    class="tab-panel"></div>
    <div id="tab-genuine"  class="tab-panel"></div>
    <div id="tab-trends"   class="tab-panel"></div>
    <div id="tab-incidents" class="tab-panel"></div>
    <div id="tab-insights" class="tab-panel"></div>
  </div>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/portal.js?v=3"></script>
  <script>
    // ── Dual-mode detection: works inside Operative portal AND standalone ──
    const _isPortal = (typeof window._authHeaders === 'function');
    if (!_isPortal) {
      window.BACKEND_URL = '';
      window._authHeaders = () => ({});
    }
  </script>
  <script>
    Chart.register(ChartDataLabels);
    const SLUG  = 'alert-analyser';
    const _isPortalMode = (typeof window._authHeaders === 'function' && typeof window._authHeaders() === 'object');
    const PROXY = _isPortalMode ? `${BACKEND_URL}/api/agents/${SLUG}/proxy` : '';
    const charts = {};
    let stats = null;

    async function api(path, opts = {}) {
      const res = await fetch(`${PROXY}${path}`, {
        ...opts,
        headers: { ..._authHeaders(), ...opts.headers },
      });
      if (!res.ok) {
        const e = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(e.detail || `HTTP ${res.status}`);
      }
      return res.json();
    }

    function switchTab(name, btn) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('tab-panel--active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-btn--active'));
      document.getElementById('tab-' + name).classList.add('tab-panel--active');
      btn.classList.add('tab-btn--active');
      if (name === 'insights') renderInsights();
    }

    async function generateAndLoad() {
      const btn = document.getElementById('genBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Generating…';
      try {
        await api('/reports/generate-sample', { method: 'POST' });
        showToast('Generated 200 synthetic alerts', 'success');
        await loadDashboard();
      } catch (e) {
        showToast('Generation failed: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '⚡ Generate Sample Data';
      }
    }

    // ── Date filter helpers ──────────────────────────────────────────
    let _activeFromDate = null;
    let _activeToDate = null;

    function _initDefaultDateRange() {
      const now = new Date();
      const oneDayAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
      const fmt = d => d.toISOString().slice(0, 16);
      const fromVal = fmt(oneDayAgo);
      const toVal = fmt(now);
      document.getElementById('filter-from').value = fromVal;
      document.getElementById('filter-to').value = toVal;
      _activeFromDate = fromVal.replace('T', ' ');
      _activeToDate = toVal.replace('T', ' ');
      const badge = document.getElementById('filter-badge');
      badge.style.display = 'inline';
      badge.textContent = fromVal.slice(0, 16) + ' → ' + toVal.slice(0, 16);
    }
    let _compareMode = false;

    function applyDateFilter() {
      window._compareActive = false;
      window._compareDataA = null;
      window._compareDataB = null;
      document.getElementById('compare-toggle').checked = false;
      toggleCompare(false);
      const _fv = document.getElementById('filter-from').value;
      const _tv = document.getElementById('filter-to').value;
      _activeFromDate = _fv ? _fv.replace('T', ' ') : null;
      _activeToDate = _tv ? _tv.replace('T', ' ') : null;
      const badge = document.getElementById('filter-badge');
      if (_activeFromDate || _activeToDate) {
        badge.style.display = 'inline';
        const _fd = _activeFromDate ? _activeFromDate.slice(0,16) : '…';
        const _td = _activeToDate ? _activeToDate.slice(0,16) : 'now';
        badge.textContent = _fd + ' → ' + _td;
      } else {
        badge.style.display = 'none';
      }
      loadDashboard();
    }

    function resetDateFilter() {
      _activeFromDate = null;
      _activeToDate = null;
      _initDefaultDateRange();
      document.getElementById('compare-toggle').checked = false;
      toggleCompare(false);
      window._compareActive = false;
      window._compareDataA = null;
      window._compareDataB = null;
      document.getElementById('filter-apply-btn').disabled = false;
      document.getElementById('filter-apply-btn').style.opacity = '1';
      loadDashboard();
    }

    function toggleCompare(enabled) {
      _compareMode = enabled;
      const cf = document.getElementById('compare-fields');
      cf.style.display = enabled ? 'flex' : 'none';
      if (enabled) {
        document.getElementById('filter-apply-btn').disabled = true;
        document.getElementById('filter-apply-btn').style.opacity = '0.4';
      } else {
        document.getElementById('filter-apply-btn').disabled = false;
        document.getElementById('filter-apply-btn').style.opacity = '1';
      }
    }

    async function applyCompare() {
      const fromA = document.getElementById('filter-from').value?.replace('T',' ') || null;
      const toA = document.getElementById('filter-to').value?.replace('T',' ') || null;
      const fromB = document.getElementById('compare-from').value?.replace('T',' ') || null;
      const toB = document.getElementById('compare-to').value?.replace('T',' ') || null;
      if (!fromA && !fromB) return;
      // Fetch both periods in parallel
      const qA = new URLSearchParams();
      if (fromA) qA.set('from_date', fromA);
      if (toA) qA.set('to_date', toA);
      const qB = new URLSearchParams();
      if (fromB) qB.set('from_date', fromB);
      if (toB) qB.set('to_date', toB);
      const compareBtn = document.getElementById('compare-btn');
      compareBtn.disabled = true;
      compareBtn.textContent = 'Comparing...';
      const [trendA, trendB] = await Promise.all([
        api('/dashboard/trend?' + qA.toString()),
        api('/dashboard/trend?' + qB.toString()),
      ]);
      const [dashA, dashB, summaryA, summaryB] = await Promise.all([
        api('/dashboard?' + qA.toString()).catch(() => ({})),
        api('/dashboard?' + qB.toString()).catch(() => ({})),
        api('/dashboard/period-summary?' + qA.toString()).catch(() => ({})),
        api('/dashboard/period-summary?' + qB.toString()).catch(() => ({})),
      ]);
      window._compareDataA = dashA;
      window._compareDataB = dashB;
      window._compareSummaryA = summaryA;
      window._compareSummaryB = summaryB;
      window._compareLabelA = (fromA || '…') + '→' + (toA || 'now');
      window._compareLabelB = (fromB || '…') + '→' + (toB || 'now');
      window._compareActive = true;
      renderCompare(trendA, trendB,
        (fromA || '…') + '→' + (toA || 'now'),
        (fromB || '…') + '→' + (toB || 'now'));
      renderOverview();
      renderNoise();
      renderGenuine();
      compareBtn.disabled = false;
      compareBtn.textContent = 'Compare';
    }

    function renderCompare(trendA, trendB, labelA, labelB) {
      const el = document.getElementById('tab-trends');
      const lastA = trendA.points?.slice(-1)[0] || {};
      const lastB = trendB.points?.slice(-1)[0] || {};
      const noiseDelta = ((lastB.noise_pct || 0) - (lastA.noise_pct || 0)).toFixed(1);
      const genuineDelta = (lastB.genuine || 0) - (lastA.genuine || 0);
      const arrow = n => n < 0
        ? `<span style="color:#16a34a">▼ ${Math.abs(n)}</span>`
        : n > 0
        ? `<span style="color:#dc2626">▲ ${n}</span>`
        : `<span style="color:var(--text-muted)">— ${n}</span>`;
      el.innerHTML = `
        <div class="chart-card" style="margin-bottom:16px">
          <div class="chart-card__title">Period Comparison</div>
          <table class="data-table" style="margin-top:12px">
            <thead><tr>
              <th>Metric</th>
              <th>${labelA}</th>
              <th>${labelB}</th>

    async function loadDashboard() {
      await portalReady;
      ['overview','noise','genuine','trends','incidents'].forEach(t =>
        document.getElementById('tab-' + t).innerHTML = skeletonHTML());
      try {
        const _qs = new URLSearchParams();
        if (_activeFromDate) _qs.set('from_date', _activeFromDate);
        if (_activeToDate) _qs.set('to_date', _activeToDate);
        const _dashUrl = '/dashboard' + (_qs.toString() ? '?' + _qs.toString() : '');
        const _periodUrl = '/dashboard/period-summary' + (_qs.toString() ? '?' + _qs.toString() : '');
        const _histUrl = '/dashboard/history';
        const [data, cfg, periodData, allTimeData, historyData, incidentsData] = await Promise.all([
            api(_dashUrl),
            api('/settings').catch(() => ({})),
            api(_periodUrl).catch(() => ({})),
            api('/dashboard/lifetime').catch(() => ({})),
            api(_histUrl).catch(() => ({ empty: true, trend: [], hourly_pattern: [] })),
            api('/dashboard/incidents').catch(() => ({})),
        ]);
        window._periodData = periodData;
        window._allTimeData = allTimeData;
        window._historyData = historyData;
        window._incidentsData = incidentsData;
        const sourceType = cfg.source_type || 'synthetic';
        const genBtn = document.getElementById('genBtn');
        if (genBtn) genBtn.style.display = sourceType === 'synthetic' ? '' : 'none';
        if (data.empty) {
          ['overview','noise','genuine','trends'].forEach(t =>
            document.getElementById('tab-' + t).innerHTML = emptyState('🚨','No alert data loaded',
              `Click "Generate Sample Data" or upload alerts on the <a href="${_isPortalMode ? '/agents/alert-analyser/reports' : 'reports.html'}">Reports page</a>.`));
          return;
        }
        stats = data.stats;
        renderOverview();
        renderNoise();
        renderGenuine();
        renderTrends();
        renderIncidents();
      } catch (e) {
        showToast('Failed to load dashboard: ' + e.message, 'error');
      }

    function skeletonHTML() {
      return `<div style="display:flex;flex-direction:column;gap:12px;padding:4px 0">

    function emptyState(icon, title, sub) {
      return `<div class="empty-state"><div class="empty-state__icon">${icon}</div>
        <div class="empty-state__title">${title}</div>
        <div class="empty-state__sub">${sub}</div></div>`;

    function priClass(p) { return `pri pri--${(p||'p5').toLowerCase()}`; }
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        const el = document.createElement('textarea');
        el.value = text;
        el.style.position = 'fixed';
        el.style.opacity = '0';
        document.body.appendChild(el);
        el.focus();
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
      }
    }
    function copyMsgCell(btn) {
      const txt = btn.parentElement.querySelector('.msg-text')?.textContent || '';
      copyToClipboard(txt);
      const orig = btn.textContent;
      btn.textContent = '✅';
      btn.title = 'Copied!';
      setTimeout(() => { btn.textContent = orig; btn.title = 'Copy message'; }, 1000);

    // ── Ticket Detail Modal ──────────────────────────────────────────────
    let _currentTicketData = null;

    async function openTicketModal(ticket) {
      _currentTicketData = ticket;
      const overlay = document.getElementById('ticketModalOverlay');
      const panel = document.getElementById('ticketModalPanel');
      overlay.classList.add('show');

      const statusColors = {
        'ESCALATED': '#ea580c',
        'INVESTIGATING': '#f59e0b',
        'RCA_COMPLETE': '#a855f7',
        'REMEDIATING': '#0EA5E9',
        'RESOLVED': '#16a34a',
        'MANUAL': '#dc2626',
      };

      const priColor = {
        'P1': '#dc2626',
        'P2': '#ea580c',
        'P3': '#b45309',
        'P4': '#64748b',
      };

      const esc = s => { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; };

      // Build header with badges
      const priClass = (p) => `pri pri--${(p||'p5').toLowerCase()}`;
      let badges = `<span class="${priClass(ticket.priority)}">${esc(ticket.priority)}</span>`;
      badges += `<span class="ticket-modal-badge" style="background:${statusColors[ticket.status] || '#64748b'}20;color:${statusColors[ticket.status] || '#64748b'}">${esc(ticket.status)}</span>`;
      if (ticket.sla_breached) {
        badges += `<span class="ticket-modal-badge" style="background:rgba(220,38,38,.1);color:#dc2626">⚠ SLA Breached</span>`;
      }

      // Compute resolution method badge
      let resolutionBadge = '';
      if (ticket.status === 'RESOLVED' || ticket.status === 'MANUAL') {
        let resolutionLabel = '';
        let resolutionColor = '#16a34a';
        if (ticket.status === 'RESOLVED') {
          if (ticket.resolved_externally) {
            resolutionLabel = 'Action-Resolved';
            resolutionColor = '#0EA5E9';
          } else {
            resolutionLabel = 'Auto-Resolved';
          }
        } else if (ticket.status === 'MANUAL') {
          resolutionLabel = 'Manual';
          resolutionColor = '#dc2626';
        }
        if (resolutionLabel) {
          resolutionBadge = `<span class="ticket-modal-badge" style="background:${resolutionColor}20;color:${resolutionColor}">${resolutionLabel}</span>`;
        }
      }

      // Helper to format elapsed time between dates
      const elapsedTime = (from, to) => {
        if (!from || !to) return '';
        const f = new Date(from);
        const t = new Date(to);
        const ms = t - f;
        const secs = Math.floor(ms / 1000);
        if (secs < 60) return secs + 's';
        const mins = Math.floor(secs / 60);
        if (mins < 60) return mins + 'm';
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + 'h';
        const days = Math.floor(hours / 24);
        return days + 'd';
      };

      // Build timeline
      let timelineHTML = '';
      const steps = [];
      if (ticket.created_at) steps.push({ label: 'Created', time: ticket.created_at });
      if (ticket.escalated_at) steps.push({ label: 'Escalated', time: ticket.escalated_at });
      if (ticket.resolved_at) steps.push({ label: 'Resolved', time: ticket.resolved_at });

      if (steps.length > 0) {
        timelineHTML = '<div class="ticket-modal-timeline-steps">';
        steps.forEach((step, idx) => {
          timelineHTML += `<div class="ticket-modal-step">
            <div class="ticket-modal-step-time">${step.time.substring(0, 16).replace('T', ' ')}</div>
            <div class="ticket-modal-step-label">${step.label}</div>
          </div>`;
          if (idx < steps.length - 1) {
            const nextStep = steps[idx + 1];
            const elapsed = elapsedTime(step.time, nextStep.time);
            timelineHTML += `<div class="ticket-modal-arrow">→</div><div class="ticket-modal-step-elapsed">${elapsed}</div>`;
          }
        });
        timelineHTML += '</div>';
      }

      // Recurring link
      let recurringHTML = '';
      if (ticket.related_ticket_id) {
        recurringHTML = `<div class="ticket-modal-recurring">
          🔁 Recurring — related ticket: <span class="ticket-modal-recurring-link">${esc(ticket.related_ticket_id)}</span>
        </div>`;
      }

      // Loading state for payload
      let payloadHTML = '<div style="padding:10px 14px;color:var(--text-muted);font-size:.85rem">⏳ Loading alert payload…</div>';

      panel.innerHTML = `
        <div class="ticket-modal-header">
          <div class="ticket-modal-header-left">
            <div class="ticket-modal-id">ID: <span class="ticket-modal-id-val" title="${esc(ticket.id)}">${esc(ticket.id.substring(0, 12))}…</span></div>
            <div style="font-size:.75rem;color:var(--text-dim);margin-bottom:8px">Alert: <span style="color:var(--text-muted);font-family:monospace">${esc(ticket.alert_id)}</span></div>
            <div class="ticket-modal-title">${esc(ticket.title)}</div>
            <div class="ticket-modal-badges">${badges}${resolutionBadge}</div>
          </div>
          <button class="ticket-modal-close" onclick="closeTicketModal()">✕</button>
        </div>
        ${timelineHTML ? `<div class="ticket-modal-timeline">
          <div class="ticket-modal-timeline-title">Timeline</div>
          ${timelineHTML}
        </div>` : ''}
        ${recurringHTML}
        <div class="ticket-modal-body">
          <div class="ticket-modal-section">
            <div class="ticket-modal-section-title">Alert Payload</div>
            <details class="ticket-modal-details" ${ticket.priority === 'P1' || ticket.priority === 'P2' ? (ticket.sla_breached ? 'open' : '') : ''}>
              <summary>Raw JSON</summary>
              <pre id="ticketPayloadPre">${payloadHTML}</pre>
            </details>
          </div>
        </div>
      `;

      // Fetch alert payload
      try {
        const payload = await api(`/dashboard/incidents/${ticket.id}`);
        if (payload && payload.alert_payload) {
          const pre = document.getElementById('ticketPayloadPre');
          if (pre) {
            pre.textContent = JSON.stringify(payload.alert_payload, null, 2);
          }
        }
      } catch (e) {
        const pre = document.getElementById('ticketPayloadPre');
        if (pre) {
          pre.textContent = 'Failed to load payload: ' + e.message;
          pre.style.color = 'var(--danger)';
        }
      }
    }

    // Collapse OpsGenie team values (e.g. "{'type':'team','id':'9a64f39e-...'}") to "Team-XXXXXXXX".
    function cleanTeam(t) {

      const s = String(t).trim();
      if (!s || s.toLowerCase() === 'unknown') return 'Unknown';
      const m = s.match(/([0-9a-fA-F]{8})-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/);

    }

      return `<span style="color:var(--text-muted);font-size:.8rem">— 0</span>`;

          {label:'Genuine',       data:histCls.trend.map(d=>d.new_genuine||0), backgroundColor:'#16a34a'},
          {label:'Noise Suspect', data:histCls.trend.map(d=>d.new_suspect||0), backgroundColor:'#f59e0b'},
          {label:'Noise',         data:histCls.trend.map(d=>d.new_noise||0),   backgroundColor:'#dc2626'},

    // Noise trend over time - uses bucketed history data (immune to

    // ── Escalated Incidents ──────────────────────────────────────────────────
    let _ticketsMap = {}; // Global map of ticket ID -> ticket object for modal lookup
    let _allIncidentTickets = []; // Global list of all incident tickets for filtering
    let _expandedLanes = new Set(); // Track which lanes show all tickets

    function filterAndSortIncidents() {
      const search = (document.getElementById('incidentSearch')?.value || '').toLowerCase();
      const statusFilter = document.getElementById('incidentStatusFilter')?.value || 'All';
      const sortOption = document.getElementById('incidentSort')?.value || 'oldest-first';

      let filtered = _allIncidentTickets.filter(t => {
        if (statusFilter !== 'All' && t.status !== statusFilter) return false;
        if (search) {
          const titleMatch = t.title?.toLowerCase().includes(search);
          const idMatch = t.alert_id?.toLowerCase().includes(search);
          if (!titleMatch && !idMatch) return false;
        }
        return true;
      });

      if (sortOption === 'newest-first') {
        filtered.sort((a, b) => new Date(b.escalated_at || b.created_at) - new Date(a.escalated_at || a.created_at));
      } else if (sortOption === 'most-recurring') {
        filtered.sort((a, b) => b.recurrence_count - a.recurrence_count);
      } else {
        filtered.sort((a, b) => new Date(a.escalated_at || a.created_at) - new Date(b.escalated_at || b.created_at));
      }
      return filtered;
    }

    function expandLane(priority) {
      _expandedLanes.add(priority);
      updateIncidentsDisplay();
    }

    function collapseLane(priority) {
      _expandedLanes.delete(priority);
      updateIncidentsDisplay();
    }

    function updateIncidentsDisplay() {
      const filtered = filterAndSortIncidents();
      const priorityGroups = {
        'P1': { label: 'P1-CRITICAL', tickets: [] },
        'P2': { label: 'P2-HIGH', tickets: [] },
        'P3': { label: 'P3-MEDIUM', tickets: [] },
        'P4': { label: 'P4-LOW', tickets: [] },
      };
      filtered.forEach(t => {
        const p = t.priority || 'P4';
        if (priorityGroups[p]) priorityGroups[p].tickets.push(t);
      });

      const statusDot = (status) => {
        const statusColors = {
          'ESCALATED': '#ea580c',
          'INVESTIGATING': '#f59e0b',
          'RCA_COMPLETE': '#a855f7',
          'REMEDIATING': '#0EA5E9',
          'RESOLVED': '#16a34a',
          'MANUAL': '#dc2626',
        };
        const color = statusColors[status] || '#64748b';
        return `<div style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:6px;vertical-align:middle"></div>`;
      };

      const timeAgo = (isoDateStr) => {
        if (!isoDateStr) return 'unknown';
        const date = new Date(isoDateStr);
        const now = new Date();
        const secs = Math.floor((now - date) / 1000);
        if (secs < 60) return secs + 's';
        if (secs < 3600) return Math.floor(secs / 60) + 'm';
        if (secs < 86400) return Math.floor(secs / 3600) + 'h';
        return Math.floor(secs / 86400) + 'd';
      };

      const buildCardForUpdate = (ticket) => {
        const esc = s => { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; };
        const recBadge = ticket.recurrence_count > 1
          ? `<span style="display:inline-flex;align-items:center;padding:2px 6px;background:var(--warn-bg);color:var(--warn);border-radius:4px;font-size:.7rem;font-weight:600;margin-left:auto">${ticket.recurrence_count}×</span>`
          : '';
        const slaBadge = ticket.sla_breached
          ? `<span style="display:inline-flex;align-items:center;padding:2px 6px;background:#fecaca;color:#dc2626;border-radius:4px;font-size:.7rem;font-weight:600;margin-left:4px">⚠ SLA</span>`
          : '';
        const time = timeAgo(ticket.escalated_at || ticket.created_at);
        const borderLeftColor = ticket.sla_breached ? '#dc2626' : 'var(--border)';
        return `
          <div class="ticket-card" style="padding:10px;background:var(--navy-1);border:1px solid var(--border);border-left:3px solid ${borderLeftColor};border-radius:var(--r-sm);margin-bottom:8px;font-size:.8rem;cursor:pointer;transition:background var(--t);user-select:none" data-ticket-id="${esc(ticket.id)}">
            <div style="display:flex;align-items:center;margin-bottom:6px;gap:4px">
              ${statusDot(ticket.status)}
              <span style="color:var(--text-dim);font-size:.7rem">${esc(ticket.id.substring(0, 8))}</span>
              <span style="color:var(--text-muted);font-weight:600;margin-left:auto">${time}</span>
            </div>
            <div style="color:var(--text);font-weight:500;margin-bottom:4px;word-break:break-word;display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <span style="flex:1">${esc(ticket.title.substring(0, 45))}</span>
              <div style="display:flex;gap:4px">${recBadge}${slaBadge}</div>
            </div>
            <div style="color:var(--text-dim);font-size:.75rem">${esc(ticket.alert_id)}</div>
          </div>
        `;
      };

      const buildColumnForUpdate = (priority, group) => {
        const slaTargets = { 'P1': 15, 'P2': 30, 'P3': 60, 'P4': 240 };
        const tix = group.tickets;
        const isExpanded = _expandedLanes.has(priority);
        const displayCount = isExpanded ? tix.length : 6;
        const displayed = tix.slice(0, displayCount);
        const remaining = tix.length - displayCount;

        if (tix.length === 0) {
          return `
            <div style="flex:1;min-width:280px;padding:12px;background:var(--navy-2);border-radius:var(--r);border:1px solid var(--border)">
              <div style="font-size:.85rem;font-weight:600;color:var(--text-muted);margin-bottom:4px">${group.label}</div>
              <div style="font-size:.75rem;color:var(--text-dim);margin-bottom:12px">SLA: ${slaTargets[priority]} min</div>
              <div style="text-align:center;color:var(--text-dim);font-size:.8rem;padding:24px 0">No tickets</div>
            </div>
          `;
        }

        let buttonHTML = '';
        if (isExpanded) {
          buttonHTML = `<button onclick="collapseLane('${priority}')" style="width:100%;padding:6px 12px;font-size:.75rem;margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer">Show Less</button>`;
        } else if (remaining > 0) {
          buttonHTML = `<button onclick="expandLane('${priority}')" style="width:100%;padding:6px 12px;font-size:.75rem;margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer">Show ${remaining} More</button>`;
        }

        return `
          <div style="flex:1;min-width:280px;padding:12px;background:var(--navy-2);border-radius:var(--r);border:1px solid var(--border);display:flex;flex-direction:column">
            <div style="font-size:.85rem;font-weight:600;color:var(--text-muted);margin-bottom:4px">${group.label}</div>
            <div style="font-size:.75rem;color:var(--text-dim);margin-bottom:12px">SLA: ${slaTargets[priority]} min</div>
            <div style="flex:1;overflow-y:auto;min-height:0;padding-right:8px">
              ${displayed.map(t => buildCardForUpdate(t)).join('')}
            </div>
            ${buttonHTML}
          </div>
        `;
      };

      const lanesHTML = `<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:12px">
        ${Object.entries(priorityGroups).map(([p, g]) => buildColumnForUpdate(p, g)).join('')}
      </div>`;

      const container = document.getElementById('incidentsLanesContainer');
      if (container) {
        container.innerHTML = lanesHTML;
        attachIncidentCardListeners();
      }
    }

    function attachIncidentCardListeners() {
      document.querySelectorAll('.ticket-card').forEach(card => {
        const ticketId = card.getAttribute('data-ticket-id');
        if (ticketId && _ticketsMap[ticketId]) {
          card.addEventListener('click', () => openTicketModal(_ticketsMap[ticketId]));
          card.addEventListener('mouseover', () => { card.style.background = 'var(--navy-2)'; });
          card.addEventListener('mouseout', () => { card.style.background = 'var(--navy-1)'; });
        }
      });
    }

    function fmtDuration(minutes) {
      if (minutes == null) return '—';
      const m = Number(minutes);
      if (m < 1) return Math.round(m * 60) + 's';
      if (m < 60) return Math.round(m) + 'm';
      if (m < 1440) return (m / 60).toFixed(1) + 'h';
      return (m / 1440).toFixed(1) + 'd';
    }

    const _incPageState = { open: 1, resolved: 1, failures: 1 };
    const _incPageSize = 20;

    function _paginate(arr, page, size) {
      const start = (page - 1) * size;
      return arr.slice(start, start + size);
    }

    const _incSectionFns = { open: 'renderOpenIncidentsSection', resolved: 'renderResolvedIncidentsSection', failures: 'renderFailuresSection' };
    function _paginationControls(section, total, page, size) {
      const totalPages = Math.max(1, Math.ceil(total / size));
      if (totalPages <= 1) return '';
      const fn = _incSectionFns[section];
      return `<div style="display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:8px;font-size:.8rem;color:var(--text-muted)">
        <button class="btn btn--sm" ${page<=1?'disabled':''} onclick="_incPageState['${section}']=${page-1};${fn}()">← Prev</button>
        <span>Page ${page} of ${totalPages}</span>
        <button class="btn btn--sm" ${page>=totalPages?'disabled':''} onclick="_incPageState['${section}']=${page+1};${fn}()">Next →</button>
      </div>`;
    }

      container.innerHTML = `
        <div class="section-title" style="margin-top:24px">Open Incidents</div>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;padding:10px;background:var(--navy-2);border-radius:var(--r)">

            <option value="">All Statuses</option>

    async function renderIncidents() {
      const el = document.getElementById('tab-incidents');
      const esc = s => { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; };
      try {
        const data = await api('/dashboard/incidents');
        if (data.empty) {
          el.innerHTML = emptyState('📭', 'No escalated incidents', 'Create your first incident by loading genuine P1/P2 alerts.');
          return;
        }

        const pipelineFlow = data.pipeline_flow || [];
        const agingBuckets = data.aging_buckets || [];
        const agingLongest = data.aging_longest_wait;
        const slaBreachData = data.sla_breach || {};
        const resolutionRing = data.resolution_ring || {};
        const recurrenceSignal = data.recurrence_signal || [];

        const listData = await api('/dashboard/incidents/list?limit=200').catch(() => ({ tickets: [], total: 0 }));
        const tickets = listData.tickets || [];
        const totalTickets = listData.total || tickets.length;

        // Store for filtering/sorting
        _allIncidentTickets = tickets;
        _expandedLanes = new Set();

        // Populate tickets map for modal lookup
        _ticketsMap = {};
        tickets.forEach(t => {
          _ticketsMap[t.id] = t;
        });

        const priorityGroups = {
          'P1': { label: 'P1-CRITICAL', tickets: [] },
          'P2': { label: 'P2-HIGH', tickets: [] },
          'P3': { label: 'P3-MEDIUM', tickets: [] },
          'P4': { label: 'P4-LOW', tickets: [] },
        };
        tickets.forEach(t => {
          const p = t.priority || 'P4';
          if (priorityGroups[p]) priorityGroups[p].tickets.push(t);
        });

        const statusColors = {
          'ESCALATED': '#ea580c',
          'INVESTIGATING': '#f59e0b',
          'RCA_COMPLETE': '#a855f7',
          'REMEDIATING': '#0EA5E9',
          'RESOLVED': '#16a34a',
          'MANUAL': '#dc2626',
        };

        const pipelineLabels = pipelineFlow.map(p => p.status);
        const pipelineData = pipelineFlow.map(p => p.count);
        const pipelineColors = pipelineFlow.map(p => statusColors[p.status] || '#64748b');

        // Priority-based aging chart data
        const agingBandLabels = ['< SLA', 'Mild', 'Moderate', 'Critical'];
        const agingPriorityColors = { P1: '#dc2626', P2: '#f59e0b', P3: '#6366f1', P4: '#0EA5E9' };
        const agingPriorityNames = (agingBuckets || []).map(pb => pb.priority);
        const agingBandCount = agingBuckets?.[0]?.bands?.length || 4;
        const agingBandColors = ['#16a34a', '#f59e0b', '#f97316', '#dc2626'];
        const agingBandDatasets = Array.from({ length: agingBandCount }, (_, i) => ({
          label: agingBuckets?.[0]?.bands?.[i]?.bucket || `Band ${i+1}`,
          data: (agingBuckets || []).map(pb => pb.bands[i]?.count || 0),
          backgroundColor: agingBandColors[i],
          borderRadius: 0,
          borderWidth: 0,
        }));

        const agingCallout = agingLongest ? `
          <div style="margin-top:12px;padding:10px;background:var(--navy-2);border-radius:6px;font-size:.8rem;border-left:3px solid #dc2626">
            <div style="font-weight:600;color:var(--text);margin-bottom:4px">Longest Wait</div>
            <div style="color:var(--text-muted);margin-bottom:3px"><strong>${esc(agingLongest.title).substring(0, 60)}</strong></div>
            <div style="color:var(--text-dim);font-size:.75rem">${Number(agingLongest.minutes_waiting)|0} min • ${esc(agingLongest.alert_id)}</div>
          </div>
        ` : '';

        const slaBreachColor = slaBreachData.breach_pct > 50 ? '#dc2626' : (slaBreachData.breach_pct >= 20 ? '#f59e0b' : '#16a34a');
        const perPriority = slaBreachData.per_priority || {};
        const priorityRows = ['P1','P2','P3','P4'].filter(p => perPriority[p]).map(p => {
          const pd = perPriority[p];
          const color = pd.breach_pct > 80 ? '#dc2626' : pd.breach_pct > 20 ? '#f59e0b' : '#16a34a';
          const slaHours = pd.sla_minutes >= 60 ? (pd.sla_minutes/60 >= 24 ? `${Math.round(pd.sla_minutes/60/24)}d` : `${Math.round(pd.sla_minutes/60)}h`) : `${pd.sla_minutes}m`;
          const withinPct = pd.breach_pct > 0 ? (100 - pd.breach_pct).toFixed(1) : 100;
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--border);font-size:.75rem">
            <span style="font-weight:600;color:var(--text)">${p} <span style="color:var(--text-dim);font-weight:400">(SLA ${slaHours})</span></span>
            <span><strong style="color:${color}">${pd.breached.toLocaleString()}</strong> <span style="color:${color}">(breach rate: ${pd.breach_pct}%)</span> · <strong style="color:#16a34a">${pd.within.toLocaleString()}</strong> <span style="color:#16a34a">(within SLA: ${withinPct}%)</span></span>
          </div>`;
        }).join('');
        const slaBreachSummary = slaBreachData.breached_count !== undefined ? `
          <div style="margin-top:12px;padding:10px;background:var(--navy-2);border-radius:6px;font-size:.8rem;border-left:3px solid ${slaBreachColor}">
            <div style="color:var(--text-muted);font-size:.75rem;margin-bottom:6px">Overall: <strong style="color:${slaBreachColor}">${slaBreachData.breached_count.toLocaleString()}</strong> <span style="color:${slaBreachColor}">(breach rate: ${slaBreachData.breach_pct}%)</span> · <strong style="color:#16a34a">${slaBreachData.within_sla_count.toLocaleString()}</strong> <span style="color:#16a34a">(within SLA: ${(100 - slaBreachData.breach_pct).toFixed(1)}%)</span></div>
            ${priorityRows}
          </div>
        ` : '';

        const recurrenceList = recurrenceSignal.length ? recurrenceSignal.map(r => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.83rem">
            <div style="flex:1">
              <div style="font-weight:500;color:var(--text);margin-bottom:2px">${esc(r.title).substring(0, 50)}</div>
              <div style="font-size:.72rem;color:var(--text-dim)">${esc(r.alert_id)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;margin-left:12px">
              <span style="display:inline-flex;align-items:center;padding:2px 8px;background:var(--warn-bg);color:var(--warn);border-radius:4px;font-size:.72rem;font-weight:600">${Number(r.recurrence_count)|0}×</span>
              <span style="font-size:.72rem;color:var(--text-muted);min-width:80px">${esc(r.status)}</span>
            </div>
          </div>
        `).join('') : '<div style="padding:16px;text-align:center;color:var(--text-dim);font-size:.85rem">No recurring incidents</div>';

        const timeAgo = (isoDateStr) => {
          if (!isoDateStr) return 'unknown';
          const date = new Date(isoDateStr);
          const now = new Date();
          const secs = Math.floor((now - date) / 1000);
          if (secs < 60) return secs + 's';
          if (secs < 3600) return Math.floor(secs / 60) + 'm';
          if (secs < 86400) return Math.floor(secs / 3600) + 'h';
          return Math.floor(secs / 86400) + 'd';
        };

        const statusDot = (status) => {
          const color = statusColors[status] || '#64748b';
          return `<div style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:6px;vertical-align:middle"></div>`;
        };

        const buildCard = (ticket) => {
          const recBadge = ticket.recurrence_count > 1
            ? `<span style="display:inline-flex;align-items:center;padding:2px 6px;background:var(--warn-bg);color:var(--warn);border-radius:4px;font-size:.7rem;font-weight:600;margin-left:auto">${ticket.recurrence_count}×</span>`
            : '';
          const slaBadge = ticket.sla_breached
            ? `<span style="display:inline-flex;align-items:center;padding:2px 6px;background:#fecaca;color:#dc2626;border-radius:4px;font-size:.7rem;font-weight:600;margin-left:4px">⚠ SLA</span>`
            : '';
          const time = timeAgo(ticket.escalated_at || ticket.created_at);
          const borderLeftColor = ticket.sla_breached ? '#dc2626' : 'var(--border)';
          return `
            <div class="ticket-card" style="padding:10px;background:var(--navy-1);border:1px solid var(--border);border-left:3px solid ${borderLeftColor};border-radius:var(--r-sm);margin-bottom:8px;font-size:.8rem;cursor:pointer;transition:background var(--t);user-select:none" data-ticket-id="${esc(ticket.id)}">
              <div style="display:flex;align-items:center;margin-bottom:6px;gap:4px">
                ${statusDot(ticket.status)}
                <span style="color:var(--text-dim);font-size:.7rem">${esc(ticket.id.substring(0, 8))}</span>
                <span style="color:var(--text-muted);font-weight:600;margin-left:auto">${time}</span>
              </div>
              <div style="color:var(--text);font-weight:500;margin-bottom:4px;word-break:break-word;display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
                <span style="flex:1">${esc(ticket.title.substring(0, 45))}</span>
                <div style="display:flex;gap:4px">${recBadge}${slaBadge}</div>
              </div>
              <div style="color:var(--text-dim);font-size:.75rem">${esc(ticket.alert_id)}</div>
            </div>
          `;
        };

        const buildColumn = (priority, group) => {
          const slaTargets = { 'P1': 15, 'P2': 30, 'P3': 60, 'P4': 240 };
          const tix = group.tickets;
          if (tix.length === 0) {
            return `
              <div style="flex:1;min-width:280px;padding:12px;background:var(--navy-2);border-radius:var(--r);border:1px solid var(--border)">
                <div style="font-size:.85rem;font-weight:600;color:var(--text-muted);margin-bottom:4px">${group.label}</div>
                <div style="font-size:.75rem;color:var(--text-dim);margin-bottom:12px">SLA: ${slaTargets[priority]} min</div>
                <div style="text-align:center;color:var(--text-dim);font-size:.8rem;padding:24px 0">No tickets</div>
              </div>
            `;
          }
          const isExpanded = _expandedLanes.has(priority);
          const displayCount = isExpanded ? tix.length : 6;
          const displayed = tix.slice(0, displayCount);
          const remaining = tix.length - displayCount;

          let buttonHTML = '';
          if (isExpanded) {
            buttonHTML = `<button onclick="collapseLane('${priority}')" style="width:100%;padding:6px 12px;font-size:.75rem;margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer">Show Less</button>`;
          } else if (remaining > 0) {
            buttonHTML = `<button onclick="expandLane('${priority}')" style="width:100%;padding:6px 12px;font-size:.75rem;margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer">Show ${remaining} More</button>`;
          }

          return `
            <div style="flex:1;min-width:280px;padding:12px;background:var(--navy-2);border-radius:var(--r);border:1px solid var(--border);display:flex;flex-direction:column">
              <div style="font-size:.85rem;font-weight:600;color:var(--text-muted);margin-bottom:4px">${group.label}</div>
              <div style="font-size:.75rem;color:var(--text-dim);margin-bottom:12px">SLA: ${slaTargets[priority]} min</div>
              <div style="flex:1;overflow-y:auto;min-height:0;padding-right:8px">
                ${displayed.map(t => buildCard(t)).join('')}
              </div>
              ${buttonHTML}
            </div>
          `;
        };

        const lanesHTML = `<div style="margin-top:20px;display:flex;gap:12px;overflow-x:auto;padding-bottom:12px">
          ${Object.entries(priorityGroups).map(([p, g]) => buildColumn(p, g)).join('')}
        </div>`;

        el.innerHTML = `
          <div id="pipeline-summary-container"></div>
          <div id="mttx-kpi-container"></div>
          <div id="open-incidents-section"></div>
          <div id="resolved-incidents-section"></div>
          <div id="failures-section"></div>
          <div id="incidents-trend-section"></div>
          <div style="margin-top:20px">
            <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap;padding:12px;background:var(--navy-2);border-radius:var(--r)">
              <input type="text" id="incidentSearch" placeholder="Search by title or alert ID..."
                     onkeyup="updateIncidentsDisplay()"
                     style="flex:1;min-width:200px;padding:6px 10px;background:var(--navy-1);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:.85rem">
              <select id="incidentStatusFilter" onchange="updateIncidentsDisplay()"
                      style="padding:6px 10px;background:var(--navy-1);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:.85rem">
                <option value="All">All Statuses</option>
                <option value="ESCALATED">ESCALATED</option>
                <option value="INVESTIGATING">INVESTIGATING</option>
                <option value="RCA_COMPLETE">RCA Complete</option>
                <option value="REMEDIATING">Remediating</option>
                <option value="RESOLVED">Resolved</option>
                <option value="MANUAL">Manual</option>
              </select>
              <select id="incidentSort" onchange="updateIncidentsDisplay()"
                      style="padding:6px 10px;background:var(--navy-1);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:.85rem">
                <option value="oldest-first">Oldest First</option>
                <option value="newest-first">Newest First</option>
                <option value="most-recurring">Most Recurring</option>
              </select>
            </div>
            <div style="font-size:.85rem;color:var(--text-muted);font-weight:600;margin-bottom:12px">🛣 PRIORITY LANES</div>
            <div id="incidentsLanesContainer">${lanesHTML}</div>
          </div>
        `;

        setTimeout(() => {
          attachIncidentCardListeners();
        }, 50);
        renderMttxKpis();
        renderPipelineSummary();
        renderOpenIncidentsSection();
        renderResolvedIncidentsSection();
        renderFailuresSection();
        renderIncidentsTrendSection();

        // Attach event listeners to ticket cards for modal opening
        document.querySelectorAll('.ticket-card').forEach(card => {
          const ticketId = card.getAttribute('data-ticket-id');
          if (ticketId && _ticketsMap[ticketId]) {
            card.addEventListener('click', () => openTicketModal(_ticketsMap[ticketId]));
            card.addEventListener('mouseover', () => { card.style.background = 'var(--navy-2)'; });
            card.addEventListener('mouseout', () => { card.style.background = 'var(--navy-1)'; });
          }
        });
      } catch (e) {
        el.innerHTML = emptyState('⚠️', 'Failed to load incidents', e.message);
      }
    }

    // ── AI Insights ──────────────────────────────────────────────────────────
    let _insightsCache = null;
    let _insightsCacheTs = null;

    function renderInsights() {
      const el = document.getElementById('tab-insights');
      if (!stats) {
        el.innerHTML = '<div style="padding:48px;text-align:center;color:var(--text-muted)"><div style="font-size:2rem;margin-bottom:8px">🤖</div><div style="font-weight:600;margin-bottom:4px">No alert data loaded</div><div style="font-size:.85rem">Run a sync first, then return here.</div></div>';
        return;
      }
      el.innerHTML = `
        <div class="panel-card" style="border-color:var(--accent)">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px">
            <div class="section-title" style="margin:0;color:var(--accent)">🤖 AI Alert Insights</div>
            <button class="btn btn--primary" id="genInsightsBtn" onclick="generateInsights()">⚡ Generate Insights</button>
          </div>
          <div id="insightsTs" style="font-size:.78rem;color:var(--text-muted);margin-bottom:10px;display:none"></div>
          <div id="insightsBody" style="font-size:.88rem;line-height:1.7;color:var(--text-muted)">
            Click <strong>Generate Insights</strong> to have Claude analyse your alert data and produce an executive summary, noise breakdown, team patterns, and recommended actions.
          </div>
        </div>`;
      if (_insightsCache) {
        document.getElementById('insightsBody').innerHTML = _insightsCache;
        const tsEl = document.getElementById('insightsTs');
        tsEl.style.display = 'block';
        tsEl.textContent = 'Last generated: ' + _insightsCacheTs;
        const btn = document.getElementById('genInsightsBtn');
        btn.textContent = '🔄 Regenerate Insights';
        btn.onclick = () => generateInsights(true);
      }
    }

    function buildInsightsPrompt() {
      const s = stats;
      const payload = {
        total_alerts: s.total_alerts,
        genuine_count: s.genuine_count,
        noise_count: s.noise_count,
        suspect_count: s.suspect_count,
        noise_ratio_pct: s.noise_ratio ? (s.noise_ratio * 100).toFixed(1) : null,
        top_noise_sources: (s.top_noise_sources || []).slice(0, 10),
        top_genuine_sources: (s.top_genuine_sources || []).slice(0, 10),
        team_breakdown: s.team_breakdown || [],
        priority_breakdown: s.priority_breakdown || {},
        suppression_recommendations: (s.suppression_recommendations || []).slice(0, 5),
        repeat_offenders: (s.repeat_offenders || []).slice(0, 5),
      };
      return `You are a senior SRE. Analyse this alert intelligence data and produce a markdown report with these sections:\n\n## Executive Summary\n3-4 sentences on alert volume, noise ratio, and headline concerns.\n\n## Top Noise Sources\nWorst offenders driving noise with recommended tuning actions.\n\n## Team Alert Patterns\nWhich teams have highest genuine burden vs noise.\n\n## Recommended Actions\nNumbered list of 3-5 concrete actions for this week.\n\nData:\n\`\`\`json\n${JSON.stringify(payload, null, 2)}\n\`\`\``;
    }

    async function generateInsights(force = false) {
      const btn = document.getElementById('genInsightsBtn');
      const body = document.getElementById('insightsBody');
      const tsEl = document.getElementById('insightsTs');
      if (!force && _insightsCache) { body.innerHTML = _insightsCache; return; }
      btn.disabled = true;
      btn.textContent = '⏳ Generating...';
      body.innerHTML = '';
      const msgs = ['Analysing alert patterns...','Reviewing noise sources...','Evaluating team workload...','Preparing recommendations...'];
      let mi = 0;
      const pel = document.createElement('div');
      pel.style.cssText = 'color:var(--text-muted);font-style:italic;padding:12px 0;';
      pel.textContent = msgs[0];
      body.appendChild(pel);
      const pi = setInterval(() => { mi = (mi+1)%msgs.length; pel.textContent = msgs[mi]; }, 2000);
      let firstToken = false, fullText = '';
      let sseBuffer = '';
      let done_reading = false;
      let stopReason = 'end_turn';
      try {
        const sid = (typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r=Math.random()*16|0; return (c=='x'?r:(r&0x3|0x8)).toString(16); }));
        const response = await fetch(`${PROXY}/invoke/stream-insights`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ..._authHeaders() },
          body: JSON.stringify({ session_id: sid, user_message: buildInsightsPrompt(), history: [], context: {} }),
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done || done_reading) break;
          sseBuffer += decoder.decode(value, { stream: true });
          const lines = sseBuffer.split('\n');
          sseBuffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6).trimEnd();
            if (data.startsWith('[STOP_REASON]')) { stopReason = data.slice(14).trim(); continue; }
            if (data === '[DONE]') { done_reading = true; break; }
            if (data.startsWith('[ERROR]')) throw new Error(data.slice(7).trim());
            if (!firstToken) { firstToken = true; clearInterval(pi); body.innerHTML = ''; }
            fullText += data.replace(/\\n/g, '\n');
            body.innerHTML = marked.parse(fullText);
          }
        }
        _insightsCache = body.innerHTML;
        _insightsCacheTs = new Date().toLocaleString();
        tsEl.style.display = 'block';
        tsEl.textContent = 'Last generated: ' + _insightsCacheTs;
        btn.textContent = '🔄 Regenerate Insights';
        btn.disabled = false;
        btn.onclick = () => generateInsights(true);

        // If the model hit the token cap, offer to continue
        if (stopReason === 'max_tokens') {
          const continueBtn = document.createElement('button');
          continueBtn.className = 'btn btn--primary';
          continueBtn.style.cssText = 'margin-top:8px';
          continueBtn.textContent = 'Continue Analysis ›';
          continueBtn.onclick = async () => {
            continueBtn.remove();
            btn.disabled = true;
            stopReason = 'end_turn';
            sseBuffer = '';
            done_reading = false;
            try {
              const contResp = await fetch(`${PROXY}/invoke/stream-insights`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ..._authHeaders() },
                body: JSON.stringify({ session_id: sid, user_message: buildInsightsPrompt(), history: [], context: { continuation_of: fullText } }),
              });
              if (!contResp.ok) throw new Error('HTTP ' + contResp.status);
              const contReader = contResp.body.getReader();
              const contDecoder = new TextDecoder();
              while (true) {
                const { done, value } = await contReader.read();
                if (done || done_reading) break;
                sseBuffer += contDecoder.decode(value, { stream: true });
                const lines = sseBuffer.split('\n');
                sseBuffer = lines.pop();
                for (const line of lines) {
                  if (!line.startsWith('data: ')) continue;
                  const data = line.slice(6).trimEnd();
                  if (data.startsWith('[STOP_REASON]')) { stopReason = data.slice(14).trim(); continue; }
                  if (data === '[DONE]') { done_reading = true; break; }
                  if (data.startsWith('[ERROR]')) { done_reading = true; break; }
                  fullText += data.replace(/\\n/g, '\n');
                  body.innerHTML = marked.parse(fullText);
                }
              }
              _insightsCache = body.innerHTML;
              btn.disabled = false;
              if (stopReason === 'max_tokens') btn.parentElement.appendChild(continueBtn);
            } catch(err) {
              clearInterval(pi);
              body.innerHTML += '<div style="color:var(--danger);margin-top:12px">Continuation failed: ' + (err.message || err) + '</div>';
              btn.disabled = false;
              btn.textContent = '⚡ Generate Insights';
            }
          };
          btn.parentElement.appendChild(continueBtn);
        }
      } catch(err) {
        clearInterval(pi);
        body.innerHTML = '<span style="color:var(--danger)">Failed: ' + err.message + '</span>';
        btn.disabled = false;
        btn.textContent = '⚡ Generate Insights';
      }
    }

    _initDefaultDateRange();
    loadDashboard();
  </script>
  <script>
    // ── Fix nav links in standalone mode ──────────────────────────────────
    if (typeof _isPortalMode !== 'undefined' && !_isPortalMode) {
      document.querySelectorAll('[data-standalone-href]').forEach(el => {
        el.href = el.dataset.standaloneHref;
      });
    }

    mountUserBadge('#user-badge-slot');
    (function() {
      const authMode = window.__CONFIG__?.AUTH_MODE || 'none';
      const adminLink = document.getElementById('nav-admin');
      if (authMode !== 'local') {
        if (adminLink) adminLink.style.display = '';
        document.body.style.visibility = 'visible';
        return;
      }
      fetchCurrentUser().then(user => {
        if (!adminLink) { document.body.style.visibility = 'visible'; return; }
        if (!user) { adminLink.style.display = 'none'; document.body.style.visibility = 'visible'; return; }
        const roles = (user.roles || '').split(',');
        if (roles.includes('admin') || roles.includes('developer')) {
          adminLink.style.display = '';
        } else {
          adminLink.style.display = 'none';
        }
        document.body.style.visibility = 'visible';
      });
    })();
  </script>
</body>
</html>
