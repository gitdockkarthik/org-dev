<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUR Reports — UAP</title>
  <link rel="stylesheet" href="/css/style.css?v=3">
  <style>
    body { background: var(--bg); }
    .subnav { display: flex; background: var(--navy-1); border-bottom: 1px solid var(--border); padding: 0 40px; }
    .subnav__link { display: inline-flex; align-items: center; gap: 6px; padding: 13px 16px; font-size: .85rem; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; text-decoration: none; transition: color var(--t), border-color var(--t); }
    .subnav__link:hover { color: var(--text); }
    .subnav__link--active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .content { padding: 28px 40px; }
    .page-heading { margin-bottom: 24px; }
    .page-heading__title { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .page-heading__sub { font-size: .88rem; color: var(--text-muted); }
    .upload-zone { border: 2px dashed var(--border-hi); border-radius: var(--r); padding: 36px 24px; text-align: center; cursor: pointer; transition: border-color var(--t), background var(--t); }
    .upload-zone:hover, .upload-zone--drag { border-color: var(--accent); background: var(--accent-glow); }
    .upload-zone__icon { font-size: 2rem; margin-bottom: 10px; }
    .upload-zone__title { font-weight: 600; margin-bottom: 4px; }
    .upload-zone__sub { font-size: .83rem; color: var(--text-muted); }
    .action-card { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); padding: 20px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
    .action-card__info { flex: 1; }
    .action-card__title { font-weight: 600; margin-bottom: 4px; }
    .action-card__sub { font-size: .83rem; color: var(--text-muted); }
    .section-card { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
    .section-card__header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: .9rem; }
    .data-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .data-table th { padding: 10px 14px; text-align: left; font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-dim); background: var(--navy-2); border-bottom: 1px solid var(--border); }
    .data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--navy-3); }
    @media (max-width: 768px) { .subnav { padding: 0 20px; } .content { padding: 20px; } }
  </style>
</head>
<body style="visibility:hidden">

  <header class="topbar">
    <a href="/" class="topbar__brand">
      <span style="font-size:1.1rem;
      font-weight:700;color:#ffffff;
      letter-spacing:1px;
      font-family:inherit;">OPERATIVE</span>
    </a>
    <nav class="topbar__nav">
      <a href="/" class="topbar__link">Agents</a>
      <a href="/admin/" class="topbar__link" id="nav-admin" style="display:none">Admin</a>
      <a href="/docs-hub/" class="topbar__link" target="_blank">📚 Docs</a>
    </nav>
    <div class="topbar__right" style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:.85rem;color:var(--text-muted)">CUR Analyser</span>
      <div id="user-badge-slot"></div>
    </div>
  </header>

  <nav class="subnav">
    <a href="/chat?agent=cur-analyser" data-standalone-href="chat.html" class="subnav__link">💬 Chat</a>
    <a href="/agents/cur-analyser/dashboard" data-standalone-href="dashboard.html" class="subnav__link">📊 Dashboard</a>
    <a href="/agents/cur-analyser/reports" data-standalone-href="reports.html" class="subnav__link subnav__link--active">📁 Reports</a>
    <a href="/agents/cur-analyser/settings" data-standalone-href="settings.html" class="subnav__link">⚙ Settings</a>
  </nav>

  <div class="content">
    <div class="page-heading">
      <div class="page-heading__title">Reports</div>
      <div class="page-heading__sub">Saved CUR reports loaded for analysis</div>
    </div>

    <!-- File Upload Section -->
    <div class="section-card" id="upload-cur-section" style="margin-bottom:16px;display:none">
      <div class="section-card__header">
        📁 Upload CUR File
        <span style="font-size:.75rem;font-weight:400;color:var(--text-muted)">CSV, CSV.gz, or select a folder of part files</span>
      </div>
      <div style="padding:16px 20px">
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <label class="btn btn--primary" style="cursor:pointer">
            📄 Upload single file
            <input type="file" id="rpt-file-input" accept=".csv,.gz" style="display:none">
          </label>
          <label class="btn btn--secondary" style="cursor:pointer">
            📂 Upload folder (multi-part)
            <input type="file" id="rpt-folder-input" accept=".csv,.gz" multiple webkitdirectory style="display:none">
          </label>
        </div>
        <div id="rpt-upload-msg" style="margin-top:10px;font-size:.83rem"></div>
        <div id="rpt-upload-progress" style="display:none;margin-top:10px">
          <div style="font-size:.83rem;color:var(--text-muted)" id="rpt-progress-text">Uploading...</div>
          <div style="margin-top:6px;background:var(--navy-2);border-radius:4px;height:6px">
            <div id="rpt-progress-bar" style="background:var(--accent);height:6px;border-radius:4px;width:0%;transition:width .3s"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- S3 Browser Section -->
    <div class="section-card" style="margin-bottom:16px">
      <div class="section-card__header">
        ☁️ S3 Browser
        <button class="btn btn--ghost btn--sm" onclick="loadS3Browser()">↻ Refresh</button>
      </div>
      <div id="s3-browser-body" style="padding:16px 20px">
        <div style="color:var(--text-muted);font-size:.85rem">Loading S3 data...</div>
      </div>
    </div>

  </div>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/portal.js?v=3"></script>
  <script>
    // ── Dual-mode detection: works inside Operative portal AND standalone ──
    const _isPortalMode = (typeof window._isPortalEnv !== 'undefined' && window._isPortalEnv === true);
    if (!_isPortalMode) {
      window.BACKEND_URL = '';
      window._authHeaders = () => ({});
      window.portalReady = Promise.resolve();
      window.showToast = (msg, type) => console.log('[toast]', type || 'info', msg);
    }
  </script>
  <script>
    const SLUG  = 'cur-analyser';
    const PROXY = _isPortalMode ? `${BACKEND_URL}/api/agents/${SLUG}/proxy` : '';

    async function api(path, opts = {}) {
      const res = await fetch(`${PROXY}${path}`, {
        ...opts,
        headers: { ..._authHeaders(), ...opts.headers },
      });
      if (!res.ok) {
        const e = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(e.detail || `HTTP ${res.status}`);
      }
      return res.json();
    }

    function formatUSD(v) {
      return '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    async function deleteReport(id, btn) {
      if (!confirm('Delete this report? This removes it from the analysis store.')) return;
      if (btn) btn.disabled = true;
      try {
        await api('/reports/' + id, { method: 'DELETE' });
        showToast('Report deleted', 'success');
        loadReports();
      } catch (e) {
        showToast('Delete failed: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      }
    }

    async function loadReports() {
      // Reports now displayed inside loadS3Browser — auto and manual sections
      // This function kept for compatibility with upload/delete callbacks
      await loadS3Browser();
    }

    (async () => {
      await portalReady;
      await loadS3Browser();
    })();

    let _s3Selected = {};  // { "prefix": { billing_period, folder, file_count, size_mb } }

    async function loadS3Browser() {
      const body = document.getElementById('s3-browser-body');
      try {
        const [browseData, statusData, settingsData] = await Promise.all([
          api('/data-sources/s3/browse'),
          api('/data-sources/s3/status').catch(() => ({})),
          api('/settings').catch(() => ({})),
        ]);

        // Show/hide upload section based on source_type
        const uploadSection = document.getElementById('upload-cur-section');
        if (uploadSection) {
          uploadSection.style.display = settingsData.source_type === 's3' ? 'none' : 'block';
        }

        if (!browseData.s3_configured) {
          body.innerHTML = '<div style="color:var(--text-muted);font-size:.85rem">S3 not configured. Set bucket and prefix in <a href="/agents/cur-analyser/settings">Settings → Data Source</a>.</div>';
          return;
        }
        if (browseData.error) {
          body.innerHTML = `<div style="color:var(--danger);font-size:.85rem">Error: ${browseData.error}</div>`;
          return;
        }

        // Last synced status bar
        const lastSynced = statusData.last_synced_at
          ? new Date(statusData.last_synced_at).toLocaleString('en-GB', {timeZone:'UTC'}) + ' UTC'
          : 'Never';
        const isLatest = statusData.is_latest;
        let syncBar = `
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding:12px 16px;background:var(--navy-2);border-radius:6px;border:1px solid var(--border)">
            <div>
              <div style="font-size:.72rem;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-bottom:2px">Last Auto-Sync</div>
              <div style="font-weight:600">${lastSynced}</div>
              ${isLatest
                ? '<div style="font-size:.78rem;color:var(--success)">✓ Dashboard data is up to date</div>'
                : '<div style="font-size:.78rem;color:#f59e0b">⚠ Newer data available in S3</div>'}
            </div>
            <div style="text-align:right">
              <div style="font-size:.72rem;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-bottom:2px">Next Auto-Sync</div>
              <div style="font-weight:600;font-size:.85rem">06:30, 13:30, 22:30 UTC</div>
              <div style="font-size:.75rem;color:var(--text-muted)">Job Server managed</div>
            </div>
          </div>
          <div id="sync-latest-status" style="font-size:.82rem;color:var(--text-muted);margin-bottom:12px"></div>`;

        if (!browseData.billing_periods || !browseData.billing_periods.length) {
          body.innerHTML = syncBar + '<div style="color:var(--text-muted);font-size:.85rem">No billing periods found in S3.</div>';
          return;
        }

        // Auto-sync report table
        const autoReports = await api('/reports').then(r => r.filter(x => x.sync_type === 'auto')).catch(() => []);
        const autoRow = autoReports[0];
        let autoHtml = `
          <div style="margin-bottom:16px">
            <div style="font-size:.88rem;font-weight:600;margin-bottom:8px">🔄 Auto-Sync Report</div>`;
        if (autoRow) {
          autoHtml += `<div style="overflow-x:auto"><table class="data-table">
            <thead><tr><th>Filename</th><th>Rows</th><th>Total Cost</th><th>Size</th><th>Status</th><th>Synced (UTC)</th><th>Actions</th></tr></thead>
            <tbody><tr>
              <td>🔄 ${autoRow.filename}</td>
              <td>${(autoRow.row_count||0).toLocaleString()}</td>
              <td style="font-weight:600;color:var(--accent)">${formatUSD(autoRow.total_cost||0)}</td>
              <td>${formatSize(autoRow.file_size||0)}</td>
              <td><span class="badge badge--published">${autoRow.status}</span></td>
              <td style="font-size:.78rem;color:var(--text-muted)">${new Date(autoRow.created_at).toLocaleString('en-GB',{timeZone:'UTC'})} UTC</td>
              <td style="display:flex;gap:6px">
                <a href="/agents/cur-analyser/dashboard" class="btn btn--ghost btn--sm">📊 Dashboard</a>
                <a href="/agents/cur-analyser/chat" class="btn btn--ghost btn--sm">💬 Chat</a>
              </td>
            </tr></tbody>
          </table></div>`;
        } else {
          autoHtml += `<div style="color:var(--text-muted);font-size:.85rem;padding:12px 0">No auto-sync report yet. Sync runs hourly.</div>`;
        }
        autoHtml += `</div>`;

        // Historical browser section
        let browseHtml = `
          <div style="margin-bottom:10px">
            <div style="font-size:.88rem;font-weight:600;margin-bottom:4px">📂 Historical Data — Browse & Select</div>
            <div style="font-size:.78rem;color:var(--text-muted)">
              ℹ️ Only the latest export per day is shown (AWS updates CUR ~3x daily — older exports for the same day are superseded).
              Syncs run sequentially to prevent memory issues.
            </div>
          </div>`;

        for (const bp of browseData.billing_periods) {
          const period = bp.billing_period.replace('BILLING_PERIOD=', '');
          // Group by date — keep only latest folder per date
          const byDate = {};
          for (const f of bp.folders) {
            const date = f.folder.split('T')[0];
            if (!byDate[date] || f.folder > byDate[date].folder) {
              byDate[date] = f;
            }
          }
          const latestPerDay = Object.values(byDate).sort((a,b) => b.folder.localeCompare(a.folder));

          browseHtml += `<div style="margin-bottom:16px">
            <div style="font-weight:600;font-size:.9rem;margin-bottom:8px;color:var(--accent)">
              📅 ${period}
              <span style="font-size:.75rem;font-weight:400;color:var(--text-muted)">
                ${bp.folder_count} total exports · showing ${latestPerDay.length} (latest per day)
              </span>
            </div>
            <div style="overflow-x:auto">
              <table class="data-table">
                <thead><tr>
                  <th>Date</th>
                  <th>Files</th>
                  <th>Size</th>
                  <th>Last Modified in S3</th>
                  <th>Est. Sync Time</th>
                  <th>Action</th>
                </tr></thead>
                <tbody>`;

          for (let i = 0; i < latestPerDay.length; i++) {
            const f = latestPerDay[i];
            const date = f.folder.split('T')[0];
            const isSelected = _s3Selected[f.prefix];
            const estMins = Math.round((f.size_mb / 22 + f.file_count * 24 + 30) / 60 * 10) / 10;
            const isLatestFolder = i === 0;
            browseHtml += `<tr>
              <td style="font-weight:600">${date}${isLatestFolder ? ' <span style="font-size:.7rem;background:#dcfce7;color:#15803d;padding:1px 6px;border-radius:8px">latest</span>' : ''}</td>
              <td>${f.file_count} files</td>
              <td>${f.size_mb} MB</td>
              <td style="font-size:.78rem;color:var(--text-muted)">${f.latest_modified ? new Date(f.latest_modified).toLocaleString('en-GB', {timeZone:'UTC'}) + ' UTC' : '—'}</td>
              <td style="font-size:.78rem;color:var(--text-muted)">~${estMins} min</td>
              <td>
                <button class="btn btn--${isSelected ? 'primary' : 'ghost'} btn--sm"
                  onclick="toggleS3Select('${f.prefix}', '${period}', '${f.folder}', ${f.file_count}, ${f.size_mb}, ${estMins}, this)">
                  ${isSelected ? '✓ Selected' : 'Select'}
                </button>
              </td>
            </tr>`;
          }
          browseHtml += `</tbody></table></div></div>`;
        }

        // Manual reports table
        const manualReports = await api('/reports').then(r => r.filter(x => x.sync_type !== 'auto')).catch(() => []);
        let manualHtml = `
          <div style="margin-top:8px">
            <div style="font-size:.88rem;font-weight:600;margin-bottom:8px">🗂 Manually Synced Reports</div>`;
        if (manualReports.length) {
          const manualRows = manualReports.map(r => `<tr>
            <td>🗂 ${r.filename}</td>
            <td>${(r.row_count||0).toLocaleString()}</td>
            <td style="font-weight:600;color:var(--accent)">${formatUSD(r.total_cost||0)}</td>
            <td>${formatSize(r.file_size||0)}</td>
            <td><span class="badge badge--published">${r.status}</span></td>
            <td style="font-size:.78rem;color:var(--text-muted)">${new Date(r.created_at).toLocaleString('en-GB',{timeZone:'UTC'})} UTC</td>
            <td style="display:flex;gap:6px">
              <a href="/agents/cur-analyser/dashboard" class="btn btn--ghost btn--sm">📊 Dashboard</a>
              <a href="/agents/cur-analyser/chat" class="btn btn--ghost btn--sm">💬 Chat</a>
              <button class="btn btn--ghost btn--sm" onclick="deleteReport(${r.id}, this)">🗑 Delete</button>
            </td>
          </tr>`).join('');
          manualHtml += `<div style="overflow-x:auto"><table class="data-table">
            <thead><tr><th>Filename</th><th>Rows</th><th>Total Cost</th><th>Size</th><th>Status</th><th>Synced (UTC)</th><th>Actions</th></tr></thead>
            <tbody>${manualRows}</tbody>
          </table></div>`;
        } else {
          manualHtml += `<div style="color:var(--text-muted);font-size:.85rem;padding:12px 0">No manually synced reports. Use the S3 Browser above to select historical data.</div>`;
        }
        manualHtml += `</div>`;

        const selectionBar = `<div id="s3-selection-bar" style="display:none;padding:12px 16px;margin-top:12px;border-top:1px solid var(--border);background:var(--navy-2);border-radius:0 0 6px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:.85rem;font-weight:600">Selected:</span>
          <div id="s3-selected-tags" style="display:flex;gap:6px;flex-wrap:wrap"></div>
          <button class="btn btn--sm" style="background:#1d4ed8;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600" onclick="syncSelected()">⬇ Sync Selected</button>
          <span id="s3-sync-progress" style="font-size:.82rem;color:var(--text-muted)"></span>
        </div>`;
        const divider = '<hr style="border:none;border-top:1px solid var(--border);margin:20px 0">';
        body.innerHTML = syncBar + autoHtml + divider + browseHtml + selectionBar + divider + manualHtml;
      } catch(e) {
        body.innerHTML = `<div style="color:var(--danger);font-size:.85rem">Failed to load: ${e.message}</div>`;
      }
    }

    function toggleS3Select(prefix, period, folder, fileCount, sizeMb, estMins, btn) {
      if (_s3Selected[prefix]) {
        delete _s3Selected[prefix];
        btn.textContent = 'Select';
        btn.className = btn.className.replace('btn--primary', 'btn--ghost');
      } else {
        // Only allow one selection at a time
        if (Object.keys(_s3Selected).length > 0) {
          alert('Only one folder can be synced at a time. Deselect the current selection first.');
          return;
        }
        _s3Selected[prefix] = { period, folder, file_count: fileCount, size_mb: sizeMb, est_mins: estMins };
        btn.textContent = '✓ Selected';
        btn.className = btn.className.replace('btn--ghost', 'btn--primary');
      }
      updateSelectionBar();
    }

    function updateSelectionBar() {
      const bar = document.getElementById('s3-selection-bar');
      const tags = document.getElementById('s3-selected-tags');
      const keys = Object.keys(_s3Selected);
      if (!keys.length) { bar.style.display = 'none'; return; }
      bar.style.display = 'flex';
      tags.innerHTML = keys.map(k => {
        const s = _s3Selected[k];
        return `<span style="background:#0f766e;color:#fff;padding:2px 10px;border-radius:12px;font-size:.78rem">
          ${s.period} · ${s.file_count} files · ~${s.est_mins}min
          <button onclick="toggleS3Select('${k}','${s.period}','${s.folder}',${s.file_count},${s.size_mb},${s.est_mins},document.querySelector('[data-prefix=\\'${k}\\']'))"
            style="background:none;border:none;color:#fff;cursor:pointer;margin-left:4px">✕</button>
        </span>`;
      }).join('');
    }

    let _latestSyncJobId = null;
    let _latestSyncPoller = null;

    async function syncLatest() {
      const btn = document.getElementById('sync-latest-btn');
      const status = document.getElementById('sync-latest-status');
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Starting sync...';
      try {
        const job = await api('/data-sources/s3/sync', { method: 'POST', body: JSON.stringify({}), headers: { 'Content-Type': 'application/json' } });
        _latestSyncJobId = job.job_id;
        if (_latestSyncPoller) clearInterval(_latestSyncPoller);
        _latestSyncPoller = setInterval(async () => {
          try {
            const st = await api('/data-sources/s3/sync-status/' + _latestSyncJobId);
            if (status) status.textContent = st.progress || st.status;
            if (st.status === 'complete' || st.status === 'failed') {
              clearInterval(_latestSyncPoller);
              if (btn) btn.disabled = false;
              await loadReports();
              await loadS3Browser();
            }
          } catch(e) { clearInterval(_latestSyncPoller); if (btn) btn.disabled = false; }
        }, 3000);
      } catch(e) {
        if (status) status.textContent = 'Failed: ' + e.message;
        if (btn) btn.disabled = false;
      }
    }

    let _s3SyncJobIds = [];
    let _s3SyncPoller = null;

    async function syncSelected() {
      const keys = Object.keys(_s3Selected);
      if (!keys.length) return;
      const progress = document.getElementById('s3-sync-progress');
      progress.textContent = `Syncing 1 of ${keys.length}...`;
      // Sequential sync — one at a time to prevent memory spikes
      for (let i = 0; i < keys.length; i++) {
        const prefix = keys[i];
        const sel = _s3Selected[prefix];
        progress.textContent = `Syncing ${i+1} of ${keys.length}: ${sel.period} (~${sel.est_mins} min)...`;
        try {
          const job = await api('/data-sources/s3/sync', {
            method: 'POST',
            body: JSON.stringify({ folder_prefix: prefix }),
            headers: { 'Content-Type': 'application/json' }
          });
          // Wait for this sync to complete before starting next
          await new Promise((resolve) => {
            const poller = setInterval(async () => {
              try {
                const st = await api('/data-sources/s3/sync-status/' + job.job_id);
                progress.textContent = `(${i+1}/${keys.length}) ${st.progress || st.status}`;
                if (st.status === 'complete' || st.status === 'failed') {
                  clearInterval(poller);
                  resolve();
                }
              } catch(e) { clearInterval(poller); resolve(); }
            }, 3000);
          });
        } catch(e) {
          progress.textContent = `Failed: ${e.message}`;
          return;
        }
      }
      progress.textContent = 'All syncs complete';
      await loadReports();
      await loadS3Browser();
      _s3Selected = {};
      updateSelectionBar();
    }

    function pollS3Syncs() {
      if (_s3SyncPoller) clearInterval(_s3SyncPoller);
      _s3SyncPoller = setInterval(async () => {
        const progress = document.getElementById('s3-sync-progress');
        let allDone = true;
        const statuses = [];
        for (const { job_id, prefix } of _s3SyncJobIds) {
          try {
            const st = await api('/data-sources/s3/sync-status/' + job_id);
            statuses.push(`${_s3Selected[prefix]?.period || prefix}: ${st.progress || st.status}`);
            if (st.status !== 'complete' && st.status !== 'failed') allDone = false;
          } catch(e) { allDone = true; }
        }
        progress.textContent = statuses.join(' | ');
        if (allDone) {
          clearInterval(_s3SyncPoller);
          await loadReports();
          await loadS3Browser();
          _s3Selected = {};
          updateSelectionBar();
        }
      }, 3000);
    }

    // File upload handlers
    document.addEventListener('DOMContentLoaded', function() {
      const fileInput = document.getElementById('rpt-file-input');
      if (fileInput) fileInput.addEventListener('change', async (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        ev.target.value = '';
        await uploadFile(file);
      });
      const folderInput = document.getElementById('rpt-folder-input');
      if (folderInput) folderInput.addEventListener('change', async (ev) => {
        const files = [...ev.target.files].filter(f => f.name.endsWith('.gz') || f.name.endsWith('.csv'));
        if (!files.length) { document.getElementById('rpt-upload-msg').textContent = 'No CSV/gz files found'; return; }
        ev.target.value = '';
        await uploadFolder(files);
      });
    });

    async function uploadFile(file) {
      const msg = document.getElementById('rpt-upload-msg');
      const prog = document.getElementById('rpt-upload-progress');
      const bar = document.getElementById('rpt-progress-bar');
      const text = document.getElementById('rpt-progress-text');
      msg.textContent = '';
      prog.style.display = 'block';
      text.textContent = 'Uploading ' + file.name + '...';
      bar.style.width = '0%';
      try {
        const fd = new FormData();
        fd.append('file', file);
        const job = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', `${PROXY}/data-sources/cur/upload`);
          const hdrs = _authHeaders();
          Object.keys(hdrs).forEach(k => xhr.setRequestHeader(k, hdrs[k]));
          xhr.upload.addEventListener('progress', ev => {
            if (ev.lengthComputable) bar.style.width = Math.round(ev.loaded/ev.total*100) + '%';
          });
          xhr.addEventListener('load', () => {
            if (xhr.status === 202) { try { resolve(JSON.parse(xhr.responseText)); } catch(e) { reject(new Error('Invalid response')); } }
            else { let d='HTTP '+xhr.status; try{const j=JSON.parse(xhr.responseText);if(j.detail)d=j.detail;}catch(_){} reject(new Error(d)); }
          });
          xhr.addEventListener('error', () => reject(new Error('Network error')));
          xhr.send(fd);
        });
        pollUploadJob(job.job_id, file.name, msg, prog, bar, text);
      } catch(e) {
        prog.style.display = 'none';
        msg.textContent = 'Upload failed: ' + e.message;
        msg.style.color = 'var(--danger)';
      }
    }

    async function uploadFolder(files) {
      const msg = document.getElementById('rpt-upload-msg');
      const prog = document.getElementById('rpt-upload-progress');
      const bar = document.getElementById('rpt-progress-bar');
      const text = document.getElementById('rpt-progress-text');
      msg.textContent = '';
      prog.style.display = 'block';
      text.textContent = 'Uploading ' + files.length + ' files...';
      bar.style.width = '0%';
      try {
        const fd = new FormData();
        files.forEach(f => fd.append('files', f));
        const job = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', `${PROXY}/data-sources/cur/upload-folder`);
          const hdrs = _authHeaders();
          Object.keys(hdrs).forEach(k => xhr.setRequestHeader(k, hdrs[k]));
          xhr.upload.addEventListener('progress', ev => {
            if (ev.lengthComputable) bar.style.width = Math.round(ev.loaded/ev.total*100) + '%';
          });
          xhr.addEventListener('load', () => {
            if (xhr.status === 202) { try { resolve(JSON.parse(xhr.responseText)); } catch(e) { reject(new Error('Invalid response')); } }
            else { let d='HTTP '+xhr.status; try{const j=JSON.parse(xhr.responseText);if(j.detail)d=j.detail;}catch(_){} reject(new Error(d)); }
          });
          xhr.addEventListener('error', () => reject(new Error('Network error')));
          xhr.send(fd);
        });
        pollUploadJob(job.job_id, files[0].name, msg, prog, bar, text);
      } catch(e) {
        prog.style.display = 'none';
        msg.textContent = 'Upload failed: ' + e.message;
        msg.style.color = 'var(--danger)';
      }
    }

    async function pollUploadJob(jobId, filename, msg, prog, bar, text) {
      const poll = setInterval(async () => {
        try {
          const st = await api('/data-sources/cur/upload-status/' + jobId);
          text.textContent = st.status === 'processing' ? 'Processing ' + filename + '...' : st.status;
          bar.style.width = '100%';
          if (st.status === 'ready') {
            clearInterval(poll);
            prog.style.display = 'none';
            msg.textContent = '✓ Report loaded successfully';
            msg.style.color = 'var(--success)';
            await loadReports();
          } else if (st.status === 'failed') {
            clearInterval(poll);
            prog.style.display = 'none';
            msg.textContent = 'Failed: ' + (st.error || 'Unknown error');
            msg.style.color = 'var(--danger)';
          }
        } catch(e) { clearInterval(poll); }
      }, 3000);
    }
  </script>
  <script>
    // ── Fix nav links in standalone mode ──────────────────────────────────
    if (!_isPortalMode) {
      document.querySelectorAll('[data-standalone-href]').forEach(el => {
        el.href = el.dataset.standaloneHref;
      });
      var topbar = document.querySelector('.topbar');
      if (topbar) topbar.style.display = 'none';
    }

    mountUserBadge('#user-badge-slot');
    (function() {
      const authMode = window.__CONFIG__?.AUTH_MODE || 'none';
      const adminLink = document.getElementById('nav-admin');
      if (authMode !== 'local') {
        if (adminLink) adminLink.style.display = '';
        document.body.style.visibility = 'visible';
        return;
      }
      fetchCurrentUser().then(user => {
        if (!adminLink) { document.body.style.visibility = 'visible'; return; }
        if (!user) { adminLink.style.display = 'none'; document.body.style.visibility = 'visible'; return; }
        const roles = (user.roles || '').split(',');
        if (roles.includes('admin') || roles.includes('developer')) {
          adminLink.style.display = '';
        } else {
          adminLink.style.display = 'none';
        }
        document.body.style.visibility = 'visible';
      });
    })();
  </script>
</body>
