<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUR Reports — UAP</title>
  <link rel="stylesheet" href="/css/style.css?v=3">
  <style>
    body { background: var(--bg); }
    .subnav { display: flex; background: var(--navy-1); border-bottom: 1px solid var(--border); padding: 0 40px; }
    .subnav__link { display: inline-flex; align-items: center; gap: 6px; padding: 13px 16px; font-size: .85rem; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; text-decoration: none; transition: color var(--t), border-color var(--t); }
    .subnav__link:hover { color: var(--text); }
    .subnav__link--active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .content { padding: 28px 40px; }
    .page-heading { margin-bottom: 24px; }
    .page-heading__title { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .page-heading__sub { font-size: .88rem; color: var(--text-muted); }
    .upload-zone { border: 2px dashed var(--border-hi); border-radius: var(--r); padding: 36px 24px; text-align: center; cursor: pointer; transition: border-color var(--t), background var(--t); }
    .upload-zone:hover, .upload-zone--drag { border-color: var(--accent); background: var(--accent-glow); }
    .upload-zone__icon { font-size: 2rem; margin-bottom: 10px; }
    .upload-zone__title { font-weight: 600; margin-bottom: 4px; }
    .upload-zone__sub { font-size: .83rem; color: var(--text-muted); }
    .action-card { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); padding: 20px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
    .action-card__info { flex: 1; }
    .action-card__title { font-weight: 600; margin-bottom: 4px; }
    .action-card__sub { font-size: .83rem; color: var(--text-muted); }
    .section-card { background: var(--navy-1); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
    .section-card__header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: .9rem; }
    .data-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .data-table th { padding: 10px 14px; text-align: left; font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-dim); background: var(--navy-2); border-bottom: 1px solid var(--border); }
    .data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--navy-3); }
    @media (max-width: 768px) { .subnav { padding: 0 20px; } .content { padding: 20px; } }
  </style>
</head>
<body style="visibility:hidden">

  <header class="topbar">
    <a href="/" class="topbar__brand">
      <span style="font-size:1.1rem;
      font-weight:700;color:#ffffff;
      letter-spacing:1px;
      font-family:inherit;">OPERATIVE</span>
    </a>
    <nav class="topbar__nav">
      <a href="/" class="topbar__link">Agents</a>
      <a href="/admin/" class="topbar__link" id="nav-admin" style="display:none">Admin</a>
      <a href="/docs-hub/" class="topbar__link" target="_blank">📚 Docs</a>
    </nav>
    <div class="topbar__right" style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:.85rem;color:var(--text-muted)">CUR Analyser</span>
      <div id="user-badge-slot"></div>
    </div>
  </header>

  <nav class="subnav">
    <a href="/chat?agent=cur-analyser" data-standalone-href="chat.html" class="subnav__link">💬 Chat</a>
    <a href="/agents/cur-analyser/dashboard" data-standalone-href="dashboard.html" class="subnav__link">📊 Dashboard</a>
    <a href="/agents/cur-analyser/reports" data-standalone-href="reports.html" class="subnav__link subnav__link--active">📁 Reports</a>
    <a href="/agents/cur-analyser/settings" data-standalone-href="settings.html" class="subnav__link">⚙ Settings</a>
  </nav>

  <div class="content">
    <div class="page-heading">
      <div class="page-heading__title">Reports</div>
      <div class="page-heading__sub">Saved CUR reports loaded for analysis</div>
    </div>

    <!-- File Upload Section -->
    <div class="section-card" style="margin-bottom:16px">
      <div class="section-card__header">
        📁 Upload CUR File
        <span style="font-size:.75rem;font-weight:400;color:var(--text-muted)">CSV, CSV.gz, or select a folder of part files</span>
      </div>
      <div style="padding:16px 20px">
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <label class="btn btn--primary" style="cursor:pointer">
            📄 Upload single file
            <input type="file" id="rpt-file-input" accept=".csv,.gz" style="display:none">
          </label>
          <label class="btn btn--secondary" style="cursor:pointer">
            📂 Upload folder (multi-part)
            <input type="file" id="rpt-folder-input" accept=".csv,.gz" multiple webkitdirectory style="display:none">
          </label>
        </div>
        <div id="rpt-upload-msg" style="margin-top:10px;font-size:.83rem"></div>
        <div id="rpt-upload-progress" style="display:none;margin-top:10px">
          <div style="font-size:.83rem;color:var(--text-muted)" id="rpt-progress-text">Uploading...</div>
          <div style="margin-top:6px;background:var(--navy-2);border-radius:4px;height:6px">
            <div id="rpt-progress-bar" style="background:var(--accent);height:6px;border-radius:4px;width:0%;transition:width .3s"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- S3 Sync Section -->
    <div class="section-card" style="margin-bottom:16px" id="s3-sync-card">
      <div class="section-card__header">
        ☁️ S3 Sync
        <button class="btn btn--ghost btn--sm" onclick="loadS3Status()">↻ Refresh</button>
      </div>
      <div id="s3-sync-body" style="padding:16px 20px">
        <div style="color:var(--text-muted);font-size:.85rem">Loading S3 status...</div>
      </div>
    </div>

    <!-- Reports table -->
    <div class="section-card">
      <div class="section-card__header">
        Reports
        <button class="btn btn--ghost btn--sm" onclick="loadReports()">↻ Refresh</button>
      </div>
      <div id="reportsBody">
        <div class="empty-state"><div class="empty-state__icon">📁</div><div class="empty-state__title">Loading…</div></div>
      </div>
    </div>
  </div>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/portal.js?v=3"></script>
  <script>
    // ── Dual-mode detection: works inside Operative portal AND standalone ──
    const _isPortalMode = (typeof window._isPortalEnv !== 'undefined' && window._isPortalEnv === true);
    if (!_isPortalMode) {
      window.BACKEND_URL = '';
      window._authHeaders = () => ({});
      window.portalReady = Promise.resolve();
      window.showToast = (msg, type) => console.log('[toast]', type || 'info', msg);
    }
  </script>
  <script>
    const SLUG  = 'cur-analyser';
    const PROXY = _isPortalMode ? `${BACKEND_URL}/api/agents/${SLUG}/proxy` : '';

    async function api(path, opts = {}) {
      const res = await fetch(`${PROXY}${path}`, {
        ...opts,
        headers: { ..._authHeaders(), ...opts.headers },
      });
      if (!res.ok) {
        const e = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(e.detail || `HTTP ${res.status}`);
      }
      return res.json();
    }

    function formatUSD(v) {
      return '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    async function deleteReport(id, btn) {
      if (!confirm('Delete this report? This removes it from the analysis store.')) return;
      if (btn) btn.disabled = true;
      try {
        await api('/reports/' + id, { method: 'DELETE' });
        showToast('Report deleted', 'success');
        loadReports();
      } catch (e) {
        showToast('Delete failed: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      }
    }

    async function loadReports() {
      await portalReady;
      const el = document.getElementById('reportsBody');
      el.innerHTML = '<div class="empty-state"><div class="empty-state__icon">⏳</div><div class="empty-state__title">Loading…</div></div>';
      try {
        const reports = await api('/reports');
        if (!reports.length) {
          el.innerHTML = '<div class="empty-state"><div class="empty-state__icon">📁</div><div class="empty-state__title">No reports yet</div><div class="empty-state__sub">CUR files are managed in Settings → Data Source.</div></div>';
          return;
        }
        const rows = reports.map(r => `<tr>
          <td>${r.filename}</td>
          <td>${(r.row_count || 0).toLocaleString()}</td>
          <td style="font-weight:600;color:var(--accent)">${formatUSD(r.total_cost || 0)}</td>
          <td>${formatSize(r.file_size || 0)}</td>
          <td><span class="badge badge--published">${r.status}</span></td>
          <td style="font-size:.78rem;color:var(--text-muted)">${new Date(r.created_at).toLocaleString()}</td>
          <td style="display:flex;gap:6px">
    <a href="/agents/cur-analyser/dashboard" data-standalone-href="dashboard.html" class="btn btn--ghost btn--sm">📊 Dashboard</a>
    <a href="/chat?agent=cur-analyser" data-standalone-href="chat.html" class="btn btn--ghost btn--sm">💬 Chat</a>
    <button class="btn btn--ghost btn--sm" onclick="deleteReport(${r.id}, this)">🗑 Delete</button>
          </td>
        </tr>`).join('');
        el.innerHTML = `<div style="overflow-x:auto"><table class="data-table">
          <thead><tr><th>Filename</th><th>Rows</th><th>Total Cost</th><th>Size</th><th>Status</th><th>Uploaded</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
      } catch (e) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state__icon">⚠</div><div class="empty-state__title">Failed to load</div><div class="empty-state__sub">${e.message}</div></div>`;
      }
    }

    (async () => {
      await portalReady;
      await loadReports();
      await loadS3Status();
    })();

    async function loadS3Status() {
      const body = document.getElementById('s3-sync-body');
      try {
        const st = await api('/data-sources/s3/status');
        if (!st.s3_configured) {
          body.innerHTML = '<div style="color:var(--text-muted);font-size:.85rem">S3 not configured. Set bucket and prefix in <a href="/agents/cur-analyser/settings">Settings → Data Source</a>.</div>';
          return;
        }
        const isLatest = st.is_latest;
        const gap = st.last_synced_at ? '' : 'Never synced';
        body.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
            <div>
              <div style="font-size:.72rem;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-bottom:4px">Latest in S3</div>
              <div style="font-weight:600">${st.latest_s3_timestamp || '—'}</div>
              <div style="font-size:.78rem;color:var(--text-muted)">${st.latest_s3_file_count} files · ${st.latest_s3_size_mb} MB</div>
            </div>
            <div>
              <div style="font-size:.72rem;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-bottom:4px">Last Synced</div>
              <div style="font-weight:600">${st.last_synced_at ? new Date(st.last_synced_at).toLocaleString() : 'Never'}</div>
              <div style="font-size:.78rem;color:var(--text-muted)">${st.last_synced_folder || '—'}</div>
            </div>
          </div>
          ${isLatest
            ? '<div style="color:var(--success);font-size:.85rem;margin-bottom:12px">✓ Agent data is up to date with S3</div>'
            : '<div style="color:#f59e0b;font-size:.85rem;margin-bottom:12px">⚠ Newer data available in S3</div>'
          }
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <button class="btn btn--primary" onclick="startS3Sync()" id="s3-sync-btn">
              ${isLatest ? '↻ Re-sync' : '⬇ Sync Now'}
            </button>
            <span style="font-size:.78rem;color:var(--text-muted)">Estimated time: ~${st.estimated_sync_minutes} min</span>
            <span id="s3-sync-status" style="font-size:.82rem"></span>
          </div>`;
      } catch(e) {
        body.innerHTML = '<div style="color:var(--danger);font-size:.85rem">Failed to load S3 status: ' + e.message + '</div>';
      }
    }

    let _s3SyncJobId = null;
    let _s3SyncPoller = null;

    async function startS3Sync() {
      const btn = document.getElementById('s3-sync-btn');
      const statusEl = document.getElementById('s3-sync-status');
      if (btn) btn.disabled = true;
      if (statusEl) statusEl.textContent = 'Starting sync...';
      try {
        const job = await api('/data-sources/s3/sync', { method: 'POST' });
        _s3SyncJobId = job.job_id;
        pollS3Sync();
      } catch(e) {
        if (statusEl) statusEl.textContent = 'Failed: ' + e.message;
        if (btn) btn.disabled = false;
      }
    }

    function pollS3Sync() {
      if (_s3SyncPoller) clearInterval(_s3SyncPoller);
      _s3SyncPoller = setInterval(async () => {
        try {
          const st = await api('/data-sources/s3/sync-status/' + _s3SyncJobId);
          const statusEl = document.getElementById('s3-sync-status');
          if (statusEl) statusEl.textContent = st.progress || st.status;
          if (st.status === 'complete' || st.status === 'failed') {
            clearInterval(_s3SyncPoller);
            const btn = document.getElementById('s3-sync-btn');
            if (btn) btn.disabled = false;
            await loadS3Status();
            await loadReports();
          }
        } catch(e) { clearInterval(_s3SyncPoller); }
      }, 3000);
    }

    // File upload handlers
    document.addEventListener('DOMContentLoaded', function() {
      const fileInput = document.getElementById('rpt-file-input');
      if (fileInput) fileInput.addEventListener('change', async (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        ev.target.value = '';
        await uploadFile(file);
      });
      const folderInput = document.getElementById('rpt-folder-input');
      if (folderInput) folderInput.addEventListener('change', async (ev) => {
        const files = [...ev.target.files].filter(f => f.name.endsWith('.gz') || f.name.endsWith('.csv'));
        if (!files.length) { document.getElementById('rpt-upload-msg').textContent = 'No CSV/gz files found'; return; }
        ev.target.value = '';
        await uploadFolder(files);
      });
    });

    async function uploadFile(file) {
      const msg = document.getElementById('rpt-upload-msg');
      const prog = document.getElementById('rpt-upload-progress');
      const bar = document.getElementById('rpt-progress-bar');
      const text = document.getElementById('rpt-progress-text');
      msg.textContent = '';
      prog.style.display = 'block';
      text.textContent = 'Uploading ' + file.name + '...';
      bar.style.width = '0%';
      try {
        const fd = new FormData();
        fd.append('file', file);
        const job = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', `${PROXY}/data-sources/cur/upload`);
          const hdrs = _authHeaders();
          Object.keys(hdrs).forEach(k => xhr.setRequestHeader(k, hdrs[k]));
          xhr.upload.addEventListener('progress', ev => {
            if (ev.lengthComputable) bar.style.width = Math.round(ev.loaded/ev.total*100) + '%';
          });
          xhr.addEventListener('load', () => {
            if (xhr.status === 202) { try { resolve(JSON.parse(xhr.responseText)); } catch(e) { reject(new Error('Invalid response')); } }
            else { let d='HTTP '+xhr.status; try{const j=JSON.parse(xhr.responseText);if(j.detail)d=j.detail;}catch(_){} reject(new Error(d)); }
          });
          xhr.addEventListener('error', () => reject(new Error('Network error')));
          xhr.send(fd);
        });
        pollUploadJob(job.job_id, file.name, msg, prog, bar, text);
      } catch(e) {
        prog.style.display = 'none';
        msg.textContent = 'Upload failed: ' + e.message;
        msg.style.color = 'var(--danger)';
      }
    }

    async function uploadFolder(files) {
      const msg = document.getElementById('rpt-upload-msg');
      const prog = document.getElementById('rpt-upload-progress');
      const bar = document.getElementById('rpt-progress-bar');
      const text = document.getElementById('rpt-progress-text');
      msg.textContent = '';
      prog.style.display = 'block';
      text.textContent = 'Uploading ' + files.length + ' files...';
      bar.style.width = '0%';
      try {
        const fd = new FormData();
        files.forEach(f => fd.append('files', f));
        const job = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', `${PROXY}/data-sources/cur/upload-folder`);
          const hdrs = _authHeaders();
          Object.keys(hdrs).forEach(k => xhr.setRequestHeader(k, hdrs[k]));
          xhr.upload.addEventListener('progress', ev => {
            if (ev.lengthComputable) bar.style.width = Math.round(ev.loaded/ev.total*100) + '%';
          });
          xhr.addEventListener('load', () => {
            if (xhr.status === 202) { try { resolve(JSON.parse(xhr.responseText)); } catch(e) { reject(new Error('Invalid response')); } }
            else { let d='HTTP '+xhr.status; try{const j=JSON.parse(xhr.responseText);if(j.detail)d=j.detail;}catch(_){} reject(new Error(d)); }
          });
          xhr.addEventListener('error', () => reject(new Error('Network error')));
          xhr.send(fd);
        });
        pollUploadJob(job.job_id, files[0].name, msg, prog, bar, text);
      } catch(e) {
        prog.style.display = 'none';
        msg.textContent = 'Upload failed: ' + e.message;
        msg.style.color = 'var(--danger)';
      }
    }

    async function pollUploadJob(jobId, filename, msg, prog, bar, text) {
      const poll = setInterval(async () => {
        try {
          const st = await api('/data-sources/cur/upload-status/' + jobId);
          text.textContent = st.status === 'processing' ? 'Processing ' + filename + '...' : st.status;
          bar.style.width = '100%';
          if (st.status === 'ready') {
            clearInterval(poll);
            prog.style.display = 'none';
            msg.textContent = '✓ Report loaded successfully';
            msg.style.color = 'var(--success)';
            await loadReports();
          } else if (st.status === 'failed') {
            clearInterval(poll);
            prog.style.display = 'none';
            msg.textContent = 'Failed: ' + (st.error || 'Unknown error');
            msg.style.color = 'var(--danger)';
          }
        } catch(e) { clearInterval(poll); }
      }, 3000);
    }
  </script>
  <script>
    // ── Fix nav links in standalone mode ──────────────────────────────────
    if (!_isPortalMode) {
      document.querySelectorAll('[data-standalone-href]').forEach(el => {
        el.href = el.dataset.standaloneHref;
      });
      var topbar = document.querySelector('.topbar');
      if (topbar) topbar.style.display = 'none';
    }

    mountUserBadge('#user-badge-slot');
    (function() {
      const authMode = window.__CONFIG__?.AUTH_MODE || 'none';
      const adminLink = document.getElementById('nav-admin');
      if (authMode !== 'local') {
        if (adminLink) adminLink.style.display = '';
        document.body.style.visibility = 'visible';
        return;
      }
      fetchCurrentUser().then(user => {
        if (!adminLink) { document.body.style.visibility = 'visible'; return; }
        if (!user) { adminLink.style.display = 'none'; document.body.style.visibility = 'visible'; return; }
        const roles = (user.roles || '').split(',');
        if (roles.includes('admin') || roles.includes('developer')) {
          adminLink.style.display = '';
        } else {
          adminLink.style.display = 'none';
        }
        document.body.style.visibility = 'visible';
      });
    })();
  </script>
</body>
</html>
