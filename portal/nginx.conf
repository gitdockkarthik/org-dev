server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2048M;

    location = /login {
        try_files /login.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location /admin/ {
        try_files $uri $uri/ $uri.html /admin/index.html;
    }

    location /docs/ {
        try_files $uri $uri/ $uri.html /docs/index.html;
    }

    location /agents/ {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location = /agent-view {
        try_files /agent-view.html =404;
    }

    # ── Langfuse UI + API (context-based routing) ─────────────────────────
    location /langfuse/ {
        proxy_pass http://langfuse:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        # Strip headers that block iframe embedding
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self'";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '/_next/' '/langfuse/_next/';
        sub_filter '"/api/' '"/langfuse/api/';
        sub_filter "'/api/" "'/langfuse/api/";
        sub_filter 'targetPath=%2F"' 'targetPath=%2Flangfuse%2F"';
        sub_filter "targetPath=%2F'" "targetPath=%2Flangfuse%2F'";
        sub_filter 'callbackUrl=%2F"' 'callbackUrl=%2Flangfuse%2F"';
    }

    location /langfuse/_next/ {
        proxy_pass http://langfuse:3000/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
    }

    location /_next/ {
        proxy_pass http://langfuse:3000/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
    }

    location /langfuse/api/ {
        proxy_pass http://langfuse:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /auth/ {
        proxy_pass http://langfuse:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host ${PORTAL_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /api/auth/ {
        proxy_pass http://langfuse:3000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host ${PORTAL_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /api/trpc/ {
        proxy_pass http://langfuse:3000/api/trpc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Auth-Mode "${AUTH_MODE}";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
